  // Строит запросы к TMDB /discover для подборки cat с учётом выбранных фильтров (год/тип/страна).
  // Возвращает массив {kind, url} — по одному на каждый нужный вид контента (movie и/или tv).
  function buildDiscoverRequests(cat, filters, page){
    let kinds;
    if (filters.type === 'movie') kinds = ['movie'];
    else if (filters.type === 'series') kinds = ['tv'];
    else if (filters.type === 'cartoon') kinds = ['movie'];
    else if (filters.type === 'anime') kinds = ['tv'];
    else if (cat.kind === 'mixed') kinds = ['movie', 'tv'];
    else kinds = [cat.kind];

    return kinds.map(kind => {
      const params = new URLSearchParams();
      let simpleEndpoint = null;

      if (cat.provider || cat.company){
        if (cat.provider){ params.set('with_watch_providers', String(cat.provider)); params.set('watch_region', 'US'); }
        if (cat.company){ params.set('with_companies', String(cat.company)); }
      } else if (cat.path){
        const qIdx = cat.path.indexOf('?');
        const basePath = qIdx === -1 ? cat.path : cat.path.slice(0, qIdx);
        const qs = qIdx === -1 ? '' : cat.path.slice(qIdx + 1);
        if (basePath.indexOf('/discover/') === 0){
          if (qs) new URLSearchParams(qs).forEach((v, k) => params.set(k, v));
        } else if (kind === cat.kind && !filters.year && !filters.country && !filters.type && !filters.genre){
          simpleEndpoint = basePath;
        }
      }

      if (filters.type === 'cartoon'){ params.set('with_genres', '16'); params.delete('with_original_language'); }
      else if (filters.type === 'anime'){ params.set('with_genres', '16'); params.set('with_original_language', 'ja'); }

      if (filters.genre) addGenreFilterToParams(params, filters.genre, kind);

      if (filters.year) params.set(kind === 'tv' ? 'first_air_date_year' : 'primary_release_year', String(filters.year));
      if (filters.country) params.set('with_origin_country', filters.country);

      if (simpleEndpoint) return { kind, url: simpleEndpoint + '?page=' + page };

      if (!params.has('sort_by')) params.set('sort_by', 'popularity.desc');
      params.set('page', String(page));
      return { kind, url: '/discover/' + kind + '?' + params.toString() };
    });
  }

  // Общая логика получения свежего списка тайтлов подборки с TMDB — используется и при первой
  // загрузке категории, и при периодической проверке на новинки (см. checkDiscoverCategoryForUpdates).
  async function fetchDiscoverCategoryItems(cat){
    let items = [];
    if (cat.path){
      const data = await tmdbFetch(cat.path, state.tmdbKey);
      items = (data.results || []).map(r => ({r, kind: cat.kind}));
    } else if (cat.special === 'lgbt'){
      let kwIds = state.discover.lgbtKeywordIds;
      if (!kwIds){
        const [kw1, kw2] = await Promise.all([
          tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
          tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
        ]);
        const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
        const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
        kwIds = [id1, id2].filter(Boolean);
        state.discover.lgbtKeywordIds = kwIds;
      }
      if (kwIds.length){
        const kwParam = kwIds.join('|');
        const [mv, tv] = await Promise.all([
          tmdbFetch('/discover/movie?with_keywords=' + kwParam + '&sort_by=popularity.desc&primary_release_date.gte=2015-01-01', state.tmdbKey),
          tmdbFetch('/discover/tv?with_keywords=' + kwParam + '&sort_by=popularity.desc&first_air_date.gte=2015-01-01', state.tmdbKey)
        ]);
        items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
      }
    } else if (cat.provider || cat.company){
      const param = cat.provider ? ('with_watch_providers=' + cat.provider + '&watch_region=US') : ('with_companies=' + cat.company);
      const [mv, tv] = await Promise.all([
        tmdbFetch('/discover/movie?' + param + '&sort_by=popularity.desc', state.tmdbKey),
        tmdbFetch('/discover/tv?' + param + '&sort_by=popularity.desc', state.tmdbKey)
      ]);
      items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
    }
    items.sort((a,b) => (b.r.popularity || 0) - (a.r.popularity || 0));
    return items.slice(0, 14).map(x => mapTmdbItem(x.r, x.kind));
  }

  // ===== Персистентная метка "новинка" =====
  // Раньше isNew сравнивался только с тем, что уже лежало в state.discover.cache — это чисто оперативная
  // память, и она обнуляется при каждой перезагрузке страницы (в т.ч. просто открыв обновлённую версию
  // приложения). Из-за этого пропадали значки "Новое" у фильмов, хотя сами фильмы никуда не девались —
  // просто заново отрисованный список считался "стартовым срезом", и сравнивать было не с чем.
  // Теперь дата первого обнаружения каждого тайтла в подборке хранится в постоянном хранилище устройства,
  // и бейдж держится NEW_BADGE_WINDOW_MS с момента первого обнаружения — переживает перезагрузки и
  // обновления приложения, а не только "живёт" в рамках одной открытой вкладки.
  const NEW_BADGE_WINDOW_MS = 48 * 60 * 60 * 1000; // сколько времени фильм считается "новинкой" после первого обнаружения

  async function loadSeenMap(catKey){
    try{
      const raw = await rawGet('kinoblo_seen_' + catKey);
      if (!raw) return { map: {}, isFirstEver: true };
      const obj = JSON.parse(raw);
      return { map: (obj && typeof obj === 'object') ? obj : {}, isFirstEver: false };
    }catch(e){ return { map: {}, isFirstEver: true }; }
  }

  // Проставляет item.isNew на основе персистентной истории показов категории и обновляет её,
  // если появились тайтлы, которых раньше в подборке не было. Ничего не удаляет и не фильтрует —
  // список items остаётся тем же самым, меняются только флаги isNew.
  async function applyNewBadges(catKey, items){
    const { map: seenMap, isFirstEver } = await loadSeenMap(catKey);
    const now = Date.now();
    let changed = false;
    items.forEach(item => {
      const id = item.mediaType + '_' + item.tmdbId;
      let firstSeen = seenMap[id];
      if (firstSeen == null){
        // Самый первый раз, когда подборка вообще загружается на этом устройстве — это стартовый срез,
        // а не "новинки", поэтому firstSeen помечается как "давно" (0), чтобы бейдж не появился.
        firstSeen = isFirstEver ? 0 : now;
        seenMap[id] = firstSeen;
        changed = true;
      }
      if (firstSeen && (now - firstSeen) < NEW_BADGE_WINDOW_MS) item.isNew = true;
    });
    if (changed) rawSet('kinoblo_seen_' + catKey, JSON.stringify(seenMap));
    return items;
  }

  async function loadDiscoverCategory(cat){
    if (state.discover.cache[cat.key] || state.discover.loading[cat.key]) return;
    state.discover.loading[cat.key] = true;
    try{
      const items = await fetchDiscoverCategoryItems(cat);
      state.discover.cache[cat.key] = await applyNewBadges(cat.key, items);
      state.discover.cacheTime[cat.key] = Date.now();
    }catch(e){
      state.discover.cache[cat.key] = [];
    }
    state.discover.loading[cat.key] = false;
    renderDiscoverCategoryRow(cat.key);
  }

  async function loadDiscoverFullPage(key){
    const cat = discoverCatByKey(key);
    if (!cat || state.discover.fullLoading[key] || state.discover.fullDone[key]) return;
    state.discover.fullLoading[key] = true;
    
    const loader = document.getElementById('infiniteLoader');
    if (loader) loader.style.display = 'block';

    const filters = getDiscoverFilters(key);
    const page = (state.discover.fullPage[key] || 0) + 1;
    let items = [];
    let newItems = [];
    try{
      if (cat.special === 'lgbt'){
        let kwIds = state.discover.lgbtKeywordIds;
        if (!kwIds){
          const [kw1, kw2] = await Promise.all([
            tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
            tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
          ]);
          const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
          const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
          kwIds = [id1, id2].filter(Boolean);
          state.discover.lgbtKeywordIds = kwIds;
        }
        if (kwIds.length){
          const kwParam = kwIds.join('|');
          let kinds;
          if (filters.type === 'movie' || filters.type === 'cartoon') kinds = ['movie'];
          else if (filters.type === 'series' || filters.type === 'anime') kinds = ['tv'];
          else kinds = ['movie', 'tv'];
          const reqs = kinds.map(kind => {
            const params = new URLSearchParams();
            params.set('with_keywords', kwParam);
            params.set('sort_by', 'popularity.desc');
            params.set('page', String(page));
            if (filters.type === 'cartoon'){ params.set('with_genres', '16'); }
            else if (filters.type === 'anime'){ params.set('with_genres', '16'); params.set('with_original_language', 'ja'); }
            if (filters.genre) addGenreFilterToParams(params, filters.genre, kind);
            if (filters.year) params.set(kind === 'tv' ? 'first_air_date_year' : 'primary_release_year', String(filters.year));
            else params.set(kind === 'tv' ? 'first_air_date.gte' : 'primary_release_date.gte', '2015-01-01');
            if (filters.country) params.set('with_origin_country', filters.country);
            return { kind, url: '/discover/' + kind + '?' + params.toString() };
          });
          const results = await Promise.all(reqs.map(r => tmdbFetch(r.url, state.tmdbKey)));
          items = [];
          results.forEach((data, i) => { items = items.concat((data.results || []).map(r => mapTmdbItem(r, reqs[i].kind))); });
          if (reqs.length > 1) items.sort((a,b) => (b.popularity||0) - (a.popularity||0));
          const maxPages = Math.max.apply(null, results.map(d => d.total_pages || 1));
          if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
        } else { state.discover.fullDone[key] = true; }
      } else {
        const reqs = buildDiscoverRequests(cat, filters, page);
        const results = await Promise.all(reqs.map(r => tmdbFetch(r.url, state.tmdbKey)));
        items = [];
        results.forEach((data, i) => { items = items.concat((data.results || []).map(r => mapTmdbItem(r, reqs[i].kind))); });
        if (reqs.length > 1) items.sort((a,b) => (b.popularity||0) - (a.popularity||0));
        const maxPages = Math.max.apply(null, results.map(d => d.total_pages || 1));
        if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
      }
      const existing = state.discover.full[key] || [];
      const seen = new Set(existing.map(x => x.mediaType + '_' + x.tmdbId));
      newItems = items.filter(x => !seen.has(x.mediaType + '_' + x.tmdbId));
      state.discover.full[key] = existing.concat(newItems);
      state.discover.fullPage[key] = page;
      if (page >= 20) state.discover.fullDone[key] = true;
    }catch(e){
      if (!(state.discover.full[key] || []).length) state.discover.full[key] = [];
      state.discover.fullDone[key] = true;
    }
    state.discover.fullLoading[key] = false;

    // Если мы всё ещё смотрим этот же список — дописываем новые карточки прямо в DOM,
    // не трогая остальную страницу. Полный render() тут не годится: он пересоздаёт
    // #app.innerHTML целиком, из-за чего браузер сбрасывает scrollTop в 0 и ленту
    // откатывало наверх при каждой подгрузке новых фильмов.
    const app = document.getElementById('app');
    const grid = state.view === 'discoverList' && state.discoverListKey === key
      ? app.querySelector('.movies-grid') : null;
    if (grid){
      if (newItems && newItems.length){
        const temp = document.createElement('div');
        temp.innerHTML = newItems.map(discoverCard).join('');
        while (temp.firstChild) grid.appendChild(temp.firstChild);
        bindEvents();
      }
      const loaderEl = document.getElementById('infiniteLoader');
      if (loaderEl){
        if (state.discover.fullDone[key]) loaderEl.remove();
        else loaderEl.style.display = 'none';
      }
    } else {
      render();
    }
  }

  function initInfiniteScroll(){
    const app = document.getElementById('app');
    if(!app) return;
    
    app.addEventListener('scroll', () => {
      if (state.view !== 'discoverList') return;
      const key = state.discoverListKey;
      if (!key) return;

      const scrollTop = app.scrollTop;
      const scrollHeight = app.scrollHeight;
      const clientHeight = app.clientHeight;

      if (scrollTop + clientHeight >= scrollHeight - 300) {
        if (!state.discover.fullLoading[key] && !state.discover.fullDone[key]) {
          loadDiscoverFullPage(key);
        }
      }
    }, {passive: true});
  }

  function openDiscoverList(key){
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    state.discoverListKey = key;
    state.view = 'discoverList';
    render();
    document.getElementById('app').scrollTop = 0;
    if (!(state.discover.full[key] || []).length) loadDiscoverFullPage(key);
  }

  async function tmdbSearch(query, key){
    const data = await tmdbFetch('/search/multi?query=' + encodeURIComponent(query), key);
    let results = (data.results || [])
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .slice(0, 10)
      .map(r => mapTmdbItem(r));
    
    results.sort((a, b) => (a.popularity || 0) - (b.popularity || 0));
    
    return results;
  }

  async function tmdbImages(tmdbId, mediaType, key){
    try{
      const kind = mediaType === 'tv' ? 'tv' : 'movie';
      const res = await fetch('https://api.themoviedb.org/3/' + kind + '/' + tmdbId + '/images?api_key=' + encodeURIComponent(key));
      const data = await res.json();
      const backdrops = data.backdrops || [];
      return backdrops.map(b => 'https://image.tmdb.org/t/p/w780' + b.file_path);
    }catch(e){ return []; }
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Подгоняет размер картинки TMDB под реальный размер отображения — маленькие
  // карточки в сетке/рядах не нуждаются в w500, а полноразмерный w500 в 1.5-2 раза
  // тяжелее нужного и заметно замедляет первую отрисовку списков на мобильном интернете.
  // Для полноэкранных мест (хиро-баннер, фон детальной страницы) размер не трогаем.
  function tmdbImgSize(url, size){
    if (!url) return url;
    return url.replace(/\/t\/p\/(w\d+|original)\//, '/t/p/' + size + '/');
  }

  function openExternal(url){
    if (!url) return;
    if (tg && typeof tg.openLink === 'function'){
      try { tg.openLink(url, {try_instant_view:false}); return; } catch(e){}
    }
    window.open(url, '_blank', 'noopener');
  }

  function tierMeta(r){
    if (r == null) return null;
    if (r >= 1 && r <= 3) return {key:'poop', color:'#c9935a', iconName:'minimalPoop'};
    if (r <= 6) return {key:'pee', color:'#e8c94a', iconName:'minimalMinus'};
    if (r <= 9) return {key:'green', color:'#34d399', iconName:'minimalThumbUp'};
    if (r === 10) return {key:'fire', color:'#ffb347', iconName:'minimalFire'};
    return null;
  }
  
  function ratingPill(m){
    if (m.myRating != null) {
      const t = tierMeta(m.myRating);
      if (!t) return '';
      let svgIcon = '';
      if (t.key === 'poop') svgIcon = icon('minimalPoop', 13);
      else if (t.key === 'pee') svgIcon = icon('minimalMinus', 13);
      else if (t.key === 'green') svgIcon = icon('minimalThumbUp', 13);
      else if (t.key === 'fire') svgIcon = icon('minimalFire', 13);

      return '<div class="rating-pill" style="color:'+t.color+';">' + svgIcon + '<span>'+m.myRating+'</span></div>';
    } else if (m.voteAverage != null) {
      const formatted = m.voteAverage.toFixed(1);
      return '<div class="imdb-pill">' + icon('star', 13) + '<span>'+formatted+'</span></div>';
    }
    return '';
  }

  function genresOf(m){
    if (m.genres && m.genres.length) return m.genres;
    if (m.genre) return [m.genre];
    return [];
  }

  function card(m){
    const tier = (m.myRating != null) ? tierMeta(m.myRating) : null;
    const frameCls = 'poster-frame ' + (tier ? 'tier-'+tier.key : 'tier-none');
    const posterHtml = m.poster ? '<img class="poster" src="'+escapeHtml(tmdbImgSize(m.poster,'w342'))+'" alt="" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML=\'<div class=&quot;poster&quot;>'+escapeHtml(m.title)+'</div>\'">' : '<div class="poster">'+escapeHtml(m.title)+'</div>';
    const typePill = m.type ? '<div class="type-pill">'+typeLabel(m.type)+'</div>' : '';
    const gArr = genresOf(m);
    const subLine = [typeLabel(m.type), gArr.slice(0,2).join(', ')].filter(Boolean).join(' · ');
    const caption = '<div class="poster-caption"><div class="card-title">'+escapeHtml(m.title)+'</div>'+(subLine?'<div class="card-sub">'+escapeHtml(subLine)+'</div>':'')+'</div>';
    
    if (m._sourceType === 'tmdb') {
      return '<div class="card" data-discover-pick="'+m.tmdbId+'" data-discover-type="'+m.mediaType+'"><div class="'+frameCls+'">'+posterHtml+caption+'</div>'+typePill+ratingPill(m)+'</div>';
    }
    return '<div class="card" data-open="'+m.id+'"><div class="'+frameCls+'">'+posterHtml+caption+'</div>'+typePill+ratingPill(m)+'</div>';
  }

  function discoverCard(item){
    const isAlreadyAddedAnywhere = state.movies.some(x => x.tmdbId === item.tmdbId);
    const posterHtml = item.poster ? '<img class="poster" src="'+escapeHtml(tmdbImgSize(item.poster,'w342'))+'" alt="" loading="lazy" decoding="async" onerror="this.parentElement.innerHTML=\'<div class=&quot;poster&quot;>'+escapeHtml(item.title)+'</div>\'">' : '<div class="poster">'+escapeHtml(item.title)+'</div>';
    const typePill = '<div class="type-pill">'+(item.mediaType==='tv'?'Сериал':'Фильм')+'</div>';
    const caption = '<div class="poster-caption"><div class="card-title">'+escapeHtml(item.title)+'</div>'+(item.year?'<div class="card-sub">'+item.year+'</div>':'')+'</div>';
    const newBadge = item.isNew ? '<div class="new-badge">Новое</div>' : '';
    
    return '<div class="card" data-discover-pick="'+item.tmdbId+'" data-discover-type="'+item.mediaType+'">'
      + '<div class="poster-frame tier-none">'+posterHtml+caption+'</div>'
      + typePill
      + newBadge
      + ratingPill(item)
      + '<button type="button" class="search-fav-btn '+(isAlreadyAddedAnywhere?'active':'')+'" data-quick-fav="'+item.tmdbId+'" data-quick-type="'+item.mediaType+'" style="position:absolute;bottom:38px;right:8px;z-index:4;width:32px;height:32px;border-radius:50%;padding:0;" title="Выбрать категорию">'+icon('heart',15)+'</button>'
      + '</div>';
  }

  function getSimilarRecommendations(currentMovie) {
    let poolMap = new Map();
    state.movies.forEach(m => {
      if (m.id !== currentMovie.id && m.tmdbId !== currentMovie.tmdbId) {
        poolMap.set(m.id, { ...m, _sourceType: 'local' });
      }
    });
    Object.values(state.discover.cache).forEach(list => {
      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item.tmdbId !== currentMovie.tmdbId) {
            poolMap.set('tmdb_' + item.mediaType + '_' + item.tmdbId, { ...item, id: 'tmdb_' + item.mediaType + '_' + item.tmdbId, _sourceType: 'tmdb' });
          }
        });
      }
    });

    let candidates = Array.from(poolMap.values());
    if (candidates.length === 0) return [];

    const curTitle = (currentMovie.title || '').toLowerCase();
    const curType = currentMovie.type || (currentMovie.mediaType === 'tv' ? 'series' : 'movie');
    const curGenres = genresOf(currentMovie).map(g => g.toLowerCase());
    const curProd = (currentMovie.producer || currentMovie.company || '').toLowerCase();

    candidates.forEach(item => {
      let score = 0;
      const itemTitle = (item.title || '').toLowerCase();
      const itemType = item.type || (item.mediaType === 'tv' ? 'series' : 'movie');
      const itemGenres = genresOf(item).map(g => g.toLowerCase());
      const itemProd = (item.producer || item.company || '').toLowerCase();

      if (curTitle && itemTitle) {
        if (itemTitle === curTitle) {
          score += 50;
        } else if (itemTitle.includes(curTitle) || curTitle.includes(itemTitle)) {
          score += 30;
        } else {
          const curWords = curTitle.split(/\s+/).filter(w => w.length > 2);
          const itemWords = itemTitle.split(/\s+/).filter(w => w.length > 2);
          let commonWords = curWords.filter(w => itemWords.includes(w));
          score += commonWords.length * 15;
        }
      }

      if (curType && itemType && curType === itemType) {
        score += 20;
      }

      if (curGenres.length > 0 && itemGenres.length > 0) {
        let matchedGenres = itemGenres.filter(g => curGenres.includes(g));
        score += matchedGenres.length * 10;
      }

      if (curProd && itemProd && (itemProd.includes(curProd) || curProd.includes(itemProd))) {
        score += 15;
      }

      score += (item.popularity || 0) / 1000;
      item._matchScore = score;
    });

    candidates.sort((a, b) => b._matchScore - a._matchScore);
    return candidates.slice(0, 10);
  }

  // Реальные похожие тайтлы из TMDB (recommendations + similar) — точнее локальной эвристики,
  // т.к. учитывает не только жанр/название, но и актёров, ключевые слова, сюжетную близость и т.д.
  // Пока идёт загрузка (или если у тайтла нет tmdbId), используется getSimilarRecommendations как мгновенный фолбэк.
  function similarCacheKey(m){
    return (m && m.tmdbId != null && m.mediaType) ? (m.mediaType + '_' + m.tmdbId) : null;
  }

  function getDisplaySimilarList(m){
    const key = similarCacheKey(m);
    if (key && state.similarCache[key]) return state.similarCache[key];
    return getSimilarRecommendations(m);
  }

  async function loadSimilarForDetail(m){
    const key = similarCacheKey(m);
    if (!key || state.similarCache[key] || state.similarLoading[key]) return;
    state.similarLoading[key] = true;
    try{
      const [rec, sim] = await Promise.all([
        tmdbFetch('/' + m.mediaType + '/' + m.tmdbId + '/recommendations', state.tmdbKey),
        tmdbFetch('/' + m.mediaType + '/' + m.tmdbId + '/similar', state.tmdbKey)
      ]);
      const seen = new Set();
      const merged = [];
      (rec.results || []).concat(sim.results || []).forEach(r => {
        if (r.id === m.tmdbId || seen.has(r.id)) return;
        seen.add(r.id);
        const mapped = mapTmdbItem(r, m.mediaType);
        mapped._sourceType = 'tmdb';
        merged.push(mapped);
      });
      merged.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      state.similarCache[key] = merged.slice(0, 10);
    }catch(e){
      // при ошибке оставляем ключ незаполненным — так и дальше будет использоваться локальный фолбэк
    }
    state.similarLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM && similarCacheKey(curM) === key){
      renderSimilarSection();
    }
  }

  // Число сезонов есть только в полном ответе /tv/{id}, поэтому у тайтлов, сохранённых
  // до появления этого поля (или добавленных иным путём), его может не быть — подгружаем
  // один раз при открытии карточки и дописываем в сохранённые данные, чтобы больше не запрашивать.
  async function loadSeasonInfoForDetail(m){
    if (!m || m.mediaType !== 'tv' || m.numberOfSeasons != null || !m.tmdbId) return;
    const key = 'season_' + m.tmdbId;
    if (!state.seasonLoading) state.seasonLoading = {};
    if (state.seasonLoading[key]) return;
    state.seasonLoading[key] = true;
    try{
      const data = await tmdbFetch('/tv/' + m.tmdbId, state.tmdbKey);
      m.numberOfSeasons = typeof data.number_of_seasons === 'number' ? data.number_of_seasons : null;
      m.numberOfEpisodes = typeof data.number_of_episodes === 'number' ? data.number_of_episodes : null;
      const isSaved = state.movies.some(x => x.id === m.id);
      if (isSaved && m.numberOfSeasons != null) await updateMovie(m);
    }catch(e){
      // не удалось получить — просто не покажем блок сезонов
    }
    state.seasonLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM === m) renderDetailMetaRow();
  }

  function renderDetailMetaRow(){
    const el = document.getElementById('detailMetaRow');
    if (!el) return;
    const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (!m) return;
    const genreStr = genresOf(m).join('  ');
    const yearStr = m.year ? m.year : '';
    const typeStr = typeLabel(m.type) || (m.mediaType === 'tv' ? 'Сериал' : 'Фильм');
    const seasonsStr = m.mediaType === 'tv' ? seasonsLabel(m.numberOfSeasons) : '';

  // Блюр фонового контента вкладки "Поиск", пока строка поиска в фокусе или что-то введено,
  // и выход из поиска по тапу вне зоны поиска. Блюрится #searchBgContent (топбар + подборки)
  // И нижние кнопки Главная/Поиск (.nav) — строка поиска и список результатов остаются
  // не заблюренными и кликабельными. Пока блюр активен, тап в любом другом месте экрана
  // не доходит до своей обычной цели (не открывает карточку, не переключает вкладку и т.д.),
  // а просто закрывает поиск.
  //
  // ВАЖНО про порядок событий: тап по карточке вне поля ввода сначала снимает фокус
  // с этого поля (событие blur у input срабатывает раньше click), а onblur сбрасывает
  // searchFocused. Поэтому проверять searchShouldBlur() в обработчике click — уже поздно:
  // на момент click состояние успевает "разблюриться" и клик по карточке проходит.
  // Решение — перехватывать на touchstart/mousedown (в фазе capture, ДО того как браузер
  // вообще обработает смену фокуса), там же сразу гасить событие и выходить из поиска.
  // Обработчик click оставлен вторым эшелоном на случай активации без mousedown/touchstart
  // (например, Enter с клавиатуры на сфокусированном элементе).
  let searchFocused = false;

  function searchShouldBlur(){
    return state.view === 'search' && (searchFocused || !!(state.tmdbQuery && state.tmdbQuery.trim()));
  }

  function syncSearchBlur(){
    const bg = document.getElementById('searchBgContent');
    const shouldBlur = searchShouldBlur();
    if (bg) bg.classList.toggle('search-bg-blurred', shouldBlur);
    const app = document.getElementById('app');
    if (app) app.classList.toggle('search-scroll-locked', shouldBlur);
    const navEl = document.querySelector('.nav');
    if (navEl) navEl.classList.toggle('search-bg-blurred', shouldBlur);
  }

  // Разрешённые зоны, тап по которым НЕ закрывает поиск: сама строка поиска
  // (с кнопкой очистки и т.д.) и список результатов/вариантов под ней.
  function isInsideSearchAllowedArea(target){
    return !!target.closest('.search-bar-bottom, #searchResultsDropdownContainer');
  }

  function handleGlobalSearchBlurIntercept(e){
    if (!searchShouldBlur()) return;
    if (isInsideSearchAllowedArea(e.target)) return;
    e.stopPropagation();
    if (e.cancelable) e.preventDefault();
    exitSearch();
  }

  function handleGlobalSearchBlurTouchMove(e){
    if (!searchShouldBlur()) return;
    if (isInsideSearchAllowedArea(e.target)) return;
    e.preventDefault();
  }

  // Вешаем один раз на весь документ в фазе capture — так перехватываются тапы
  // по любому элементу под блюром (нав, топбар, подборки), не только по контейнеру
  // фона поиска, который каждый render() пересоздаётся заново.
  function initSearchBlurGlobalGuard(){
    document.addEventListener('touchstart', handleGlobalSearchBlurIntercept, { capture:true, passive:false });
    document.addEventListener('mousedown', handleGlobalSearchBlurIntercept, true);
    document.addEventListener('click', handleGlobalSearchBlurIntercept, true);
    document.addEventListener('touchmove', handleGlobalSearchBlurTouchMove, { capture:true, passive:false });
  }

  function exitSearch(){
    state.tmdbQuery = '';
    state.tmdbResults = null;
    searchFocused = false;
    const qInput = document.getElementById('tmdbQueryBottom');
    if (qInput) qInput.blur();
    renderSearchDropdown();
    syncSearchBlur();
  }

  function renderSearchDropdown(){

    const searching = state.tmdbQuery && state.tmdbQuery.trim();

    if (!searching){
      if (container) container.remove();
      syncSearchBlur();
      return true;
    }
    if (!container){
      container = document.createElement('div');
      container.id = 'searchResultsDropdownContainer';
      container.className = 'search-results-dropdown';
      bar.parentNode.insertBefore(container, bar);
    }
    container.innerHTML = state.tmdbResults
      ? renderTmdbResults(state.tmdbResults)
      : '<div style="font-size:13px;color:var(--ink-faint);padding:8px;text-align:center;">Ищу…</div>';

  function openYearFilterModal(key){
    const currentYear = new Date().getFullYear();
    const years = [];
    for (let y = currentYear + 5; y >= currentYear - 60; y--) years.push(y);

    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal">'
      + '<div class="modal-title">Год выпуска</div>'
      + '<div class="field" style="margin-top:10px;"><label>Крути колесо ниже или введи год вручную</label>'
      +   '<input id="yearFilterInput" type="number" placeholder="Например: 2021" inputmode="numeric" min="1900" max="'+(currentYear+5)+'" style="margin-top:6px;padding:11px 13px;font-size:14px;">'
      + '</div>'
      + '<div class="year-wheel-wrap">'
      +   '<div class="year-wheel-indicator"></div>'
      +   '<div class="year-wheel" id="yearWheel">'
      +     years.map(y => '<div class="year-wheel-item" data-wheel-year="'+y+'">'+y+'</div>').join('')
      +   '</div>'
      + '</div>'
      + '<div class="modal-actions" style="margin-top:14px;">'
      +   '<button type="button" class="primary-btn" id="yearApplyBtn" style="margin-top:0;padding:13px;display:flex;align-items:center;justify-content:center;gap:7px;">'+icon('check',16)+'<span>Применить</span></button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.onclick = e => { if (e.target === div) div.remove(); };

    const wheel = div.querySelector('#yearWheel');
    const items = Array.from(wheel.querySelectorAll('.year-wheel-item'));
    const currentIdx = years.indexOf(currentYear);

    const markCenterActive = () => {
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closestIdx = 0, closestDist = Infinity;
      items.forEach((it, i) => {
        const itemCenter = it.offsetTop + it.offsetHeight / 2;
        const dist = Math.abs(itemCenter - center);
        if (dist < closestDist){ closestDist = dist; closestIdx = i; }
      });
      items.forEach((it, i) => it.classList.toggle('center-active', i === closestIdx));
      return closestIdx;
    };

    // При каждом открытии колесо всегда стартует с текущего года, а не с ранее выбранного.
    requestAnimationFrame(() => {
      if (currentIdx > -1 && items[currentIdx]){
        wheel.scrollTop = items[currentIdx].offsetTop - (wheel.clientHeight / 2 - items[currentIdx].offsetHeight / 2);
      }
      markCenterActive();
    });

    // Скролл (пальцем, тачпадом или колёсиком мыши) только подсвечивает год по центру —
    // применяется он только по нажатию общей кнопки "Применить", без авто-закрытия.
    wheel.addEventListener('scroll', () => { markCenterActive(); }, { passive: true });

    // Прокрутка колёсиком мыши/трекпада — листаем список по одному году за "тик",
    // с плавной анимацией, как будто крутишь настоящее колесо выбора.
    let wheelBusy = false;
    wheel.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelBusy) return;
      wheelBusy = true;
      const itemH = items[0].offsetHeight;
      const dir = e.deltaY > 0 ? 1 : -1;
      wheel.scrollBy({ top: dir * itemH, behavior: 'smooth' });
      setTimeout(() => { wheelBusy = false; }, 110);
    }, { passive: false });

    items.forEach(it => {
      it.onclick = () => { it.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    });

    // Общая кнопка "Применить": если в поле введён год вручную — берём его,
    // иначе — год, выбранный прокруткой колеса (по центру).
    const input = div.querySelector('#yearFilterInput');
    const applyYear = () => {
      const raw = input.value.trim();
      const val = raw ? parseInt(raw, 10) : NaN;
      const year = (raw && !isNaN(val)) ? val : years[markCenterActive()];
      const f2 = getDiscoverFilters(key);
      f2.year = year;
      div.remove();
      applyDiscoverFilterChange(key);
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ applyYear(); }
    });
    div.querySelector('#yearApplyBtn').onclick = applyYear;
  }

      + DISCOVER_COUNTRY_OPTIONS.map(c => '<button type="button" class="genre-chip filter-country-opt'+(f.country===c.code?' active':'')+'" data-country-opt="'+c.code+'">'+escapeHtml(c.label)+'</button>').join('')
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.onclick = e => { if (e.target === div) div.remove(); };
    div.querySelectorAll('[data-country-opt]').forEach(btn => {
      btn.onclick = () => {
        const f2 = getDiscoverFilters(key);
        f2.country = btn.getAttribute('data-country-opt');
        div.remove();
        applyDiscoverFilterChange(key);
      };
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){

  function viewDiscoverList(){
    const cat = discoverCatByKey(state.discoverListKey);
    if (!cat){ state.view = 'search'; return viewSearch(); }
    const list = state.discover.full[cat.key] || [];
    const loading = state.discover.fullLoading[cat.key];
    const done = state.discover.fullDone[cat.key];
    let html = '<div class="subbar"><button class="icon-btn glass-flat" id="backBtn">'+icon('back',18)+'</button><div class="subtitle">'+escapeHtml(cat.label)+'</div></div>';
    html += discoverFilterBarHtml(cat.key);

      html += '<div class="empty glass-flat" style="margin-top:16px;">Загрузка…</div>';

      html += '<div class="empty glass-flat" style="margin-top:16px;">Не удалось загрузить список.</div>';
    } else {
      html += '<div class="movies-grid">'+list.map(discoverCard).join('')+'</div>';
      if (!done){
        html += '<div id="infiniteLoader" class="infinite-loader" style="'+(loading ? 'display:block;' : 'display:none;')+'">Загрузка…</div>';

  // ===== Hero-баннер: самые популярные прямо сейчас (TMDB trending/all/day), вверху "Поиска" =====
  let heroBannerInterval = null;
  let heroBannerResumeTimer = null;
  const BANNER_REFRESH_MS = 30 * 60 * 1000; // раз в 30 минут баннер считается устаревшим и подгружается заново

  function mapTmdbBannerItem(r){
    const isTv = r.media_type === 'tv';
    return {
      tmdbId: r.id,
      mediaType: isTv ? 'tv' : 'movie',
      title: (isTv ? (r.name || r.original_name) : (r.title || r.original_title)) || '',
      year: ((isTv ? r.first_air_date : r.release_date) || '').slice(0, 4),
      backdrop: r.backdrop_path ? ('https://image.tmdb.org/t/p/w780' + r.backdrop_path) : '',
      poster: r.poster_path ? ('https://image.tmdb.org/t/p/w500' + r.poster_path) : '',
      voteAverage: typeof r.vote_average === 'number' ? r.vote_average : null,
      type: isTv ? 'series' : 'movie'
    };
  }

  async function loadBannerItems(force){
    if (bannerLoadingFlag) return;
    if (!force && state.banner.items.length && (Date.now() - state.banner.loadedAt) < BANNER_REFRESH_MS) return;
    bannerLoadingFlag = true;
    try{
      const data = await tmdbFetch('/trending/all/day', state.tmdbKey);
      const items = (data.results || []).filter(r => r.backdrop_path).slice(0, 8).map(mapTmdbBannerItem);
      if (items.length) { state.banner.items = items; state.banner.index = 0; }
      state.banner.loadedAt = Date.now();
    }catch(e){
      // не удалось обновить — оставляем то, что уже было (если было)
    }
    bannerLoadingFlag = false;
    if (state.view === 'search') renderSearchBanner();
  }

  function bannerSlideHtml(item){
    const bg = item.backdrop || item.poster || '';
    const img = bg ? '<img class="hero-banner-img" src="'+escapeHtml(bg)+'" alt="" loading="lazy">' : '';
    const meta = [item.year, typeLabel(item.type)].filter(Boolean).join(' · ');
    return '<div class="hero-banner-slide" data-discover-pick="'+item.tmdbId+'" data-discover-type="'+item.mediaType+'" data-poster-src="'+escapeHtml(item.poster || '')+'">'
      + img
      + '<div class="hero-banner-gradient"></div>'
      + ratingPill(item)
      + '<div class="hero-banner-info">'
      +   '<div class="hero-banner-title">'+escapeHtml(item.title)+'</div>'
      +   (meta ? '<div class="hero-banner-meta">'+escapeHtml(meta)+'</div>' : '')
      + '</div>'
      + '</div>';
  }

  function heroBannerHtml(){
    if (!state.banner.items.length) return '';
    return '<div class="hero-banner-wrap"><div class="hero-banner-track" id="heroBannerTrack">'
      + state.banner.items.map(bannerSlideHtml).join('')
      + '</div><div class="hero-banner-dots" id="heroBannerDots">'

  function bindHeroBannerClicks(){
    document.querySelectorAll('#heroBannerTrack [data-discover-pick]').forEach(el => {

  function updateHeroDots(){
    const dots = document.getElementById('heroBannerDots');
    if (!dots) return;
    dots.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === state.banner.index));

  // Точечно вставляет/обновляет баннер поверх уже отрисованного экрана поиска —
  // без полной перерисовки, чтобы не сбивать прокрутку и не перезапускать ряды подборок.
  function renderSearchBanner(){
    const bg = document.getElementById('searchBgContent');
    if (!bg) return;
    const existingWrap = bg.querySelector('.hero-banner-wrap');
    const html = heroBannerHtml();
    if (existingWrap){
      if (!html) existingWrap.remove();
      else existingWrap.outerHTML = html;
    } else if (html) {
      const topbarEl = bg.querySelector('.topbar');
      if (topbarEl) topbarEl.insertAdjacentHTML('afterend', html);
      else bg.insertAdjacentHTML('afterbegin', html);
    }
    bindHeroBannerClicks();
    initHeroBannerCarousel();
  }

  function initHeroBannerCarousel(){
    const track = document.getElementById('heroBannerTrack');
    if (heroBannerInterval){ clearInterval(heroBannerInterval); heroBannerInterval = null; }
    if (!track || state.banner.items.length < 2) return;

    const scrollToIndex = (i, smooth) => {
      track.scrollTo({ left: i * track.clientWidth, behavior: smooth === false ? 'auto' : 'smooth' });
    };
    scrollToIndex(state.banner.index, false);

    const startAuto = () => {
      if (heroBannerInterval) clearInterval(heroBannerInterval);
      heroBannerInterval = setInterval(() => {
        const n = state.banner.items.length;
        state.banner.index = (state.banner.index + 1) % n;
        scrollToIndex(state.banner.index);
        updateHeroDots();
      }, 4500);
    };
    startAuto();

    let scrollSettleTimer = null;
    track.addEventListener('scroll', () => {
      if (scrollSettleTimer) clearTimeout(scrollSettleTimer);
      scrollSettleTimer = setTimeout(() => {
        const w = track.clientWidth || 1;
        const idx = Math.round(track.scrollLeft / w);
        state.banner.index = Math.max(0, Math.min(state.banner.items.length - 1, idx));
        updateHeroDots();
      }, 120);
    }, { passive: true });

    // Ручное перелистывание пользователем — на время останавливаем автопрокрутку,
    // затем возобновляем её через паузу, чтобы не мешать друг другу.
    track.addEventListener('touchstart', () => {
      if (heroBannerInterval){ clearInterval(heroBannerInterval); heroBannerInterval = null; }
      if (heroBannerResumeTimer) clearTimeout(heroBannerResumeTimer);
      heroBannerResumeTimer = setTimeout(startAuto, 6000);
    }, { passive: true });
  }

  // ===== Проверка подборок "Поиска" на новинки (сверка live-данных TMDB с уже загрученным кэшем) =====
  const DISCOVER_UPDATE_CHECK_MS = 10 * 60 * 1000; // раз в 10 минут, пока экран "Поиск" открыт
  const DISCOVER_STALE_MS = 15 * 60 * 1000; // если кэш подборки старше этого — проверяем сразу при входе

  async function checkDiscoverCategoryForUpdates(cat){
    if (!state.discover.cache[cat.key] || state.discover.checkingUpdate[cat.key]) return;
    state.discover.checkingUpdate[cat.key] = true;
    try{
      const fresh = await fetchDiscoverCategoryItems(cat);
      state.discover.cache[cat.key] = await applyNewBadges(cat.key, fresh);
      renderDiscoverCategoryRow(cat.key);
    }catch(e){
      // тихо игнорируем — попробуем на следующей проверке
    }
    state.discover.checkingUpdate[cat.key] = false;
    state.discover.cacheTime[cat.key] = Date.now();
  }

  let discoverUpdateInterval = null;
  function initDiscoverAutoUpdate(){
    if (discoverUpdateInterval) clearInterval(discoverUpdateInterval);
    discoverUpdateInterval = setInterval(() => {
      if (state.view !== 'search') return;
      DISCOVER_CATEGORIES.forEach(cat => {
        if (state.discover.cache[cat.key]) checkDiscoverCategoryForUpdates(cat);
      });
      if ((Date.now() - state.banner.loadedAt) > BANNER_REFRESH_MS) loadBannerItems();
    }, DISCOVER_UPDATE_CHECK_MS);
  }

        + state.categories.map(c => {

    const imdbInfoBar = (m.voteAverage != null) ? `
      <div class="my-rating-box" style="display:flex; align-items:center; justify-content:space-between; background:rgba(245,197,24,0.05); border-color:rgba(245,197,24,0.2);">

    +     '<div class="detail-meta-row" id="detailMetaRow">'

  function viewNav(){
    return '<div class="nav"><div class="nav-inner glass">'
    + '<button data-nav="home" class="'+(state.view==='home'?'active':'')+'">'+icon('home',20)+'<span class="nlabel">Главная</span></button>'
    + '<button data-nav="search" class="'+(state.view==='search'?'active':'')+'">'+icon('search',20)+'<span class="nlabel">Поиск</span></button>'
    + '</div></div>';
  }

  // Полоска-перфорация в шапке анимируется бесконечным CSS-циклом (filmPerfScroll),
  // но сама .topbar пересоздаётся заново при каждом render() (Главная <-> Поиск и т.д.),
  // из-за чего анимация каждый раз рестартовала с нуля и было видно «дёрганье». Здесь
  // высчитываем, на какой фазе цикла анимация должна быть прямо сейчас (по реальному
  // времени с момента загрузки страницы), и через CSS-переменную сдвигаем каждую новую
  // .topbar на эту фазу — визуально движение остаётся непрерывным, будто элемент вообще
  // не пересоздавался. Длительность здесь ДОЛЖНА совпадать с длительностью в CSS (2.6s).
  const FILMPERF_ANIM_DURATION = 2.6;
  function syncTopbarFilmAnim(){
    const offset = (performance.now() / 1000) % FILMPERF_ANIM_DURATION;
    document.querySelectorAll('.topbar').forEach(el => {
      el.style.setProperty('--filmperf-offset', offset + 's');
    });
  }

  function render(){
    const app = document.getElementById('app');
    if (!state.loaded){ app.innerHTML = '<div style="text-align:center;color:var(--ink-faint);padding-top:80px;font-size:13px;">Загружаю KINOBLO…</div>'; return; }
    let html = '';
    if (state.view === 'home') html = viewHome();
    else if (state.view === 'search') html = viewSearch();
    else if (state.view === 'choose') html = viewChoose();
    else if (state.view === 'detail') html = viewDetail();
    else if (state.view === 'category') html = viewCategory();
    else if (state.view === 'discoverList') html = viewDiscoverList();
    const showBottomSearch = state.view === 'search';
    if (showBottomSearch) html += searchBarBottomHtml();
    const hideNav = state.view === 'choose' || state.view === 'detail';
    if (!hideNav) html += viewNav();
    app.innerHTML = html;
    syncTopbarFilmAnim();
    app.classList.toggle('no-select', state.view === 'home' || state.view === 'search');
    bindEvents();
    if (showBottomSearch && !(state.tmdbQuery && state.tmdbQuery.trim())){
      DISCOVER_CATEGORIES.forEach(cat => {
        if (!state.discover.cache[cat.key]) loadDiscoverCategory(cat);
        else if (!state.discover.cacheTime[cat.key] || (Date.now() - state.discover.cacheTime[cat.key]) > DISCOVER_STALE_MS) checkDiscoverCategoryForUpdates(cat);
      });
      if (!state.banner.items.length) loadBannerItems();
      else { initHeroBannerCarousel(); bindHeroBannerClicks(); }
    }

    if (state.view === 'detail'){
      const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
      if (m) { loadSimilarForDetail(m); loadSeasonInfoForDetail(m); }
    }
    
    if (state.view === 'search' || state.view === 'discoverList' || state.view === 'home') {
      const pos = state.scrollPositions[state.view] || 0;
      if (pos > 0) {
        setTimeout(() => app.scrollTop = pos, 10);
      }
    }
    syncSearchBlur();
  }

  function focusSearchInput(){
    const el = document.getElementById('tmdbQueryBottom');
    if (!el) return;
    try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
  }

  async function openMovie(id){ 
    isOverviewExpanded = false; 
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    state.detailId = id; 
    state.previewItem = null; 
    
    state.tmdbQuery = '';
    state.tmdbResults = null;

    state.view = 'detail'; 
    render(); 
    document.getElementById('app').scrollTop = 0; 
  }

  async function previewTmdb(tmdbId, mediaType){
    isOverviewExpanded = false;
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    
    state.tmdbQuery = '';
    state.tmdbResults = null;

    try{
      const data = await tmdbFetch('/' + mediaType + '/' + tmdbId, state.tmdbKey);
      const mapped = mapTmdbItem(data, mediaType);
      const existing = state.movies.find(x => x.tmdbId === mapped.tmdbId);
      if (existing){
        state.detailId = existing.id;
        state.previewItem = null;
      } else {
        const backdrops = await tmdbImages(tmdbId, mediaType, state.tmdbKey);
        mapped.screenshots = backdrops.slice(0, 6);
        state.detailId = null;
        state.previewItem = mapped;
      }
      state.view = 'detail';
      render();
      document.getElementById('app').scrollTop = 0;
    }catch(e){
      customAlert('Не удалось загрузить информацию о фильме.');
    }
  }

  function customAlert(msg){
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal" style="text-align:center;padding:24px;"><div class="modal-title">Внимание</div><div class="modal-msg">'+escapeHtml(msg)+'</div><button class="primary-btn" id="alertOk" style="width:100%;margin-top:12px;">Ок</button></div>';
    document.body.appendChild(div);
    div.querySelector('#alertOk').onclick = () => div.remove();
  }

  // ===== Экспорт / импорт библиотеки (перенос фильмов между устройствами через буфер обмена) =====

  const EXPORT_PREFIX = 'KINOBLO1:';

  function buildExportPayload(){
    return {
      v: 1,
      exportedAt: Date.now(),
      categories: state.categories.map(c => ({ v:c.v, l:c.l, sub:c.sub||'', icon:c.icon, color:c.color })),
      movies: state.movies.map(m => Object.assign({}, m))
    };
  }

  function encodeExportPayload(payload){
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return EXPORT_PREFIX + b64;
  }

  function decodeExportPayload(str){
    let s = (str || '').trim();
    const idx = s.indexOf(EXPORT_PREFIX);
    if (idx === -1) throw new Error('no-prefix');
    s = s.slice(idx + EXPORT_PREFIX.length);
    s = s.replace(/\s+/g, ''); // на случай переносов строк при вставке на телефоне
    const json = decodeURIComponent(escape(atob(s)));
    const payload = JSON.parse(json);
    if (!payload || !Array.isArray(payload.movies) || !Array.isArray(payload.categories)) {
      throw new Error('bad-shape');
    }
    return payload;
  }

  let _uidCounter = 0;
  function makeLocalId(prefix){
    _uidCounter++;
    return prefix + '_' + Date.now() + '_' + _uidCounter + '_' + Math.random().toString(36).substr(2, 5);
  }

  function hapticOk(){
    try{ if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); }catch(e){}
  }
  function hapticErr(){
    try{ if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error'); }catch(e){}
  }
  function hapticSelect(){
    try{ if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); }catch(e){}
  }
  let catDragSuppressClick = false;

  // Долгое нажатие на заголовок категории на главном экране запускает перетаскивание —
  // вся секция (заголовок + ряд фильмов) следует за пальцем по вертикали, а соседние
  // секции плавно расступаются, показывая, куда она встанет. Порядок сохраняется
  // в state.categories при отпускании.
  function initCategoryDragReorder(){
    const app = document.getElementById('app');
    if (!app) return;
    document.querySelectorAll('.section-head[data-cat]').forEach(headEl => {
      let pressTimer = null;
      let longPressActive = false;
      let startY = 0;
      let prevTouchY = 0;
      let dragCtx = null;
      let lastClientY = 0;
      let autoScrollRAF = null;
      let collapseTimer = null;
      let draggedSectionEl = null;

      const COLLAPSE_DURATION = 300;

      const cancelPress = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      // Автопрокрутка: пока идёт перетаскивание и палец находится у верхней или
      // нижней кромки видимой области, плавно прокручиваем #app в ту сторону —
      // скорость нарастает по мере приближения к самому краю.
      const AUTOSCROLL_EDGE = 190;
      const AUTOSCROLL_MIN_SPEED = 6;
      const AUTOSCROLL_MAX_SPEED = 26;

      const stopAutoScroll = () => {
        if (autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
      };

      const autoScrollTick = () => {
        if (!dragCtx){ autoScrollRAF = null; return; }
        const appRect = app.getBoundingClientRect();
        const distFromTop = lastClientY - appRect.top;
        const distFromBottom = appRect.bottom - lastClientY;
        let speed = 0;
        if (distFromTop >= 0 && distFromTop < AUTOSCROLL_EDGE){
          const ratio = 1 - distFromTop / AUTOSCROLL_EDGE;
          speed = -(AUTOSCROLL_MIN_SPEED + (AUTOSCROLL_MAX_SPEED - AUTOSCROLL_MIN_SPEED) * ratio);
        } else if (distFromBottom >= 0 && distFromBottom < AUTOSCROLL_EDGE){
          const ratio = 1 - distFromBottom / AUTOSCROLL_EDGE;
          speed = AUTOSCROLL_MIN_SPEED + (AUTOSCROLL_MAX_SPEED - AUTOSCROLL_MIN_SPEED) * ratio;
        }
        if (speed !== 0){
          const maxScrollTop = app.scrollHeight - app.clientHeight;
          const prevScrollTop = app.scrollTop;
          const nextScrollTop = Math.max(0, Math.min(maxScrollTop, prevScrollTop + speed));
          const actualDelta = nextScrollTop - prevScrollTop;
          if (actualDelta !== 0){
            app.scrollTop = nextScrollTop;
            // Компенсируем смещение контента прокруткой, чтобы перетаскиваемая
            // секция визуально оставалась под пальцем.
            dragCtx.startClientY -= actualDelta;
            onMove(lastClientY);
          }
        }
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      };

      const beginDrag = (clientY) => {
        const sectionEl = headEl.closest('.section[data-cat-section]');
        if (!sectionEl) return;
        const sections = Array.from(app.querySelectorAll('.section[data-cat-section]'));
        const draggedIndex = sections.indexOf(sectionEl);
        if (draggedIndex === -1) return;

        longPressActive = true;
        catDragSuppressClick = true;
        hapticSelect();
        lastClientY = clientY;
        draggedSectionEl = sectionEl;

        sectionEl.classList.add('cat-dragging');
        app.classList.add('cat-reorder-active');

        // Даём рядам с постерами схлопнуться (см. CSS у .cat-reorder-active) и
        // только после этого включаем расчёт перетаскивания — уже по высоте
        // компактных заголовков, а не полных рядов с постерами.
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          if (!longPressActive || draggedSectionEl !== sectionEl) return;
          const rects = sections.map(el => ({ el, top: el.offsetTop, height: el.offsetHeight }));
          dragCtx = { sectionEl, rects, draggedIndex, targetIndex: draggedIndex, startClientY: lastClientY, draggedInfo: rects[draggedIndex] };
          stopAutoScroll();
          autoScrollRAF = requestAnimationFrame(autoScrollTick);
        }, COLLAPSE_DURATION);
      };

      const onMove = (clientY) => {
        if (!longPressActive){
          // Заголовок специально не отдаёт жест браузеру (touch-action:none),
          // чтобы тот не перехватывал его на середине перетаскивания — поэтому
          // пока долгое нажатие ещё не сработало, прокручиваем страницу вручную,
          // как обычный свайп.
          const delta = prevTouchY - clientY;
          prevTouchY = clientY;
          if (pressTimer && Math.abs(clientY - startY) > 8) cancelPress();
          const maxScrollTop = app.scrollHeight - app.clientHeight;
          if (maxScrollTop > 0){
            app.scrollTop = Math.max(0, Math.min(maxScrollTop, app.scrollTop + delta));
          }
          return;
        }
        lastClientY = clientY;
        if (!dragCtx) return;
        const dy = clientY - dragCtx.startClientY;
        dragCtx.sectionEl.style.transform = 'translateY(' + dy + 'px)';

        const draggedCenter = dragCtx.draggedInfo.top + dragCtx.draggedInfo.height / 2 + dy;
        let newTarget = dragCtx.draggedIndex;

        dragCtx.rects.forEach((r, i) => {
          if (i === dragCtx.draggedIndex) return;
          const siblingCenter = r.top + r.height / 2;
          if (i < dragCtx.draggedIndex){
            if (draggedCenter < siblingCenter){
              r.el.style.transform = 'translateY(' + dragCtx.draggedInfo.height + 'px)';
              newTarget = Math.min(newTarget, i);
            } else {
              r.el.style.transform = '';
            }
          } else if (i > dragCtx.draggedIndex){
            if (draggedCenter > siblingCenter){
              r.el.style.transform = 'translateY(-' + dragCtx.draggedInfo.height + 'px)';
              newTarget = Math.max(newTarget, i);
            } else {
              r.el.style.transform = '';
            }
          }
        });

        dragCtx.targetIndex = newTarget;
      };

      const endDrag = () => {
        cancelPress();
        stopAutoScroll();
        clearTimeout(collapseTimer);
        if (!longPressActive) return;
        longPressActive = false;
        const ctx = dragCtx;
        dragCtx = null;
        app.classList.remove('cat-reorder-active');
        if (draggedSectionEl){
          draggedSectionEl.classList.remove('cat-dragging');
          draggedSectionEl = null;
        }

        if (ctx){
          ctx.rects.forEach(r => { r.el.style.transform = ''; });

          if (ctx.targetIndex !== ctx.draggedIndex){
            const moved = state.categories.splice(ctx.draggedIndex, 1)[0];
            state.categories.splice(ctx.targetIndex, 0, moved);
            STORAGE.saveCategories(state.categories);
            hapticOk();
          }
          render();
        }
        setTimeout(() => { catDragSuppressClick = false; }, 50);
      };

      headEl.addEventListener('contextmenu', e => e.preventDefault());
      headEl.addEventListener('selectstart', e => e.preventDefault());

      headEl.addEventListener('touchstart', e => {
        e.stopPropagation();
        const t = e.touches[0];
        startY = t.clientY;
        prevTouchY = t.clientY;
        cancelPress();
        pressTimer = setTimeout(() => beginDrag(t.clientY), 350);
      }, {passive:true});

      headEl.addEventListener('touchmove', e => {
        const t = e.touches[0];
        e.preventDefault();
        onMove(t.clientY);
      }, {passive:false});

      headEl.addEventListener('touchend', endDrag);
      headEl.addEventListener('touchcancel', endDrag);

      headEl.addEventListener('mousedown', e => {
        startY = e.clientY;
        prevTouchY = e.clientY;
        cancelPress();
        pressTimer = setTimeout(() => beginDrag(e.clientY), 350);
        const onMouseMove = ev => onMove(ev.clientY);
        const onMouseUp = () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          endDrag();
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    });
  }

  async function exportLibrary(){
    if (!state.movies.length){
      customAlert('Пока нечего копировать — добавь хотя бы один фильм.');
      return;
    }
    const code = encodeExportPayload(buildExportPayload());

    let copiedAutomatically = false;
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(code);
        copiedAutomatically = true;
      }
    }catch(e){ copiedAutomatically = false; }

    if (copiedAutomatically){
      hapticOk();
      customAlert('Скопировано! Открой Kinoblo на другом устройстве и нажми «Вставить».');
      return;
    }

    hapticErr();
    openCopyFallbackModal(code);
  }

  function openCopyFallbackModal(code){
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal">'
      + '<div class="modal-title">Скопируй код вручную</div>'
      + '<div class="sync-hint">Автокопирование недоступно. Выдели весь текст ниже и скопируй его (или нажми кнопку «Скопировать»).</div>'
      + '<div style="margin-top:12px;" class="field"><textarea class="copy-modal-textarea" id="exportCodeArea" readonly></textarea></div>'
      + '<div class="modal-actions" style="margin-top:14px;display:flex;gap:8px;">'
      + '<button type="button" class="secondary-btn glass-flat" id="exportCloseBtn">Закрыть</button>'
      + '<button type="button" class="primary-btn" id="exportCopyBtn" style="margin-top:0;">Скопировать</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    const area = div.querySelector('#exportCodeArea');
    area.value = code;
    div.querySelector('#exportCloseBtn').onclick = () => div.remove();

      let ok = false;

        div.remove();
        customAlert('Скопировано!');
      } else {
        customAlert('Не получилось скопировать автоматически. Выдели текст пальцем и выбери «Копировать» из меню.');
      }

  async function importLibrary(){
    let text = null;
    try{
      if (navigator.clipboard && navigator.clipboard.readText){
        text = await navigator.clipboard.readText();
      }
    }catch(e){ text = null; }

    if (text && text.indexOf(EXPORT_PREFIX) !== -1){
      try{
        const payload = decodeExportPayload(text);
        confirmAndMergePayload(payload);
        return;
      }catch(e){ /* падаем в ручной ввод ниже */ }
    }

    if (tg && typeof tg.readTextFromClipboard === 'function'){
      try{
        tg.readTextFromClipboard(clip => {
          if (clip && clip.indexOf(EXPORT_PREFIX) !== -1){
            try{
              const payload = decodeExportPayload(clip);
              confirmAndMergePayload(payload);
              return;
            }catch(e){}
          }
          openPasteFallbackModal();
        });
        return;
      }catch(e){}
    }

    openPasteFallbackModal();
  }

  function openPasteFallbackModal(){
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal">'
      + '<div class="modal-title">Вставь код</div>'
      + '<div class="sync-hint">Не удалось прочитать буфер обмена автоматически. Вставь скопированный на другом устройстве код в поле ниже (долгое нажатие → «Вставить»).</div>'
      + '<div style="margin-top:12px;" class="field"><textarea class="paste-modal-textarea" id="importCodeArea" placeholder="'+EXPORT_PREFIX+'..."></textarea></div>'
      + '<div class="modal-actions" style="margin-top:14px;display:flex;gap:8px;">'
      + '<button type="button" class="secondary-btn glass-flat" id="importCloseBtn">Отмена</button>'
      + '<button type="button" class="primary-btn" id="importConfirmBtn" style="margin-top:0;">Вставить</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.querySelector('#importCloseBtn').onclick = () => div.remove();
    div.querySelector('#importConfirmBtn').onclick = () => {
      const raw = div.querySelector('#importCodeArea').value;
      let payload;
      try{
        payload = decodeExportPayload(raw);
      }catch(e){
        customAlert('Код не распознан. Проверь, что скопировал его полностью, и попробуй снова.');

      div.remove();
      confirmAndMergePayload(payload);
    };
  }

  function confirmAndMergePayload(payload){
    const movieCount = payload.movies.length;
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal" style="text-align:center;padding:24px;">'
      + '<div class="modal-title">Добавить фильмы?</div>'
      + '<div class="modal-msg">Во вставленном коде '+movieCount+' '+pluralMovies(movieCount)+'. Они добавятся в твою коллекцию, категории будут сопоставлены по названию (или созданы заново). Уже добавленные фильмы не задвоятся.</div>'
      + '<div class="modal-actions" style="margin-top:16px;display:flex;gap:8px;">'
      + '<button type="button" class="secondary-btn glass-flat" id="mergeCancelBtn">Отмена</button>'
      + '<button type="button" class="primary-btn" id="mergeConfirmBtn" style="margin-top:0;">Добавить</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.querySelector('#mergeCancelBtn').onclick = () => div.remove();
    div.querySelector('#mergeConfirmBtn').onclick = async () => {
      div.remove();
      await mergeImportedPayload(payload);
    };
  }

  function pluralMovies(n){
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'фильм/сериал';
    if ([2,3,4].indexOf(mod10) !== -1 && [12,13,14].indexOf(mod100) === -1) return 'фильма/сериала';
    return 'фильмов/сериалов';
  }

  async function mergeImportedPayload(payload){
    const catMap = {};
    (payload.categories || []).forEach(importedCat => {
      const existing = state.categories.find(c => c.l.trim().toLowerCase() === (importedCat.l||'').trim().toLowerCase());
      if (existing){
        catMap[importedCat.v] = existing.v;
      } else {
        const newV = makeLocalId('cat');
        state.categories.push({
          v: newV,
          l: importedCat.l || 'Без названия',
          sub: importedCat.sub || '',
          icon: importedCat.icon || CAT_ICON_OPTIONS[0],
          color: importedCat.color || CAT_COLOR_PALETTE[0]
        });
        catMap[importedCat.v] = newV;
      }
    });
    await STORAGE.saveCategories(state.categories);

    let added = 0, skipped = 0;
    for (const importedMovie of (payload.movies || [])){
      const dupe = importedMovie.tmdbId != null
        ? state.movies.find(x => x.tmdbId === importedMovie.tmdbId && x.mediaType === importedMovie.mediaType)
        : null;
      if (dupe){ skipped++; continue; }

      const newMovie = Object.assign({}, importedMovie);
      newMovie.id = makeLocalId('m');
      const importedCats = (Array.isArray(importedMovie.categories) && importedMovie.categories.length)
        ? importedMovie.categories : (importedMovie.status ? [importedMovie.status] : []);
      newMovie.categories = importedCats.map(v => catMap[v]).filter(Boolean);
      if (!newMovie.categories.length) newMovie.categories = state.categories[0] ? [state.categories[0].v] : [];
      newMovie.catAddedAt = {};
      if (!newMovie.addedAt) newMovie.addedAt = Date.now();
      newMovie.categories.forEach(c => { newMovie.catAddedAt[c] = newMovie.addedAt; });

      const ok = await addMovie(newMovie);
      if (ok){
        state.movies.push(newMovie);
        added++;
      } else {
        skipped++;
      }
    }

    render();
    hapticOk();
    customAlert('Готово! Добавлено: ' + added + (skipped ? ', пропущено (уже есть): ' + skipped : '') + '.');
  }

  function openChooseForTmdb(tmdbId, mediaType){

  function initSwipeBack(){
    let startX = 0, currentX = 0, isSwiping = false, startTime = 0;
    const app = document.getElementById('app');
    const arrowIndicator = document.getElementById('swipeArrowIndicator');

    app.addEventListener('touchstart', e => {
      if (e.touches[0].clientX < 45){
        startX = e.touches[0].clientX;
        currentX = startX;
        isSwiping = true;
        startTime = Date.now();
      }
    }, {passive:true});

    app.addEventListener('touchmove', e => {
      if (!isSwiping) return;
      currentX = e.touches[0].clientX;
      const diff = currentX - startX;
      
      if (diff > 0){
        app.style.transform = 'translateX(' + diff + 'px) scale(' + (1 - Math.min(diff / 1000, 0.05)) + ')';
        app.style.opacity = String(1 - Math.min(diff / 400, 0.6));
        app.style.transition = 'none';

        if (arrowIndicator) {
          const progress = Math.min(diff / 120, 1);
          const scale = 0.3 + progress * 0.7;
          const translateX = -20 + progress * 25;
          const opacity = progress;
          
          arrowIndicator.style.transform = `translateY(-50%) scale(${scale}) translateX(${translateX}px)`;
          arrowIndicator.style.opacity = opacity;
        }
      }
    }, {passive:true});

    app.addEventListener('touchend', e => {
      if (!isSwiping) return;
      isSwiping = false;
      const diff = currentX - startX;
      const duration = Date.now() - startTime;

      if (arrowIndicator) {
        arrowIndicator.style.transform = 'translateY(-50%) scale(0) translateX(-20px)';
        arrowIndicator.style.opacity = '0';
      }

      if (diff > 100 || (diff > 40 && duration < 250)){
        app.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease';
        app.style.transform = 'translateX(100vw) scale(0.9)';
        app.style.opacity = '0';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
          if (state.view === 'detail' || state.view === 'category' || state.view === 'discoverList' || state.view === 'choose') {
            popNav();
          } else if (state.view === 'search') {
            state.view = 'home';
          }
          render();
        }, 220);
      } else {
        app.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease';
        app.style.transform = 'translateX(0) scale(1)';
        app.style.opacity = '1';
        setTimeout(() => { 
          app.style.transition = ''; 
          app.style.transform = ''; 
          app.style.opacity = ''; 
        }, 200);
      }
    });
  }

  // Свайп вниз для закрытия карточки фильма (аналог свайпа влево-назад, только по
  // вертикали). Работает только на экране деталей и только когда лента уже
  // прокручена до самого верха — иначе жест будет конфликтовать с обычной
  // прокруткой контента карточки вниз.
  function initPullDownToClose(){
    let startY = 0, currentY = 0, startX = 0, isPulling = false, isConfirmedVertical = false, startTime = 0;
    const app = document.getElementById('app');

    app.addEventListener('touchstart', e => {
      if (state.view !== 'detail') return;
      if (app.scrollTop > 0) return;
      // Не перехватываем жест, если он начался на горизонтальной карусели скриншотов —
      // там у пользователя должна остаться возможность свайпать вбок.
      if (e.target.closest('.movie-screenshots-scroll')) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      currentY = startY;
      isPulling = true;
      isConfirmedVertical = false;
      startTime = Date.now();
    }, {passive:true});

    app.addEventListener('touchmove', e => {
      if (!isPulling) return;
      currentY = e.touches[0].clientY;
      const dy = currentY - startY;
      const dx = e.touches[0].clientX - startX;

      if (!isConfirmedVertical){
        // Ждём, пока станет понятно направление жеста: если движение в основном
        // горизонтальное или лента успела уйти от верха (значит это обычный скролл) —
        // жест закрытия отменяется и дальше ничего не трогаем.
        if (Math.abs(dx) > Math.abs(dy) || app.scrollTop > 0){
          isPulling = false;
          return;
        }
        if (dy > 8) isConfirmedVertical = true;
        else return;
      }

      if (dy > 0){
        app.style.transform = 'translateY(' + dy + 'px) scale(' + (1 - Math.min(dy / 1000, 0.05)) + ')';
        app.style.opacity = String(1 - Math.min(dy / 400, 0.6));
        app.style.transition = 'none';
      }
    }, {passive:true});

    app.addEventListener('touchend', () => {
      if (!isPulling) return;
      isPulling = false;
      const dy = isConfirmedVertical ? (currentY - startY) : 0;
      const duration = Date.now() - startTime;
      isConfirmedVertical = false;
      if (dy <= 0) return;

      if (dy > 110 || (dy > 50 && duration < 250)){
        app.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease';
        app.style.transform = 'translateY(100vh) scale(0.92)';
        app.style.opacity = '0';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
          if (state.view === 'detail') popNav();
          render();
        }, 220);
      } else {
        app.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease';
        app.style.transform = 'translateY(0) scale(1)';
        app.style.opacity = '1';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
        }, 200);
      }
    });
  }

    document.querySelectorAll('.rate-star-btn[data-rate]').forEach(btn => {
      btn.onclick = () => {

      };

    const toggleBtn = document.getElementById('toggleOverviewBtn');
    if (toggleBtn){
      toggleBtn.onclick = () => {
        isOverviewExpanded = !isOverviewExpanded;
        const overviewDiv = document.getElementById('detailOverview');
        const extraEl = document.getElementById('overviewExtra');
        if (overviewDiv && extraEl){
          if (isOverviewExpanded){
            // Сначала делаем элемент строчным (display:inline), но ещё прозрачным —
            // и только следующим кадром запускаем плавное появление (opacity), иначе
            // браузер схлопнёт переход display:none -> inline с opacity 0 -> 1 в один
            // мгновенный скачок без анимации.
            extraEl.classList.add('overview-extra-mounted');
            requestAnimationFrame(() => requestAnimationFrame(() => {
              overviewDiv.classList.add('expanded');
            }));
          } else {
            overviewDiv.classList.remove('expanded');
            const onFadeOut = (e) => {
              if (e.target !== extraEl || e.propertyName !== 'opacity') return;
              extraEl.classList.remove('overview-extra-mounted');
              extraEl.removeEventListener('transitionend', onFadeOut);
            };
            extraEl.addEventListener('transitionend', onFadeOut);
          }
        }
        toggleBtn.textContent = isOverviewExpanded ? 'свернуть' : 'еще';
      };
    }

    document.querySelectorAll('.movie-screenshot-item[data-fullscreen-index]').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.getAttribute('data-fullscreen-index'), 10);
        const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
        if (!m || !m.screenshots || !m.screenshots.length) return;
        
        let curIdx = idx;
        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        
        const updateModalContent = () => {
          modal.innerHTML = `
            <div class="fullscreen-counter">${curIdx + 1} / ${m.screenshots.length}</div>
            <button class="fullscreen-close">${icon('close', 20)}</button>
            <img src="${escapeHtml(m.screenshots[curIdx])}" alt="">
          `;
          modal.querySelector('.fullscreen-close').onclick = () => modal.remove();
          modal.onclick = (ev) => {
            if (ev.target === modal) modal.remove();
          };
        };
        
        updateModalContent();
        document.body.appendChild(modal);

        // Один и тот же жест обрабатывает и горизонтальное листание между картинками
        // (как раньше), и потягивание вниз для закрытия (как на карточке фильма) —
        // направление определяется по первому заметному сдвигу пальца и дальше не
        // меняется до конца текущего касания, чтобы жесты не путались между собой.
        let touchStartX = 0, touchStartY = 0, dragDir = null;
        modal.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          dragDir = null;
          const img = modal.querySelector('img');
          if (img) img.style.transition = 'none';
        }, {passive: true});

        modal.addEventListener('touchmove', (e) => {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (!dragDir){
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            dragDir = Math.abs(dy) > Math.abs(dx) ? 'vertical' : 'horizontal';
          }
          if (dragDir === 'vertical' && dy > 0){
            const img = modal.querySelector('img');
            if (img) img.style.transform = 'translateY(' + dy + 'px) scale(' + (1 - Math.min(dy / 1000, 0.08)) + ')';
            modal.style.background = 'rgba(0,0,0,' + Math.max(0.95 - Math.min(dy / 400, 0.75), 0.2) + ')';
          }
        }, {passive: true});

        modal.addEventListener('touchend', (e) => {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          const img = modal.querySelector('img');

          if (dragDir === 'vertical'){
            if (dy > 100){
              if (img){
                img.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
                img.style.transform = 'translateY(60vh) scale(0.85)';
                img.style.opacity = '0';
              }
              modal.style.transition = 'background 0.22s ease';
              modal.style.background = 'rgba(0,0,0,0)';
              setTimeout(() => modal.remove(), 200);
            } else if (img){
              img.style.transition = 'transform 0.2s ease';
              img.style.transform = 'translateY(0) scale(1)';
              modal.style.transition = 'background 0.2s ease';
              modal.style.background = 'rgba(0, 0, 0, 0.95)';
            }
          } else if (dragDir === 'horizontal' && Math.abs(dx) > 50) {
            if (dx > 0) {
              curIdx = (curIdx - 1 + m.screenshots.length) % m.screenshots.length;
            } else {
              curIdx = (curIdx + 1) % m.screenshots.length;
            }
            updateModalContent();
          }
          dragDir = null;
        }, {passive: true});
      };
    });

    const addCatBtn = document.getElementById('addCategoryBtn');
    if (addCatBtn){
      addCatBtn.onclick = () => {
        openAddCategoryChooser();
      };
    }

    const editCatBtn = document.getElementById('editCatBtn');

    const importBtn = document.getElementById('importLibraryBtn');

        importBtn.dataset.busy = '1';
        Promise.resolve(importLibrary()).finally(() => { importBtn.dataset.busy = '0'; });
      };
    }
  }
