<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KINOBLO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070a;
    --ink:#f5f5f6;
    --ink-dim:#a4a4ac;
    --ink-faint:#6c6c74;
    --accent:#ff2b3d;
    --accent-2:#ff5a6a;
    --accent-glow:rgba(255,43,61,.42);
    --glass:rgba(255,255,255,.055);
    --glass-strong:rgba(255,255,255,.10);
    --glass-border:rgba(255,255,255,.13);
    --glass-border-soft:rgba(255,255,255,.07);
    --radius:20px; --radius-sm:14px; --radius-pill:999px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(52% 38% at 12% 6%, rgba(255,43,61,.16), transparent 60%),
      radial-gradient(46% 34% at 92% 14%, rgba(120,90,255,.12), transparent 60%),
      radial-gradient(60% 42% at 50% 100%, rgba(255,180,60,.07), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
    overflow:hidden;
  }
  svg{display:block;flex-shrink:0;}
  #app{max-width:520px;margin:0 auto;height:100vh;overflow-y:auto;padding-bottom:160px;position:relative;-webkit-overflow-scrolling:touch;}
  ::-webkit-scrollbar{display:none;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;}
  input,textarea,select{
    font-family:'Inter',inherit;color:var(--ink);
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-border-soft);
    border-radius:var(--radius-sm);padding:13px 15px;font-size:15px;width:100%;outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus,textarea:focus{border-color:rgba(255,43,61,.55);background:var(--glass-strong);}
  textarea{resize:vertical;min-height:80px;}
  ::placeholder{color:var(--ink-faint);}

  .display{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.03em;font-weight:400;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--ink-faint);}

  .glass{
    background:linear-gradient(155deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
    backdrop-filter:blur(22px) saturate(150%);
    -webkit-backdrop-filter:blur(22px) saturate(150%);
    border:1px solid var(--glass-border);
    box-shadow:0 12px 34px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.09);
  }
  .glass-flat{
    background:var(--glass);
    backdrop-filter:blur(18px) saturate(140%);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-border-soft);
  }

  .topbar{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px 20px;text-align:center;}
  .netflix-brand{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .netflix-logo{font-family:'Bebas Neue',sans-serif;font-size:46px;letter-spacing:4px;color:var(--ink);text-shadow:0 0 30px var(--accent-glow), 0 4px 12px rgba(0,0,0,0.8);line-height:1;}
  .netflix-logo span{color:var(--accent);}
  
  .netflix-subtitle-row{display:flex;align-items:center;gap:8px;margin-top:2px;}
  .netflix-prz{font-size:12px;color:var(--ink-dim);font-weight:700;letter-spacing:2.5px;text-transform:uppercase;}
  
  .cross-smile-icon {
    width: 22px;
    height: 22px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.6));
  }

  .genres-scroll-bar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 20px 14px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
  }
  .genre-chip {
    flex: 0 0 auto;
    scroll-snap-align: start;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    background: var(--glass);
    border: 1px solid var(--glass-border-soft);
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-dim);
    transition: all .15s ease;
    cursor: pointer;
    backdrop-filter: blur(12px);
  }
  .genre-chip:active {
    transform: scale(0.95);
  }
  .genre-chip.active {
    background: linear-gradient(135deg, var(--accent-2), var(--accent));
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  .section{padding:14px 0 6px;}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;padding:0 20px;cursor:pointer;transition:opacity .12s ease;}
  .section-head:active{opacity:.62;}
  .section-title{display:flex;align-items:center;gap:9px;font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.8px;}
  .section-title .ic{width:19px;height:19px;display:flex;}
  .section-title .ic svg{width:19px;height:19px;}
  .section-count{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-faint);font-weight:600;letter-spacing:.5px;}
  .section-count svg{width:12px;height:12px;opacity:.8;}

  .movies-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:2px 20px 10px;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;}
  .movies-grid .card{width:100%;flex:none;}

  .row-scroll{display:flex;gap:13px;overflow-x:auto;padding:2px 20px 10px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;animation:rowIn .4s ease both;}
  @keyframes rowIn{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  .card{flex:0 0 134px;scroll-snap-align:start;border-radius:var(--radius-sm);overflow:visible;position:relative;transition:transform .18s ease;cursor:pointer;}
  .card:active{transform:scale(.95);}

  .poster-frame{border-radius:var(--radius-sm);overflow:hidden;position:relative;}
  .poster-frame.tier-none{padding:0;}
  .poster-frame.tier-poop{padding:3px;background:linear-gradient(135deg,#a9723e,#5b3a1c);box-shadow:0 0 16px rgba(139,94,46,.48);}
  .poster-frame.tier-pee{padding:3px;background:linear-gradient(135deg,#f0d95a,#a98b1e);box-shadow:0 0 16px rgba(216,180,40,.38);}
  .poster-frame.tier-green{padding:3px;background:linear-gradient(135deg,#4ee2ab,#0f9e6e);box-shadow:0 0 16px rgba(52,211,153,.4);}
  .poster-frame.tier-fire{padding:3px;background:linear-gradient(120deg,#ffd166,#ff7a1a,#ff2b3d,#ffd166);background-size:300% 300%;animation:fireRing 3s ease infinite;box-shadow:0 0 20px rgba(255,140,20,.5);}
  @keyframes fireRing{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
  .poster-frame > .poster{border-radius:calc(var(--radius-sm) - 3px);}
  .poster-frame.tier-none > .poster{border-radius:var(--radius-sm);}

  .poster{width:100%;height:210px;object-fit:cover;display:block;background:linear-gradient(160deg,#232228,#0c0c0f);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-faint);text-align:center;padding:8px;font-weight:600;}
  img.poster{display:block;padding:0;}

  .poster-caption{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:34px 11px 10px;background:linear-gradient(180deg, rgba(7,7,10,0) 0%, rgba(7,7,10,.48) 42%, rgba(7,7,10,.93) 100%);}
  .poster-caption .card-title{font-size:13px;font-weight:700;line-height:1.28;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.65);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .poster-caption .card-sub{margin-top:4px;font-size:10px;font-weight:600;letter-spacing:.3px;color:rgba(255,255,255,.66);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .rating-pill{position:absolute;top:8px;right:8px;z-index:3;display:flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;padding:4px 8px;border-radius:var(--radius-pill);background:rgba(9,9,11,.6);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);}
  .type-pill{position:absolute;top:8px;left:8px;z-index:3;font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:4px 8px;border-radius:var(--radius-pill);background:rgba(9,9,11,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.14);color:var(--ink-dim);}

  .empty{color:var(--ink-faint);font-size:13px;border-radius:var(--radius-sm);padding:24px;text-align:center;line-height:1.55;margin:0 20px;border:1px dashed var(--glass-border-soft);}

  .nav{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;z-index:40;pointer-events:none;}
  .nav-inner{pointer-events:auto;display:flex;gap:4px;padding:6px;border-radius:var(--radius-pill);}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink-dim);width:104px;padding:9px 4px 8px;border-radius:var(--radius-pill);transition:color .15s ease, background .15s ease;}
  .nav button.active{color:var(--ink);background:linear-gradient(135deg,var(--accent),#c8101f);box-shadow:0 6px 18px var(--accent-glow);}
  .nav svg{width:21px;height:21px;}
  .nav .nlabel{font-size:10px;font-weight:700;letter-spacing:.3px;}

  .search-bar-bottom{position:fixed;left:0;right:0;bottom:92px;display:flex;justify-content:center;z-index:39;pointer-events:none;padding:0 16px;}
  .search-bar-inner{pointer-events:auto;width:100%;max-width:488px;display:flex;align-items:center;gap:9px;padding:12px 16px;border-radius:var(--radius-pill);}
  .search-bar-inner svg{color:var(--ink-faint);flex:0 0 auto;}
  .search-bar-inner input{background:transparent;border:none;padding:2px 0;font-size:15.5px;backdrop-filter:none;-webkit-backdrop-filter:none;}
  .search-bar-inner input:focus{border:none;background:transparent;}
  .search-bar-inner .sb-clear{flex:0 0 auto;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);background:rgba(255,255,255,.08);}
  
  .search-results-dropdown {
    position: fixed;
    left: 16px;
    right: 16px;
    bottom: 152px;
    max-width: 488px;
    margin: 0 auto;
    max-height: 50vh;
    overflow-y: auto;
    z-index: 38;
    background: rgba(14, 14, 17, 0.75);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
    display: flex;
    flex-direction: column-reverse;
  }

  .discover-scroll-pad{height:2px;}

  .field label{display:block;font-size:11.5px;color:var(--ink-dim);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:7px;}

  .primary-btn{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;font-weight:700;font-size:15px;padding:15px;border-radius:var(--radius-pill);text-align:center;margin-top:4px;box-shadow:0 10px 26px var(--accent-glow);transition:transform .12s ease, box-shadow .12s ease;}
  .primary-btn:active{transform:scale(.97);box-shadow:0 4px 14px var(--accent-glow);}
  .secondary-btn{color:var(--ink);font-weight:600;font-size:14px;padding:13px;border-radius:var(--radius-pill);text-align:center;}
  .danger-btn{color:var(--accent-2);background:rgba(255,43,61,.08);border:1px solid rgba(255,43,61,.28);font-weight:700;padding:13px;border-radius:var(--radius-pill);text-align:center;backdrop-filter:blur(14px);}

  .subbar{display:flex;align-items:center;gap:12px;padding:20px 20px 8px;}
  .icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;color:var(--ink);}
  .icon-btn svg{width:18px;height:18px;}
  .subtitle{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.6px;}

  .detail-page{position:relative;z-index:1;animation:pageIn .34s cubic-bezier(.2,.8,.2,1) both;touch-action:pan-y;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;background:#07070a;}
  @keyframes pageIn{0%{opacity:0;transform:translateY(30px) scale(.98);}100%{opacity:1;transform:translateY(0) scale(1);}}
  
  .detail-hero-bg{position:absolute;inset:0;height:70vh;z-index:0;overflow:hidden;}
  .detail-hero-bg img{width:100%;height:100%;object-fit:cover;}
  .detail-hero-gradient{position:absolute;inset:0;background:linear-gradient(180deg, rgba(7,7,10,0.2) 0%, rgba(7,7,10,0.75) 50%, #07070a 100%);}
  
  .detail-top-controls{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:20px;}
  
  .detail-content{position:relative;z-index:5;padding:20px;display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:auto;}
  .detail-title{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:1;letter-spacing:1px;margin-bottom:12px;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,0.8);}
  
  .detail-overview{font-size:13.5px;line-height:1.5;color:rgba(255,255,255,0.85);margin-bottom:20px;max-width:400px;text-align:center;}
  .read-more-btn {
    color: var(--accent-2);
    font-weight: 600;
    cursor: pointer;
    background: none;
    border: none;
    padding: 0;
    font-size: 13.5px;
    margin-left: 4px;
    display: inline;
  }
  .read-more-btn:active {
    opacity: 0.7;
  }
  
  .detail-meta-row{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;font-size:13px;font-weight:600;color:rgba(255,255,255,0.7);margin-bottom:28px;}
  
  .detail-action-area{position:relative;z-index:5;padding:0 20px 30px;width:100%;}
  
  .movie-screenshots-scroll {
    display: flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 5px;
    scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch;
    width: 100%;
  }
  .movie-screenshot-item {
    flex: 0 0 160px;
    height: 96px;
    border-radius: var(--radius-sm);
    overflow: hidden;
    scroll-snap-align: start;
    cursor: pointer;
    border: 1px solid var(--glass-border);
    background: var(--glass);
    transition: transform .15s ease;
  }
  .movie-screenshot-item:active {
    transform: scale(0.96);
  }
  .movie-screenshot-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .fullscreen-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: pageIn .2s ease both;
    touch-action: pan-y;
  }
  .fullscreen-modal img {
    max-width: 100%;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .fullscreen-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2);
    z-index: 101;
  }
  .fullscreen-counter {
    position: absolute;
    top: 28px;
    left: 20px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.7);
    z-index: 101;
    background: rgba(255,255,255,0.1);
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    backdrop-filter: blur(10px);
  }

  .my-rating-box{border-radius:var(--radius-sm);padding:12px 14px;transition:all .3s ease;margin-bottom:14px;width:100%;max-width:380px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border-soft);backdrop-filter:blur(14px);}
  .my-rating-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .my-rating-label{font-size:10.5px;color:var(--ink-faint);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .my-rating-val-mini{font-size:12px;font-weight:700;color:var(--ink-dim);}
  
  .rate-stars-row{display:flex;align-items:center;justify-content:space-between;gap:4px;}
  .rate-star-btn{background:none;border:none;padding:4px;cursor:pointer;color:var(--ink-faint);transition:transform .15s ease, color .15s ease, filter .15s ease;display:flex;align-items:center;justify-content:center;}
  .rate-star-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;transition:all .15s ease;}
  .rate-star-btn:active{transform:scale(0.85);}
  
  .rate-star-btn.filled svg{fill:#f5c518;stroke:#f5c518;filter:drop-shadow(0 0 6px rgba(245,197,24,0.4));}
  .rate-star-btn.selected-star svg{transform:scale(1.35);fill:#f5c518;stroke:#f5c518;filter:drop-shadow(0 0 10px rgba(245,197,24,0.7));}

  .desc{font-size:14px;line-height:1.65;color:var(--ink-dim);white-space:pre-wrap;}
  .desc-card{border-radius:var(--radius);padding:17px 18px;margin-bottom:16px;width:100%;text-align:left;}

  .choose-wrap{padding:28px 20px 30px;display:flex;flex-direction:column;gap:14px;animation:pageIn .32s cubic-bezier(.2,.8,.2,1) both;}
  .choose-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.5px;margin-bottom:2px;}
  .choose-sub{font-size:13.5px;color:var(--ink-dim);margin-bottom:8px;}
  .choose-btn{display:flex;align-items:center;gap:15px;border-radius:var(--radius);padding:18px;}
  .choose-btn:active{transform:scale(.98);}
  .choose-icon{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;box-shadow:0 8px 20px rgba(0,0,0,.35);}
  .choose-icon svg{width:22px;height:22px;color:#fff;}
  .choose-text{text-align:left;}
  .choose-text .t1{font-size:16px;font-weight:700;}
  .choose-text .t2{font-size:12px;color:var(--ink-faint);margin-top:2px;}

  .add-cat-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin:8px 20px 6px;}
  .cat-icon-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:4px 0 16px;max-height:260px;overflow-y:auto;padding-right:2px;}
  .cat-icon-opt{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--glass-border-soft);color:var(--ink-dim);transition:transform .12s ease;}
  .cat-icon-opt:active{transform:scale(.9);}
  .cat-icon-opt.active{background:linear-gradient(135deg,var(--accent-2),var(--accent) 70%);color:#fff;border-color:transparent;}

  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(2px);z-index:80;display:flex;align-items:flex-end;justify-content:center;}
  .modal{width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px;max-height:88vh;overflow-y:auto;background:linear-gradient(155deg, rgba(24,24,28,.92), rgba(14,14,17,.96));backdrop-filter:blur(28px) saturate(160%);-webkit-backdrop-filter:blur(28px) saturate(160%);border:1px solid var(--glass-border);border-bottom:none;box-shadow:0 -12px 40px rgba(0,0,0,.5);}
  .modal-msg{font-size:14.5px;line-height:1.6;color:var(--ink-dim);padding:8px 4px 10px;}
  .modal-title{font-family:'Bebas Neue',sans-serif;font-size:19px;letter-spacing:.5px;padding:2px 4px 4px;}
  .modal-actions{display:flex;gap:8px;}
  .modal-actions button{flex:1;}
  .load-more-btn{display:block;width:calc(100% - 40px);margin:6px 20px 4px;padding:14px;border-radius:var(--radius-pill);text-align:center;font-weight:700;font-size:13.5px;color:var(--ink-dim);}
  .load-more-btn:active{transform:scale(.98);}
  
  .search-action-bar {display:flex; gap:10px; width:100%; margin-bottom:14px; max-width:380px;}
  .search-action-bar select {flex:1;}
  .search-fav-btn {width:52px; height:52px; border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center; background:var(--glass); border:1px solid var(--glass-border-soft); flex:0 0 auto; color:var(--ink-dim); transition:all .15s ease;}
  .search-fav-btn.active {background:var(--accent); color:#fff; border-color:transparent; box-shadow:0 4px 14px var(--accent-glow);}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  let tg = null;

  const IDX_KEY = 'kinoblo_index';

  const movieKey = id => 'kinoblo_movie_' + id;

  let storageBackend = 'local';

  function deviceStorageUsable(){
    return !!(tg && tg.DeviceStorage && typeof tg.DeviceStorage.setItem === 'function'
      && typeof tg.isVersionAtLeast === 'function' && tg.isVersionAtLeast('9.0'));
  }
  function rawGet(key){
    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.getItem(key, (err, value) => resolve(err ? null : (value || null))); }
        catch(e){ resolve(null); }
      } else {
        try{ resolve(localStorage.getItem(key)); }catch(e){ resolve(null); }
      }
    });
  }
  function rawSet(key, value){
    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.setItem(key, value, (err, ok) => resolve(!err && ok !== false)); }
        catch(e){ resolve(false); }
      } else {
        try{ localStorage.setItem(key, value); resolve(true); }catch(e){ resolve(false); }
      }
    });
  }
  function rawRemove(key){
    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.removeItem(key, (err, ok) => resolve(!err && ok !== false)); }
        catch(e){ resolve(false); }
      } else {
        try{ localStorage.removeItem(key); resolve(true); }catch(e){ resolve(false); }
      }
    });
  }

  const STORAGE = {
    async init(){
      storageBackend = deviceStorageUsable() ? 'device' : 'local';
      await this.migrate();
    },
    async getMovieIds(){
      const raw = await rawGet(IDX_KEY);
      if (!raw) return [];
      try{ const arr = JSON.parse(raw); return Array.isArray(arr) ? arr : []; }catch(e){ return []; }
    },
    async saveMovieIds(ids){ return rawSet(IDX_KEY, JSON.stringify(ids)); },
    async getMovie(id){
      const raw = await rawGet(movieKey(id));
      if (!raw) return null;
      try{ return JSON.parse(raw); }catch(e){ return null; }
    },
    async saveMovie(movie){
      const ok = await rawSet(movieKey(movie.id), JSON.stringify(movie));
      if (!ok) return false;
      const ids = await this.getMovieIds();
      if (ids.indexOf(movie.id) === -1){ ids.push(movie.id); await this.saveMovieIds(ids); }
      return true;
    },
    async deleteMovie(id){
      await rawRemove(movieKey(id));
      const ids = await this.getMovieIds();
      const ok = await this.saveMovieIds(ids.filter(x => x !== id));
      return ok;
    },
    async loadAllMovies(){
      const ids = await this.getMovieIds();
      const out = [];
      for (const id of ids){ const m = await this.getMovie(id); if (m) out.push(m); }
      return out;
    },
    async getCategories(){
      const raw = await rawGet(CAT_KEY);
      if (!raw) return null;
      try{ const arr = JSON.parse(raw); return Array.isArray(arr) && arr.length ? arr : null; }catch(e){ return null; }
    },
    async saveCategories(cats){ return rawSet(CAT_KEY, JSON.stringify(cats)); },
    async getSetting(key){ return rawGet('kinoblo_setting_' + key); },
    async setSetting(key, value){ return rawSet('kinoblo_setting_' + key, value); },
    async migrate(){
      const already = await rawGet(MIGRATED_KEY);
      if (already) return;
      let oldRaw = null;
      try{ oldRaw = localStorage.getItem(OLD_BLOB_KEY); }catch(e){}
      if (!oldRaw && tg && tg.CloudStorage){
        oldRaw = await new Promise(resolve => {
          try{ tg.CloudStorage.getItem(OLD_BLOB_KEY, (err, v) => resolve(err ? null : v)); }
          catch(e){ resolve(null); }
        });
      }
      if (oldRaw){
        let oldMovies = [];
        try{ oldMovies = JSON.parse(oldRaw); }catch(e){ oldMovies = []; }
        if (Array.isArray(oldMovies) && oldMovies.length){
          const ids = await this.getMovieIds();
          for (const m of oldMovies){
            if (!m || !m.id) continue;
            await rawSet(movieKey(m.id), JSON.stringify(m));
            if (ids.indexOf(m.id) === -1) ids.push(m.id);
          }
          await this.saveMovieIds(ids);
        }
      }
      await rawSet(MIGRATED_KEY, '1');
    }
  };

  let _storageErrorShown = false;
  function reportStorageError(msg){
    if (_storageErrorShown) return;
    _storageErrorShown = true;
    customAlert(msg);
    setTimeout(() => { _storageErrorShown = false; }, 4000);
  }
  async function loadMovies(){ return STORAGE.loadAllMovies(); }
  async function addMovie(movie){
    const ok = await STORAGE.saveMovie(movie);
    if (!ok) reportStorageError('Не удалось сохранить фильм. Освободи немного места в хранилище.');
    return ok;
  }
  async function updateMovie(movie){
    const ok = await STORAGE.saveMovie(movie);
    if (!ok) reportStorageError('Не удалось сохранить изменения. Освободи немного места в хранилище.');
    return ok;
  }
  async function deleteMovie(id){
    const ok = await STORAGE.deleteMovie(id);
    if (!ok) reportStorageError('Не удалось удалить фильм. Попробуй ещё раз.');
    return ok;
  }

  const _pendingSaves = {};
  function saveMovieDebounced(movie, delay){
    if (_pendingSaves[movie.id]) clearTimeout(_pendingSaves[movie.id].timer);
    _pendingSaves[movie.id] = { movie, timer: setTimeout(() => {
      delete _pendingSaves[movie.id];
      updateMovie(movie);
    }, delay || 500) };
  }
  function flushPendingSave(id){
    const p = _pendingSaves[id];
    if (!p) return;
    clearTimeout(p.timer);
    delete _pendingSaves[id];
    updateMovie(p.movie);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){
      Object.keys(_pendingSaves).forEach(flushPendingSave);
    }
  });

  async function loadAll(){
    await STORAGE.init();
    state.movies = await loadMovies();
    let cats = await STORAGE.getCategories();
    if (!cats){ cats = DEFAULT_CATEGORIES.slice(); await STORAGE.saveCategories(cats); }
    state.categories = cats;
    const savedTmdbKey = await STORAGE.getSetting('tmdb_key');
    state.tmdbKey = savedTmdbKey || DEFAULT_TMDB_KEY;
    state.loaded = true;
    render();
    initSwipeBack();
  }

  async function tmdbFetch(path, key){
    const base = 'https://api.themoviedb.org/3';
    const sep = path.indexOf('?') > -1 ? '&' : '?';
    const url = base + path + sep + 'api_key=' + encodeURIComponent(key) + '&language=ru-RU';
    const res = await fetch(url);
    if (!res.ok) throw new Error('TMDB HTTP ' + res.status);
    return res.json();
  }

  function mapTmdbItem(r, forcedKind){
    const isTv = forcedKind ? forcedKind === 'tv' : r.media_type === 'tv';
    const gmap = isTv ? TMDB_TV_GENRE_MAP : TMDB_GENRE_MAP;
    return {
      tmdbId: r.id,
      mediaType: isTv ? 'tv' : 'movie',
      title: (isTv ? (r.name || r.original_name) : (r.title || r.original_title)) || '',
      year: ((isTv ? r.first_air_date : r.release_date) || '').slice(0, 4),
      poster: r.poster_path ? ('https://image.tmdb.org/t/p/w500' + r.poster_path) : '',
      description: r.overview || '',
      genres: (r.genre_ids || []).map(id => gmap[id]).filter(Boolean),
      voteAverage: typeof r.vote_average === 'number' ? r.vote_average : null,
      popularity: r.popularity || 0,
      type: isTv ? 'series' : 'movie'
    };
  }

  async function loadDiscoverCategory(cat){
    if (state.discover.cache[cat.key] || state.discover.loading[cat.key]) return;
    state.discover.loading[cat.key] = true;
    try{
      let items = [];
      if (cat.path){
        const data = await tmdbFetch(cat.path, state.tmdbKey);
        items = (data.results || []).map(r => ({r, kind: cat.kind}));
      } else if (cat.special === 'lgbt'){
        let kwIds = state.discover.lgbtKeywordIds;
        if (!kwIds){
          const [kw1, kw2] = await Promise.all([
            tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
            tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
          ]);
          const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
          const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
          kwIds = [id1, id2].filter(Boolean);
          state.discover.lgbtKeywordIds = kwIds;
        }
        if (kwIds.length){
          const kwParam = kwIds.join('|');
          const [mv, tv] = await Promise.all([
            tmdbFetch('/discover/movie?with_keywords=' + kwParam + '&sort_by=popularity.desc&primary_release_date.gte=2015-01-01', state.tmdbKey),
            tmdbFetch('/discover/tv?with_keywords=' + kwParam + '&sort_by=popularity.desc&first_air_date.gte=2015-01-01', state.tmdbKey)
          ]);
          items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
        }
      } else if (cat.provider || cat.company){
        const param = cat.provider ? ('with_watch_providers=' + cat.provider + '&watch_region=US') : ('with_companies=' + cat.company);
        const [mv, tv] = await Promise.all([
          tmdbFetch('/discover/movie?' + param + '&sort_by=popularity.desc', state.tmdbKey),
          tmdbFetch('/discover/tv?' + param + '&sort_by=popularity.desc', state.tmdbKey)
        ]);
        items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
      }
      items.sort((a,b) => (b.r.popularity || 0) - (a.r.popularity || 0));
      state.discover.cache[cat.key] = items.slice(0, 14).map(x => mapTmdbItem(x.r, x.kind));
    }catch(e){
      state.discover.cache[cat.key] = [];
    }
    state.discover.loading[cat.key] = false;
    render();
  }

  async function loadDiscoverFullPage(key){
    const cat = discoverCatByKey(key);
    if (!cat || state.discover.fullLoading[key] || state.discover.fullDone[key]) return;
    state.discover.fullLoading[key] = true;
    render();
    const page = (state.discover.fullPage[key] || 0) + 1;
    let items = [];
    try{
      if (cat.path){
        const sep = cat.path.indexOf('?') > -1 ? '&' : '?';
        const data = await tmdbFetch(cat.path + sep + 'page=' + page, state.tmdbKey);
        items = (data.results || []).map(r => mapTmdbItem(r, cat.kind));
        if (page >= (data.total_pages || 1)) state.discover.fullDone[key] = true;
      } else if (cat.special === 'lgbt'){
        let kwIds = state.discover.lgbtKeywordIds;
        if (!kwIds){
          const [kw1, kw2] = await Promise.all([
            tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
            tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
          ]);
          const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
          const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
          kwIds = [id1, id2].filter(Boolean);
          state.discover.lgbtKeywordIds = kwIds;
        }
        if (kwIds.length){
          const kwParam = kwIds.join('|');
          const [mv, tv] = await Promise.all([
            tmdbFetch('/discover/movie?with_keywords=' + kwParam + '&sort_by=popularity.desc&primary_release_date.gte=2015-01-01&page=' + page, state.tmdbKey),
            tmdbFetch('/discover/tv?with_keywords=' + kwParam + '&sort_by=popularity.desc&first_air_date.gte=2015-01-01&page=' + page, state.tmdbKey)
          ]);
          items = (mv.results||[]).map(r=>mapTmdbItem(r,'movie')).concat((tv.results||[]).map(r=>mapTmdbItem(r,'tv')));
          items.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
          const maxPages = Math.max(mv.total_pages||1, tv.total_pages||1);
          if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
        } else { state.discover.fullDone[key] = true; }
      } else if (cat.provider || cat.company){
        const param = cat.provider ? ('with_watch_providers=' + cat.provider + '&watch_region=US') : ('with_companies=' + cat.company);
        const [mv, tv] = await Promise.all([
          tmdbFetch('/discover/movie?' + param + '&sort_by=popularity.desc&page=' + page, state.tmdbKey),
          tmdbFetch('/discover/tv?' + param + '&sort_by=popularity.desc&page=' + page, state.tmdbKey)
        ]);
        items = (mv.results||[]).map(r=>mapTmdbItem(r,'movie')).concat((tv.results||[]).map(r=>mapTmdbItem(r,'tv')));
        items.sort((a,b)=>(b.popularity||0)-(a.popularity||0));
        const maxPages = Math.max(mv.total_pages||1, tv.total_pages||1);
        if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
      }
      const existing = state.discover.full[key] || [];
      const seen = new Set(existing.map(x => x.mediaType + '_' + x.tmdbId));
      const merged = existing.concat(items.filter(x => !seen.has(x.mediaType + '_' + x.tmdbId)));
      state.discover.full[key] = merged;
      state.discover.fullPage[key] = page;
      if (page >= 20) state.discover.fullDone[key] = true;
    }catch(e){
      if (!(state.discover.full[key] || []).length) state.discover.full[key] = [];
      state.discover.fullDone[key] = true;
    }
    state.discover.fullLoading[key] = false;
    render();
  }

  async function tmdbSearch(query, key){
    const data = await tmdbFetch('/search/multi?query=' + encodeURIComponent(query), key);
    let results = (data.results || [])
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .slice(0, 10)
      .map(r => mapTmdbItem(r));
    
    results.sort((a, b) => (a.popularity || 0) - (b.popularity || 0));
    
    return results;

  function tierMeta(r){
    if (r == null) return null;
    if (r <= 3) return {key:'poop', color:'#c9935a', iconName:'minimalPoop'};
    if (r <= 6) return {key:'pee', color:'#e8c94a', iconName:'minimalMinus'};
    if (r <= 9) return {key:'green', color:'#34d399', iconName:'minimalThumbUp'};
    return {key:'fire', color:'#ffb347', iconName:'minimalFire'};
  }
  
  function ratingPill(r){
    const t = tierMeta(r);
    if (!t) return '';
    let svgIcon = '';
    if (t.key === 'poop') svgIcon = icon('minimalPoop', 13);
    else if (t.key === 'pee') svgIcon = icon('minimalMinus', 13);
    else if (t.key === 'green') svgIcon = icon('minimalThumbUp', 13);
    else if (t.key === 'fire') svgIcon = icon('minimalFire', 13);

    return '<div class="rating-pill" style="color:'+t.color+';">' + svgIcon + '<span>'+r+'</span></div>';
  }

  function getSimilarRecommendations(currentMovie) {
    let poolMap = new Map();
    state.movies.forEach(m => {
      if (m.id !== currentMovie.id && m.tmdbId !== currentMovie.tmdbId) {
        poolMap.set(m.id, { ...m, _sourceType: 'local' });
      }
    });
    Object.values(state.discover.cache).forEach(list => {
      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item.tmdbId !== currentMovie.tmdbId) {
            poolMap.set('tmdb_' + item.mediaType + '_' + item.tmdbId, { ...item, id: 'tmdb_' + item.mediaType + '_' + item.tmdbId, _sourceType: 'tmdb' });
          }
        });
      }
    });

    let candidates = Array.from(poolMap.values());
    if (candidates.length === 0) return [];

    const curTitle = (currentMovie.title || '').toLowerCase();
    const curType = currentMovie.type || (currentMovie.mediaType === 'tv' ? 'series' : 'movie');
    const curGenres = genresOf(currentMovie).map(g => g.toLowerCase());
    const curProd = (currentMovie.producer || currentMovie.company || '').toLowerCase();

    candidates.forEach(item => {
      let score = 0;
      const itemTitle = (item.title || '').toLowerCase();
      const itemType = item.type || (item.mediaType === 'tv' ? 'series' : 'movie');
      const itemGenres = genresOf(item).map(g => g.toLowerCase());
      const itemProd = (item.producer || item.company || '').toLowerCase();

      if (curTitle && itemTitle) {
        if (itemTitle === curTitle) {
          score += 50;
        } else if (itemTitle.includes(curTitle) || curTitle.includes(itemTitle)) {
          score += 30;
        } else {
          const curWords = curTitle.split(/\s+/).filter(w => w.length > 2);
          const itemWords = itemTitle.split(/\s+/).filter(w => w.length > 2);
          let commonWords = curWords.filter(w => itemWords.includes(w));
          score += commonWords.length * 15;
        }
      }

      if (curType && itemType && curType === itemType) {
        score += 20;
      }

      if (curGenres.length > 0 && itemGenres.length > 0) {
        let matchedGenres = itemGenres.filter(g => curGenres.includes(g));
        score += matchedGenres.length * 10;
      }

      if (curProd && itemProd && (itemProd.includes(curProd) || curProd.includes(itemProd))) {
        score += 15;
      }

      score += (item.popularity || 0) / 1000;
      item._matchScore = score;
    });

    candidates.sort((a, b) => b._matchScore - a._matchScore);
    return candidates.slice(0, 10);
  }

  function viewNav(){
    return '<div class="nav"><div class="nav-inner glass">'
    + '<button data-nav="home" class="'+(state.view==='home'?'active':'')+'">'+icon('home',22)+'<span class="nlabel">Главная</span></button>'
    + '<button data-nav="search" class="'+(state.view==='search'?'active':'')+'">'+icon('search',22)+'<span class="nlabel">Поиск</span></button>'
    + '</div></div>';

  function render(){
    const app = document.getElementById('app');
    if (!state.loaded){ app.innerHTML = '<div style="text-align:center;color:var(--ink-faint);padding-top:80px;font-size:13px;">Загружаю KINOBLO…</div>'; return; }
    let html = '';
    if (state.view === 'home') html = viewHome();
    else if (state.view === 'search') html = viewSearch();
    else if (state.view === 'choose') html = viewChoose();
    else if (state.view === 'detail') html = viewDetail();
    else if (state.view === 'category') html = viewCategory();
    else if (state.view === 'discoverList') html = viewDiscoverList();
    const showBottomSearch = state.view === 'search';
    if (showBottomSearch) html += searchBarBottomHtml();
    const hideNav = state.view === 'choose' || state.view === 'detail';
    if (!hideNav) html += viewNav();
    app.innerHTML = html;
    bindEvents();
    if (showBottomSearch && !(state.tmdbQuery && state.tmdbQuery.trim())){
      DISCOVER_CATEGORIES.forEach(cat => { if (!state.discover.cache[cat.key]) loadDiscoverCategory(cat); });
    }
    
    if (state.view === 'search' || state.view === 'discoverList' || state.view === 'home') {
      const pos = state.scrollPositions[state.view] || 0;
      if (pos > 0) {
        setTimeout(() => app.scrollTop = pos, 10);
      }
    }
  }

  function focusSearchInput(){
    const el = document.getElementById('tmdbQueryBottom');
    if (!el) return;
    el.focus();
    const v = el.value; el.value = ''; el.value = v;
  }

  async function openMovie(id){ 
    isOverviewExpanded = false; 
    previousView = state.view; 
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    state.detailId = id; 
    state.previewItem = null; 
    
    const m = state.movies.find(x => x.id === id);
    if (m && m.tmdbId && (!m.screenshots || m.screenshots.length === 0)) {
      tmdbImages(m.tmdbId, m.mediaType || 'movie', state.tmdbKey).then(shots => {
        if (shots && shots.length > 0) {
          m.screenshots = shots;
          saveMovieDebounced(m, 10);
          if (state.detailId === id) render();
        }
      });
    }

    state.view = 'detail'; 
    render(); 
    document.getElementById('app').scrollTop = 0;
  }
  
  function openPreview(item){ 
    isOverviewExpanded = false; 
    previousView = state.view; 
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    state.previewItem = item; 
    state.detailId = null; 
    state.view = 'detail'; 
    render(); 
    document.getElementById('app').scrollTop = 0;
  }

  async function openTmdbItemPreview(tmdbId, mediaType){
    try{
      const data = await tmdbFetch('/' + mediaType + '/' + tmdbId, state.tmdbKey);
      const gmap = mediaType === 'tv' ? TMDB_TV_GENRE_MAP : TMDB_GENRE_MAP;
      const screenshots = await tmdbImages(tmdbId, mediaType, state.tmdbKey);
      
      const existing = state.movies.some(x => x.tmdbId === Number(tmdbId));
      if (existing) {
        const match = state.movies.find(x => x.tmdbId === Number(tmdbId));
        if (match) openMovie(match.id);
        return;
      }

      const item = {
        id: 'tmdb_' + mediaType + '_' + tmdbId,
        tmdbId: Number(tmdbId),
        mediaType: mediaType,
        title: mediaType === 'tv' ? (data.name || data.original_name) : (data.title || data.original_title),
        year: (mediaType === 'tv' ? data.first_air_date : data.release_date || '').slice(0, 4),
        poster: data.poster_path ? ('https://image.tmdb.org/t/p/w500' + data.poster_path) : '',
        description: data.overview || '',
        genres: (data.genres || []).map(g => g.name || gmap[g.id]).filter(Boolean),
        type: mediaType === 'tv' ? 'series' : 'movie',
        screenshots: screenshots,
        myRating: null,
        myNote: '',
        status: ''
      };
      openPreview(item);
    }catch(e){
      customAlert('Не удалось загрузить информацию о фильме.');
    }
  }

  async function quickToggleFav(tmdbId, mediaType, e){
    if(e) e.stopPropagation();
    try {
      const data = await tmdbFetch('/' + mediaType + '/' + tmdbId, state.tmdbKey);
      const gmap = mediaType === 'tv' ? TMDB_TV_GENRE_MAP : TMDB_GENRE_MAP;
      const screenshots = await tmdbImages(tmdbId, mediaType, state.tmdbKey);
      const item = {
        id: 'tmdb_' + mediaType + '_' + tmdbId,
        tmdbId: Number(tmdbId),
        mediaType: mediaType,
        title: mediaType === 'tv' ? (data.name || data.original_name) : (data.title || data.original_title),
        year: (mediaType === 'tv' ? data.first_air_date : data.release_date || '').slice(0, 4),
        poster: data.poster_path ? ('https://image.tmdb.org/t/p/w500' + data.poster_path) : '',
        description: data.overview || '',
        genres: (data.genres || []).map(g => g.name || gmap[g.id]).filter(Boolean),
        type: mediaType === 'tv' ? 'series' : 'movie',
        screenshots: screenshots,
        myRating: null,
        myNote: '',
        status: ''
      };
      
      openCategorySelectorModal(item, async (chosenCat) => {
        const alreadyInThisCategory = state.movies.some(x => x.tmdbId === Number(tmdbId) && x.status === chosenCat);
        if (alreadyInThisCategory) {
          customAlert('Этот фильм уже добавлен в данную категорию!');
          const existing = state.movies.find(x => x.tmdbId === Number(tmdbId) && x.status === chosenCat);
          if (existing) openMovie(existing.id);
          return;
        }

        item.status = chosenCat;
        state.movies.push(item);
        await addMovie(item);
        render();
      });
    } catch(err) {
      customAlert('Не удалось добавить фильм.');
    }
  }

  function openCategorySelectorModal(item, onSelect){
    const body = '<div class="modal-msg" style="padding-top:2px;padding-bottom:12px;">Выберите категорию для фильма <b>'+escapeHtml(item.title)+'</b>:</div>'
      + '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:12px;">'
      + state.categories.map(c => '<button type="button" class="choose-btn glass-flat" data-choose-cat="'+c.v+'" style="padding:14px;justify-content:flex-start;"><span style="color:'+(c.color||'var(--accent)')+';margin-right:10px;">'+icon(c.icon,20)+'</span><span style="font-weight:600;">'+escapeHtml(c.l)+'</span></button>').join('')

    const overlay = customModal('Добавить в категорию', body);

      btn.addEventListener('click', () => {
        const catVal = btn.getAttribute('data-choose-cat');

  function goHomeAnimated(){
    if (state.detailId) flushPendingSave(state.detailId);
    const page = document.getElementById('detailPage');
    if (page){
      page.style.transition = 'transform .26s cubic-bezier(.2,.8,.2,1), opacity .26s ease';
      page.style.transform = 'translateY(100%)';
      page.style.opacity = '0';
      setTimeout(() => { 
        const targetView = previousView || 'home';
        state.detailId=null; 
        state.previewItem=null; 
        state.view=targetView; 
        render(); 
        document.getElementById('app').scrollTop = state.scrollPositions[targetView] || 0; 
      }, 230);
    } else {
      const targetView = previousView || 'home';
      state.detailId = null; state.previewItem = null; state.view = targetView; render();
      document.getElementById('app').scrollTop = state.scrollPositions[targetView] || 0;
    }

  function customModal(titleText, bodyHtml){
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = '<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="modal-title">'+escapeHtml(titleText)+'</div><button class="icon-btn glass-flat" id="closeModal">'+icon('close',16)+'</button></div>'+bodyHtml+'</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    overlay.querySelector('#closeModal').addEventListener('click', () => overlay.remove());
    return overlay;
  }
  function customAlert(msg){ customModal('KINOBLO', '<div class="modal-msg">'+escapeHtml(msg)+'</div>'); }
  function customConfirm(msg, onYes){
    const overlay = customModal('Подтверждение', '<div class="modal-msg">'+escapeHtml(msg)+'</div><div class="modal-actions"><button class="secondary-btn glass-flat" id="cfNo">Отмена</button><button class="danger-btn" id="cfYes">Да</button></div>');
    overlay.querySelector('#cfNo').addEventListener('click', () => overlay.remove());
    overlay.querySelector('#cfYes').addEventListener('click', () => { overlay.remove(); onYes(); });
  }

  function triggerBackAction() {
    if (state.view === 'home' || state.view === 'search') return;
    
    if (state.view === 'detail' && state.previewItem && !state.movies.some(x=>x.id===state.previewItem.id)){
      state.previewItem = null; state.view = previousView || 'search'; render();
    } else if (state.view === 'detail') {
      goHomeAnimated();
    } else if (state.view === 'category' || state.view === 'discoverList') {
      const prevView = state.view === 'discoverList' ? 'search' : 'home';
      state.view = prevView; 
      render();
      document.getElementById('app').scrollTop = state.scrollPositions[prevView] || 0;
    } else {
      state.view = 'home'; render();
    }
  }

  function initSwipeBack() {
    let touchStartX = 0;
    let touchStartY = 0;
    
    const appEl = document.getElementById('app');
    if (!appEl) return;

    appEl.addEventListener('touchstart', e => {
      if (state.view === 'home' || state.view === 'search') return;
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }
    }, {passive: true});

    appEl.addEventListener('touchend', e => {
      if (state.view === 'home' || state.view === 'search') return;
      if (e.changedTouches && e.changedTouches.length > 0) {
        const touchEndX = e.changedTouches[0].clientX;
        const touchEndY = e.changedTouches[0].clientY;
        
        const diffX = touchEndX - touchStartX;
        const diffY = Math.abs(touchEndY - touchStartY);

        if (touchStartX <= 50 && diffX > 70 && diffY < 60) {
          triggerBackAction();
        }
      }
    }, {passive: true});
  }

  function bindEvents(){
    document.querySelectorAll('[data-open]').forEach(el => el.addEventListener('click', () => openMovie(el.getAttribute('data-open'))));

    document.querySelectorAll('[data-cat]').forEach(el => el.addEventListener('click', () => {
      state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
      state.categoryFilter = el.getAttribute('data-cat');
      state.view = 'category';
      render();
      document.getElementById('app').scrollTop = 0;
    }));

    const toggleOverviewBtn = document.getElementById('toggleOverviewBtn');
    if (toggleOverviewBtn) {
      toggleOverviewBtn.addEventListener('click', () => {
        isOverviewExpanded = !isOverviewExpanded;
        render();
      });
    }

    document.querySelectorAll('[data-discover-cat]').forEach(el => el.addEventListener('click', () => openDiscoverList(el.getAttribute('data-discover-cat'))));
    document.querySelectorAll('[data-discover-pick]').forEach(el => el.addEventListener('click', () => {
      openTmdbItemPreview(el.getAttribute('data-discover-pick'), el.getAttribute('data-discover-type'));
    }));
    document.querySelectorAll('[data-tmdb-preview]').forEach(el => el.addEventListener('click', () => {
      openTmdbItemPreview(el.getAttribute('data-tmdb-preview'), el.getAttribute('data-tmdb-type'));
    }));
    document.querySelectorAll('[data-quick-fav]').forEach(el => {
      el.addEventListener('click', (e) => quickToggleFav(el.getAttribute('data-quick-fav'), el.getAttribute('data-quick-type'), e));
    });

    const backBtn = document.getElementById('backBtn');
    if (backBtn) backBtn.addEventListener('click', triggerBackAction);

    const addCatBtn = document.getElementById('addCategoryBtn');
    if (addCatBtn) addCatBtn.addEventListener('click', openAddCategoryModal);

    const editCatBtn = document.getElementById('editCatBtn');
    if (editCatBtn) editCatBtn.addEventListener('click', openEditCategoryModal);

    const loadMoreDiscover = document.getElementById('loadMoreDiscover');
    if (loadMoreDiscover) loadMoreDiscover.addEventListener('click', () => loadDiscoverFullPage(state.discoverListKey));

    const qInput = document.getElementById('tmdbQueryBottom');
    if (qInput){
      qInput.addEventListener('input', e => {
        state.tmdbQuery = e.target.value;
        const clr = document.getElementById('tmdbQueryBottomClear');
        if (state.tmdbQuery && !clr){
          render(); focusSearchInput();
        } else if (!state.tmdbQuery && clr){
          render(); focusSearchInput();
        }
        if (tmdbSearchTimer) clearTimeout(tmdbSearchTimer);
        const q = state.tmdbQuery.trim();
        if (!q){ state.tmdbResults = null; render(); focusSearchInput(); return; }
        tmdbSearchTimer = setTimeout(async () => {
          try{
            state.tmdbResults = await tmdbSearch(q, state.tmdbKey);
          }catch(e){ state.tmdbResults = []; }
          render();
          focusSearchInput();
        }, 350);
      });
      qInput.addEventListener('focus', () => {
        if (state.view !== 'search'){ state.view = 'search'; render(); focusSearchInput(); }
      });
    }

    const clrBtn = document.getElementById('tmdbQueryBottomClear');
    if (clrBtn) clrBtn.addEventListener('click', () => {
      state.tmdbQuery = ''; state.tmdbResults = null; render(); focusSearchInput();
    });

    document.querySelectorAll('[data-nav]').forEach(el => el.addEventListener('click', () => {
      const v = el.getAttribute('data-nav');
      if (v === 'home'){
        if (state.view === 'home') {
          state.scrollPositions['home'] = 0;
          document.getElementById('app').scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          state.scrollPositions['home'] = 0;
          state.view = 'home';
          state.detailId = null;
          state.previewItem = null;
          render();
          document.getElementById('app').scrollTop = 0;
        }
      }
      else if (v === 'search'){
        if (state.view === 'search') {
          state.tmdbQuery = '';
          state.tmdbResults = null;
          state.scrollPositions['search'] = 0;
          render();
          document.getElementById('app').scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          state.scrollPositions['search'] = 0;
          state.view = 'search';
          state.detailId = null;
          state.previewItem = null;
          render();
          document.getElementById('app').scrollTop = 0;
        }
      }
    }));

    const saveFromDetail = document.getElementById('saveFromDetail');
    if (saveFromDetail && state.previewItem){
      saveFromDetail.addEventListener('click', async () => {
        const item = state.previewItem;
        
        openCategorySelectorModal(item, async (chosenCat) => {
          const alreadyInThisCategory = state.movies.some(x => x.tmdbId === item.tmdbId && x.status === chosenCat);
          if (alreadyInThisCategory) {
            customAlert('Этот фильм уже добавлен в данную категорию!');
            const existing = state.movies.find(x => x.tmdbId === item.tmdbId && x.status === chosenCat);
            if (existing) openMovie(existing.id);
            return;
          }

          item.status = chosenCat;
          if (!state.movies.some(x => x.id === item.id)){
            state.movies.push(item);
            await addMovie(item);
          }
          state.detailId = item.id;
          state.previewItem = null;
          render();
        });
      });
    }

    const deleteFromDetail = document.getElementById('deleteFromDetail');
    if (deleteFromDetail){
      deleteFromDetail.addEventListener('click', () => {
        const targetId = state.detailId || (state.previewItem && state.previewItem.id);
        customConfirm('Удалить этот фильм из коллекции?', async () => {
          await deleteMovie(targetId);
          state.movies = state.movies.filter(x => x.id !== targetId);
          goHomeAnimated();
        });
      });
    }

    const detailCatSelect = document.getElementById('detailCatSelect');
    if (detailCatSelect){
      detailCatSelect.addEventListener('change', async e => {
        const activeMovie = state.movies.find(x => x.id === state.detailId);
        if (!activeMovie) return;
        
        const newCat = e.target.value;
        const alreadyInThisCategory = state.movies.some(x => x.tmdbId === activeMovie.tmdbId && x.status === newCat && x.id !== activeMovie.id);
        if (alreadyInThisCategory) {
          customAlert('Этот фильм уже есть в выбранной категории!');
          detailCatSelect.value = activeMovie.status;
          return;
        }

        activeMovie.status = newCat;
        saveMovieDebounced(activeMovie, 100);
      });
    }

    document.querySelectorAll('[data-rate]').forEach(el => el.addEventListener('click', async () => {
      const activeMovie = state.movies.find(x => x.id === state.detailId);
      if (!activeMovie) return;
      
      const r = Number(el.getAttribute('data-rate'));
      activeMovie.myRating = r;
      saveMovieDebounced(activeMovie);
      render();
    }));

    document.querySelectorAll('[data-fullscreen-index]').forEach(el => {
      el.addEventListener('click', () => {
        const activeMovie = state.movies.find(x => x.id === state.detailId) || state.previewItem;
        if (!activeMovie || !activeMovie.screenshots) return;
        
        let currentIndex = parseInt(el.getAttribute('data-fullscreen-index'), 10);
        const screenshots = activeMovie.screenshots;

        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        modal.innerHTML = `
          <div class="fullscreen-close" id="fsClose">${icon('close',20)}</div>
          <div class="fullscreen-counter" id="fsCounter">${currentIndex + 1} / ${screenshots.length}</div>
          <img id="fsImg" src="${escapeHtml(screenshots[currentIndex])}">
        `;
        document.body.appendChild(modal);

        const imgEl = modal.querySelector('#fsImg');
        const counterEl = modal.querySelector('#fsCounter');

        function updateImage(newIndex, animClass) {
          currentIndex = (newIndex + screenshots.length) % screenshots.length;
          counterEl.textContent = (currentIndex + 1) + ' / ' + screenshots.length;
          
          if (animClass) {
            imgEl.style.transform = animClass === 'left' ? 'translateX(-50px)' : 'translateX(50px)';
            imgEl.style.opacity = '0';
            setTimeout(() => {
              imgEl.src = screenshots[currentIndex];
              imgEl.style.transform = animClass === 'left' ? 'translateX(50px)' : 'translateX(-50px)';
              void imgEl.offsetWidth;
              imgEl.style.transform = 'translateX(0)';
              imgEl.style.opacity = '1';
            }, 150);
          } else {
            imgEl.src = screenshots[currentIndex];
          }
        }

        modal.querySelector('#fsClose').addEventListener('click', () => modal.remove());
        modal.addEventListener('click', (e) => { if (e.target === modal) modal.remove(); });
      });
    });
  }

      selectedIcon = b.getAttribute('data-cat-icon');
      overlay.querySelectorAll('#newCatIconGrid [data-cat-icon]').forEach(x=>x.classList.toggle('active', x===b));
    }));

    overlay.querySelector('#saveNewCat').addEventListener('click', async () => {
      const nameInput = overlay.querySelector('#newCatName').value.trim();
      if (!nameInput) {
        customAlert('Введите название категории.');
        return;
      }
      const newV = 'cat_' + Date.now();
      state.categories.push({ v: newV, l: nameInput, icon: selectedIcon, color: selectedColor, sub: '' });
      await STORAGE.saveCategories(state.categories);
      overlay.remove();
      render();
    });
  }

  function openEditCategoryModal(){
    const s = categoryMeta(state.categoryFilter);
    if (!s) return;
    let selectedIcon = s.icon || 'star';
    let selectedColor = s.color || '#ff2b3d';
    const body = '<div class="modal-msg" style="padding-top:2px;padding-bottom:6px;">Название категории</div>'
      + '<input id="editCatName" value="'+escapeHtml(s.l)+'" style="margin-bottom:4px;">'
      + '<div class="modal-msg" style="padding-bottom:2px;">Цвет</div>'
      + '<div style="display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;" id="editCatColorPalette">' + CAT_COLOR_PALETTE.map(col=>'<button type="button" data-cat-col="'+col+'" style="width:32px;height:32px;border-radius:50%;background:'+col+';border:'+(col===selectedColor?'2px solid #fff':'none')+';"></button>').join('') + '</div>'
      + '<div class="modal-msg" style="padding-bottom:2px;">Иконка</div>'
      + '<div class="cat-icon-grid" id="editCatIconGrid">' + CAT_ICON_OPTIONS.map(ic=>'<button type="button" class="cat-icon-opt'+(ic===selectedIcon?' active':'')+'" data-cat-icon="'+ic+'">'+icon(ic,20)+'</button>').join('') + '</div>'
      + '<div style="display:flex;gap:8px;"><button class="danger-btn" id="deleteCat" style="flex:1;">Удалить</button><button class="primary-btn" id="saveEditCat" style="flex:2;margin-top:0;">Сохранить</button></div>';
    
    const overlay = customModal('Редактировать категорию', body);
    
    overlay.querySelectorAll('[data-cat-col]').forEach(b => b.addEventListener('click', () => {
      selectedColor = b.getAttribute('data-cat-col');
      overlay.querySelectorAll('[data-cat-col]').forEach(x => x.style.border = 'none');
      b.style.border = '2px solid #fff';
    }));

    overlay.querySelectorAll('#editCatIconGrid [data-cat-icon]').forEach(b => b.addEventListener('click', () => {
      selectedIcon = b.getAttribute('data-cat-icon');
      overlay.querySelectorAll('#editCatIconGrid [data-cat-icon]').forEach(x=>x.classList.toggle('active', x===b));
    }));

    overlay.querySelector('#saveEditCat').addEventListener('click', async () => {
      const newName = overlay.querySelector('#editCatName').value.trim();
      if (!newName) {
        customAlert('Название категории не может быть пустым.');
        return;
      }
      s.l = newName;
      s.icon = selectedIcon;
      s.color = selectedColor;
      await STORAGE.saveCategories(state.categories);
      overlay.remove();
      render();
    });

    overlay.querySelector('#deleteCat').addEventListener('click', () => {
      customConfirm('Удалить эту категорию? Фильмы из неё останутся в коллекции, но сбросят категорию.', async () => {
        state.categories = state.categories.filter(c => c.v !== s.v);
        await STORAGE.saveCategories(state.categories);
        
        state.movies.forEach(m => {
          if (m.status === s.v) {
            m.status = state.categories.length ? state.categories[0].v : '';
            saveMovieDebounced(m, 10);
          }
        });

        overlay.remove();
        state.view = 'home';
        render();
      });
    });
  }

  loadTelegramSdkThenStart();
})();
</script>
</body>
</html>
