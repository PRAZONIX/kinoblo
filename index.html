  // ===== Hero-баннер: самые популярные прямо сейчас (TMDB trending/all/day), вверху "Поиска" =====
  let heroBannerInterval = null;
  let heroBannerResumeTimer = null;
  // Ссылка на текущую scrollToPos() из initHeroBannerCarousel — нужна снаружи,
  // в bindHeroBannerClicks(), чтобы клик по боковому (не центральному) баннеру
  // мог докрутить трек к нему, а не сразу открывать карточку фильма.
  let heroBannerScrollToPos = null;
  const BANNER_REFRESH_MS = 30 * 60 * 1000; // раз в 30 минут баннер считается устаревшим и подгружается заново

  function mapTmdbBannerItem(r){
    const isTv = r.media_type === 'tv';
    return {
      tmdbId: r.id,
      mediaType: isTv ? 'tv' : 'movie',
      title: (isTv ? (r.name || r.original_name) : (r.title || r.original_title)) || '',
      year: ((isTv ? r.first_air_date : r.release_date) || '').slice(0, 4),
      backdrop: r.backdrop_path ? (TMDB_IMG_PROXY_BASE + '/t/p/w780' + r.backdrop_path) : '',
      poster: r.poster_path ? (TMDB_IMG_PROXY_BASE + '/t/p/w500' + r.poster_path) : '',
      voteAverage: typeof r.vote_average === 'number' ? r.vote_average : null,
      type: isTv ? 'series' : 'movie'
    };
  }

  // Прогревает кэш браузера всеми картинками баннера ещё до того, как карусель
  // вообще отрисуется. Слайдов немного (до 8), поэтому грузим их все сразу одним
  // Image()-объектом на каждую — когда карусель дойдёт до клона первого баннера
  // в конце ленты (замыкание цикла), эта же картинка уже будет в кэше и подставится
  // мгновенно, без пустого кадра.
  function preloadBannerImages(items){
    items.forEach(it => {
      const src = it.backdrop || it.poster;
      if (!src) return;
      const im = new Image();
      im.src = src;
    });
  }

  async function loadBannerItems(force){
    if (bannerLoadingFlag) return;
    if (!force && state.banner.items.length && (Date.now() - state.banner.loadedAt) < BANNER_REFRESH_MS) return;
    bannerLoadingFlag = true;
    try{
      const data = await tmdbFetch('/trending/all/day', state.tmdbKey);
      const items = (data.results || []).filter(r => r.backdrop_path).slice(0, 8).map(mapTmdbBannerItem);
      if (items.length) {
        preloadBannerImages(items);
        state.banner.items = items; state.banner.index = 0;
      }
      state.banner.loadedAt = Date.now();
    }catch(e){
      // не удалось обновить — оставляем то, что уже было (если было)
    }
    bannerLoadingFlag = false;
    if (state.view === 'search') renderSearchBanner();
  }

  function bannerSlideHtml(item){
    const bg = item.backdrop || item.poster || '';
    // Раньше здесь стоял loading="lazy" — картинок в баннере всего до 8 штук, и та,
    // что должна появиться при закольцовывании карусели (клон первого/последнего
    // слайда на противоположном краю трека), из-за ленивой загрузки не всегда
    // успевала подгрузиться к моменту, когда до неё долистывали — карусель на секунду
    // показывала пустоту. Теперь все баннерные картинки грузятся сразу (см. также
    // preloadBannerImages ниже, которая прогревает кэш ещё до первой отрисовки).
    const img = bg ? '<img class="hero-banner-img" src="'+escapeHtml(bg)+'" alt="" draggable="false">' : '';
    const meta = [item.year, typeLabel(item.type)].filter(Boolean).join(' · ');
    return '<div class="hero-banner-slide" data-discover-pick="'+item.tmdbId+'" data-discover-type="'+item.mediaType+'" data-poster-src="'+escapeHtml(item.poster || '')+'">'
      + img
      + '<div class="hero-banner-gradient"></div>'
      + ratingPill(item)
      + '<div class="hero-banner-info">'
      +   '<div class="hero-banner-title">'+escapeHtml(item.title)+'</div>'
      +   (meta ? '<div class="hero-banner-meta">'+escapeHtml(meta)+'</div>' : '')
      + '</div>'
      + '</div>';
  }

  // Для эффекта бесконечной карусели в трек по краям добавляются "клоны" —
  // копия последнего баннера перед первым и копия первого баннера после
  // последнего. Так слева от самого первого баннера всегда виден (при
  // пролистывании назад) тот же фильм, что и в самом конце ленты, а вправо
  // после последнего — снова первый. Сами точки-индикаторы (dots) строятся
  // только по настоящим элементам (без клонов) — см. initHeroBannerCarousel,
  // где клоны отслеживаются и подмена на настоящий слайд происходит незаметно.
  function heroBannerHtml(){
    const items = state.banner.items;
    if (!items.length) return '';
    const n = items.length;
    const slidesForTrack = n > 1 ? [items[n - 1]].concat(items, [items[0]]) : items;
    return '<div class="hero-banner-wrap"><div class="hero-banner-track" id="heroBannerTrack">'
      + slidesForTrack.map(bannerSlideHtml).join('')
      + '</div><div class="hero-banner-dots" id="heroBannerDots">'
      + items.map((_, i) => '<span class="hero-dot'+(i === state.banner.index ? ' active' : '')+'"></span>').join('')
      + '</div></div>';
  }

  function bindHeroBannerClicks(){
    document.querySelectorAll('#heroBannerTrack [data-discover-pick]').forEach(el => {
      el.onclick = () => {
        // На ПК центральный баннер крупный и кликабелен как обычно — открывает
        // карточку фильма. Боковые (затемнённые) баннеры первым кликом просто
        // перетягиваются в центр — как на витринах стриминговых сервисов, где
        // сначала "выбираешь" слайд, а потом открываешь его. На мобильном
        // соседние баннеры не видны, поэтому там класс is-center всегда стоит
        // на единственном видимом слайде и поведение не меняется.
        const track = document.getElementById('heroBannerTrack');
        if (!el.classList.contains('is-center') && track && heroBannerScrollToPos){
          const pos = Array.from(track.children).indexOf(el);
          if (pos >= 0){ heroBannerScrollToPos(pos, true); return; }
        }
        previewTmdb(el.getAttribute('data-discover-pick'), el.getAttribute('data-discover-type'));
      };
    });
  }

  function updateHeroDots(){
    const dots = document.getElementById('heroBannerDots');
    if (!dots) return;
    dots.querySelectorAll('.hero-dot').forEach((d, i) => d.classList.toggle('active', i === state.banner.index));
  }

  // Точечно вставляет/обновляет баннер поверх уже отрисованного экрана поиска —
  // без полной перерисовки, чтобы не сбивать прокрутку и не перезапускать ряды подборок.
  function renderSearchBanner(){
    const bg = document.getElementById('searchBgContent');
    if (!bg) return;
    const existingWrap = bg.querySelector('.hero-banner-wrap');
    const html = heroBannerHtml();
    if (existingWrap){
      if (!html) existingWrap.remove();
      else existingWrap.outerHTML = html;
    } else if (html) {
      const topbarEl = bg.querySelector('.topbar');
      if (topbarEl) topbarEl.insertAdjacentHTML('afterend', html);
      else bg.insertAdjacentHTML('afterbegin', html);
    }
    bindHeroBannerClicks();
    initHeroBannerCarousel();
  }

  function initHeroBannerCarousel(){
    const track = document.getElementById('heroBannerTrack');
    if (heroBannerInterval){ clearInterval(heroBannerInterval); heroBannerInterval = null; }
    const n = state.banner.items.length;
    if (!track) return;
    if (n < 2){
      // Один-единственный баннер — карусели тут нечего листать, но класс
      // .is-center всё равно нужно проставить, иначе heroBannerSlideNeedsCenter()
      // будет считать его "боковым" и клик по нему вместо открытия фильма
      // будет пытаться докрутить баннер к самому себе.
      if (track.children[0]) track.children[0].classList.add('is-center');
      return;
    }

    // Трек содержит клоны по краям (см. heroBannerHtml): позиция 0 — клон
    // последнего баннера, позиции 1..n — настоящие баннеры, позиция n+1 —
    // клон первого. realToPos/posToReal переводят между "настоящим" индексом
    // (используется для точек-индикаторов) и позицией в треке (с учётом сдвига
    // на клон в начале).
    const realToPos = i => i + 1;
    const posToReal = p => (p === 0 ? n - 1 : (p === n + 1 ? 0 : p - 1));

    // Раньше позиция слайда считалась как i * track.clientWidth — это работало,
    // только пока слайд занимал 100% ширины трека. Теперь на ПК слайд уже трека
    // (видны соседи по бокам), поэтому берём реальные размеры/отступы конкретного
    // элемента слайда — так формула остаётся верной что на телефоне (слайд ~100%),
    // что на ПК (слайд ~70vw с соседями по бокам).
    const scrollToPos = (p, smooth) => {
      const slideEl = track.children[p];
      if (!slideEl) return;
      const target = slideEl.offsetLeft - (track.clientWidth - slideEl.offsetWidth) / 2;
      track.scrollTo({ left: target, behavior: smooth === false ? 'auto' : 'smooth' });
    };
    // Разрешаем клику по боковому баннеру (см. bindHeroBannerClicks) дёргать
    // именно эту scrollToPos — трек и позиции меняются при каждой перерисовке
    // баннера, поэтому ссылку обновляем при каждой инициализации карусели.
    heroBannerScrollToPos = scrollToPos;

    // Помечает слайд в позиции p как центральный (снимает затемнение через
    // CSS-класс .is-center) и снимает пометку со всех остальных.
    const applyCenterClass = (p) => {
      Array.from(track.children).forEach((el, i) => el.classList.toggle('is-center', i === p));
    };

    let curPos = realToPos(state.banner.index);
    scrollToPos(curPos, false);
    applyCenterClass(curPos);

    const startAuto = () => {
      if (heroBannerInterval) clearInterval(heroBannerInterval);
      heroBannerInterval = setInterval(() => {
        curPos += 1;
        scrollToPos(curPos, true);
      }, 4500);
    };
    startAuto();

    let scrollSettleTimer = null;
    track.addEventListener('scroll', () => {
      if (scrollSettleTimer) clearTimeout(scrollSettleTimer);
      scrollSettleTimer = setTimeout(() => {
        // Определяем ближайший к центру трека слайд по фактическому положению
        // элементов, а не по формуле "scrollLeft / ширина трека" — та же причина,
        // что и в scrollToPos выше.
        const centerX = track.scrollLeft + track.clientWidth / 2;
        let closestP = 0, closestDist = Infinity;
        Array.from(track.children).forEach((el, i) => {
          const elCenter = el.offsetLeft + el.offsetWidth / 2;
          const dist = Math.abs(elCenter - centerX);
          if (dist < closestDist){ closestDist = dist; closestP = i; }
        });
        curPos = closestP;
        state.banner.index = posToReal(closestP);
        updateHeroDots();
        applyCenterClass(closestP);
        // Долистали до клона на краю трека — мгновенно (без анимации) переносим
        // скролл на настоящий слайд с той же картинкой. Визуально это незаметно
        // (клон и оригинал выглядят одинаково), зато дальше можно листать в ту
        // же сторону бесконечно — эффект настоящей закольцованной карусели.
        if (closestP === 0){
          curPos = n;
          scrollToPos(curPos, false);
          applyCenterClass(curPos);
        } else if (closestP === n + 1){
          curPos = 1;
          scrollToPos(curPos, false);
          applyCenterClass(curPos);
        }
      }, 120);
    }, { passive: true });

    // Ручное перелистывание пользователем — на время останавливаем автопрокрутку,
    // затем возобновляем её через паузу, чтобы не мешать друг другу. На ПК роль
    // "начала жеста" играет ещё и mousedown (перетаскивание мышью), не только
    // touchstart на телефоне.
    const pauseAuto = () => {
      if (heroBannerInterval){ clearInterval(heroBannerInterval); heroBannerInterval = null; }
      if (heroBannerResumeTimer) clearTimeout(heroBannerResumeTimer);
      heroBannerResumeTimer = setTimeout(startAuto, 6000);
    };
    track.addEventListener('touchstart', pauseAuto, { passive: true });
    track.addEventListener('mousedown', pauseAuto);
  }

  // ===== Проверка подборок "Поиска" на новинки (сверка live-данных TMDB с уже загрученным кэшем) =====
  const DISCOVER_UPDATE_CHECK_MS = 10 * 60 * 1000; // раз в 10 минут, пока экран "Поиск" открыт
  const DISCOVER_STALE_MS = 15 * 60 * 1000; // если кэш подборки старше этого — проверяем сразу при входе

  async function checkDiscoverCategoryForUpdates(cat){
    if (!state.discover.cache[cat.key] || state.discover.checkingUpdate[cat.key]) return;
    state.discover.checkingUpdate[cat.key] = true;
    try{
      const fresh = await fetchDiscoverCategoryItems(cat);
      state.discover.cache[cat.key] = await applyNewBadges(cat.key, fresh);
      renderDiscoverCategoryRow(cat.key);
    }catch(e){
      // тихо игнорируем — попробуем на следующей проверке
    }
    state.discover.checkingUpdate[cat.key] = false;
    state.discover.cacheTime[cat.key] = Date.now();
  }

  let discoverUpdateInterval = null;
  function initDiscoverAutoUpdate(){
    if (discoverUpdateInterval) clearInterval(discoverUpdateInterval);
    discoverUpdateInterval = setInterval(() => {
      if (state.view !== 'search') return;
      DISCOVER_CATEGORIES.forEach(cat => {
        if (state.discover.cache[cat.key]) checkDiscoverCategoryForUpdates(cat);
      });
      if ((Date.now() - state.banner.loadedAt) > BANNER_REFRESH_MS) loadBannerItems();
    }, DISCOVER_UPDATE_CHECK_MS);
  }

  // Карточка широкого кадра (backdrop) в шапке детальной страницы на ПК —
  // помимо самой картинки внутри неё дублируются название фильма (снизу,
  // поверх градиента) и рейтинг IMDb (в правом верхнем углу карточки).
  // Используется и при первом рендере viewDetail(), и когда backdrop
  // подтягивается позже — вместе со скриншотами (см. renderScreenshotsSection).
  // На мобильном сам .detail-hero-wide скрыт целиком (display:none по
  // умолчанию в CSS), поэтому дублирование здесь не задваивает контент на
  // телефоне — там остаются только оригинальные .detail-title/IMDb-плашка.
  function heroWideCardHtml(m, heroWideSrc){
    if (!heroWideSrc) return '';
    const ratingHtml = (m.voteAverage != null)
      ? '<div class="detail-hero-wide-rating">'+icon('star', 14)+'<span>'+m.voteAverage.toFixed(1)+'</span></div>'
      : '';
    // Кнопка "заметка" — на ПК она живёт прямо на постере, в правом нижнем
    // углу (см. .detail-hero-wide-note), тем же приёмом, что и плашка
    // IMDb-рейтинга выше. Обработчик клика навешивается по классу .note-fab
    // (см. bindEvents), поэтому отдельный id здесь не нужен.
    const hasNoteWide = !!(m.myNote && m.myNote.trim());
    const noteWideHtml = '<button class="icon-btn glass-flat note-fab detail-hero-wide-note'+(hasNoteWide?' has-note':'')+'" title="Заметка">'
      + icon('pencil', 17)
      + '<span class="note-fab-label">заметка</span>'
      + '</button>';
    // Год, тип и (для сериалов) число сезонов — та же логика, что и в
    // detailMetaRow/renderDetailMetaRow ниже, но без жанров: на широкой
    // карточке под названием нужна короткая строка, а не полный список жанров.
    const wideYearStr = m.year ? m.year : '';
    const wideTypeStr = typeLabel(m.type) || (m.mediaType === 'tv' ? 'Сериал' : 'Фильм');
    const wideSeasonsStr = m.mediaType === 'tv' ? seasonsLabel(m.numberOfSeasons) : '';
    const wideMeta = [wideYearStr, wideTypeStr, wideSeasonsStr].filter(Boolean).join(' · ');
    return '<div class="detail-hero-wide" id="detailHeroWide">'
      + '<img src="'+escapeHtml(heroWideSrc)+'" alt="" draggable="false">'
      + '<div class="detail-hero-wide-gradient"></div>'
      + ratingHtml
      + noteWideHtml
      + '<div class="detail-hero-wide-info">'
      +   '<div class="detail-hero-wide-title">'+escapeHtml(m.title)+'</div>'
      +   (wideMeta ? '<div class="detail-hero-wide-meta">'+escapeHtml(wideMeta)+'</div>' : '')
      + '</div>'
      + '</div>';
  }

  function viewDetail(){
    const m = state.movies.find(x=>x.id===state.detailId) || state.previewItem;
    if (!m) { state.view='home'; return viewHome(); }
    const heroImg = m.poster ? '<img class="detail-hero-poster-bg" src="'+escapeHtml(m.poster)+'" draggable="false" onerror="this.style.display=\'none\';">' : '';
    // Широкий кадр фильма (backdrop) поверх заблюренного постера — показывается
    // только на ПК (см. .detail-hero-wide в CSS), на телефоне остаётся как было.
    // Если backdrop ещё не подтянут (старые сохранённые фильмы без этого поля),
    // используем первый уже загруженный скриншот — а после подгрузки скриншотов
    // блок довставится через renderScreenshotsSection().
    const heroWideSrc = m.backdrop || (m.screenshots && m.screenshots[0]) || '';
    const heroWideImg = heroWideCardHtml(m, heroWideSrc);
    const isSaved = state.movies.some(x => x.id === m.id);

    const starsHtml = [];
    for (let i = 1; i <= 10; i++) {
      const isFilled = isSaved && m.myRating != null && m.myRating >= i;
      const isSelectedExact = isSaved && m.myRating === i;
      const starCls = 'rate-star-btn' + (isFilled ? ' filled' : '') + (isSelectedExact ? ' selected-star' : '');
      starsHtml.push('<button class="'+starCls+'" '+(!isSaved?'disabled style="opacity:0.4;cursor:not-allowed;"':'')+' data-rate="'+i+'" title="Оценка '+i+'">'+icon('star', 20)+'</button>');
    }
    
    const genreStr = genresOf(m).join('  ');
    const yearStr = m.year ? m.year : '';
    const typeStr = typeLabel(m.type) || (m.mediaType === 'tv' ? 'Сериал' : 'Фильм');
    const seasonsStr = m.mediaType === 'tv' ? seasonsLabel(m.numberOfSeasons) : '';

    let descriptionHtml = '';
    if (m.description) {
      const words = m.description.trim().split(/\s+/);
      // На ПК описание заметно шире (см. .detail-overview в CSS: 600px вместо
      // 400px на мобильном), поэтому в него без переполнения влезает заметно
      // больше слов, прежде чем понадобится нажимать "ещё".
      const overviewWordLimit = window.innerWidth >= 900 ? 42 : 25;
      if (words.length > overviewWordLimit) {
        const shortText = words.slice(0, overviewWordLimit).join(' ');
        const restText = words.slice(overviewWordLimit).join(' ');
        descriptionHtml = '<div class="detail-overview'+(isOverviewExpanded ? ' expanded' : '')+'" id="detailOverview">'
          + '<span class="overview-text-inner">' + escapeHtml(shortText) + '<span class="overview-ellipsis">…</span></span>'
          + '<span class="overview-extra'+(isOverviewExpanded ? ' overview-extra-mounted' : '')+'" id="overviewExtra">' + escapeHtml(restText) + '</span>'
          + '<button class="read-more-btn" id="toggleOverviewBtn">' + (isOverviewExpanded ? 'свернуть' : 'еще') + '</button>'
          + '</div>';
      } else {
        descriptionHtml = '<div class="detail-overview"><span class="overview-text-inner">' + escapeHtml(m.description) + '</span></div>';
      }
    }

    let categorySelectHtml = '';
    if (isSaved) {
      categorySelectHtml = '<div class="search-action-bar">'
        + '<div class="detail-cat-chips">'
        + state.categories.map(c => {
            const on = movieInCat(m, c.v);
            return '<button type="button" class="discover-filter-btn'+(on?' active':'')+'" data-detail-cat-toggle="'+c.v+'" style="'+(on?('color:'+ (c.color||'#fff')+';'):'')+'">'
              + '<span class="detail-cat-dot" style="color:'+(c.color||'var(--accent)')+';"></span>'
              + escapeHtml(c.l) + '</button>';
          }).join('')
        + '</div>'
        + '</div>';
    }

    const ratingBoxHtml = isSaved ? `
      <div class="my-rating-box">
        <div class="my-rating-top">
          <div class="my-rating-label">Оценка</div>
          <div class="my-rating-val-mini">${m.myRating != null ? m.myRating + ' / 10' : 'Не выбрана'}</div>
        </div>
        <div class="rate-stars-row">${starsHtml.join('')}</div>
      </div>
    ` : '';

    const imdbInfoBar = (m.voteAverage != null) ? `
      <div class="my-rating-box imdb-rating-box" style="display:flex; align-items:center; justify-content:space-between; background:rgba(245,197,24,0.05); border-color:rgba(245,197,24,0.2);">
        <div style="display:flex; align-items:center; gap:8px;">
          <span style="color:#f5c518; display:flex;">${icon('star', 20)}</span>
          <span style="font-size:13px; font-weight:700; color:var(--ink);">IMDb Рейтинг</span>
        </div>
        <span style="font-size:15px; font-weight:800; color:#f5c518;">${m.voteAverage.toFixed(1)} / 10</span>
      </div>
    ` : '';

    let screenshotsHtml = screenshotsInnerHtml(m);

    const similarKey = similarCacheKey(m);
    const similarStillLoading = !!(similarKey && !state.similarCache[similarKey]);
    let similarList = getDisplaySimilarList(m);
    let similarSectionHtml = '';
    if (similarList.length > 0 || similarStillLoading) {
      similarSectionHtml = `
        <div class="section" style="margin-top: 20px; text-align: left; width: 100%;">
          <div class="section-title" style="padding: 0 16px; margin-bottom: 12px; font-size: 20px;">Так же посмотрите</div>
          <div class="row-scroll" id="similarSectionBody">${similarList.length ? similarList.map(card).join('') : '<div class="empty glass-flat" style="margin:0 16px;">Загрузка…</div>'}</div>
        </div>
      `;

    const hasNote = !!(m.myNote && m.myNote.trim());
    const noteBtnHtml = '<button class="icon-btn glass-flat note-fab'+(hasNote?' has-note':'')+'" id="noteBtn" title="Заметка">'
      + icon('pencil', 17)
      + '<span class="note-fab-label">заметка</span>'
      + '</button>';
    const noteDisplayHtml = (isSaved && hasNote) ? '<div class="desc-card glass-flat" style="margin-top:'+(m.description?'-6px':'0')+';"><div class="my-rating-label" style="margin-bottom:8px;">Моя заметка</div><div class="desc">'+escapeHtml(m.myNote)+'</div></div>' : '';

    return ''
    + '<div class="detail-page" id="detailPage">'
    +   '<div class="detail-hero-bg">'+heroImg+heroWideImg+'<div class="detail-hero-gradient"></div></div>'
    +   '<div class="detail-top-controls"><button class="icon-btn glass-flat" id="backBtn">'+icon('back',18)+'</button>'+noteBtnHtml+'</div>'
    +   '<div class="detail-content">'
    +     '<div class="detail-title">'+escapeHtml(m.title)+'</div>'
    +     descriptionHtml
    +     noteDisplayHtml
    +     '<div class="detail-meta-row" id="detailMetaRow">'
    +       (genreStr ? '<span class="meta-genre">'+escapeHtml(genreStr)+'</span>' : '')
    +       (yearStr ? '<span class="meta-year">'+escapeHtml(yearStr)+'</span>' : '')
    +       (typeStr ? '<span class="meta-type">'+escapeHtml(typeStr)+'</span>' : '')

    +   '</div>'

    + '</div>';
  }

  // Полоска-перфорация в шапке анимируется бесконечным CSS-циклом (filmPerfScroll),
  // но сама .topbar пересоздаётся заново при каждом render() (Главная <-> Поиск и т.д.),
  // из-за чего анимация каждый раз рестартовала с нуля и было видно «дёрганье». Здесь
  // высчитываем, на какой фазе цикла анимация должна быть прямо сейчас (по реальному
  // времени с момента загрузки страницы), и через CSS-переменную сдвигаем каждую новую
  // .topbar на эту фазу — визуально движение остаётся непрерывным, будто элемент вообще
  // не пересоздавался. Длительность здесь ДОЛЖНА совпадать с длительностью в CSS (2.6s).
  const FILMPERF_ANIM_DURATION = 2.6;
  function syncTopbarFilmAnim(){
    const offset = (performance.now() / 1000) % FILMPERF_ANIM_DURATION;
    document.querySelectorAll('.topbar').forEach(el => {
      el.style.setProperty('--filmperf-offset', offset + 's');
    });
  }

  // Отслеживаем реальную смену раздела между вызовами render() (а не просто
  // локальную переменную prevView ниже — та выставляется уже ПОСЛЕ смены
  // state.view вызывающим кодом и потому бесполезна для сравнения). Как только
  // раздел действительно поменялся — самое время отправить на сервер накопленные
  // с прошлого раза изменения аккаунта (см. flushAccountSyncNow/scheduleAccountSync).
  let _lastRenderedView = null;
  function render(){
    const app = document.getElementById('app');
    if (!state.loaded){ app.innerHTML = '<div style="text-align:center;color:var(--ink-faint);padding-top:80px;font-size:13px;">Загружаю KINOBLO…</div>'; return; }
    if (_lastRenderedView !== null && _lastRenderedView !== state.view) flushAccountSyncNow();
    _lastRenderedView = state.view;
    // Запоминаем прокрутку и экран ДО перерисовки. Раньше любое точечное действие
    // (оценка, избранное, заметка и т.п.) вызывало полный render(), после которого
    // страница дёргалась в самый верх — визуально это выглядело точь-в-точь как
    // "обновление страницы". Никакой настоящей перезагрузки в приложении нет (это
    // не сайт, а SPA без единого location.reload/href), просто внутренний рендер не
    // сохранял позицию. Если экран не поменялся — возвращаем прокрутку туда, где
    // она была, и никакого "прыжка" не происходит.
    const prevScrollTop = app.scrollTop;
    const prevView = state.view;
    let html = '';
    if (state.view === 'home') html = viewHome();
    else if (state.view === 'search') html = viewSearch();
    else if (state.view === 'choose') html = viewChoose();
    else if (state.view === 'detail') html = viewDetail();
    else if (state.view === 'category') html = viewCategory();
    else if (state.view === 'discoverList') html = viewDiscoverList();
    else if (state.view === 'account') html = viewAccount();
    const showBottomSearch = state.view === 'search';
    if (showBottomSearch) html += searchBarBottomHtml();
    const hideNav = state.view === 'choose' || state.view === 'detail';
    if (!hideNav) html += viewNav();
    app.innerHTML = html;
    syncTopbarFilmAnim();
    app.classList.toggle('no-select', state.view === 'home' || state.view === 'search');
    app.classList.toggle('detail-scroll', state.view === 'detail');
    bindEvents();
    if (showBottomSearch && !(state.tmdbQuery && state.tmdbQuery.trim())){
      DISCOVER_CATEGORIES.forEach(cat => {
        if (!state.discover.cache[cat.key]) loadDiscoverCategory(cat);
        else if (!state.discover.cacheTime[cat.key] || (Date.now() - state.discover.cacheTime[cat.key]) > DISCOVER_STALE_MS) checkDiscoverCategoryForUpdates(cat);
      });
      if (!state.banner.items.length) loadBannerItems();
      else { initHeroBannerCarousel(); bindHeroBannerClicks(); }
    }

    if (state.view === 'detail'){
      const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
      if (m) { loadSimilarForDetail(m); loadSeasonInfoForDetail(m); loadTrailerForDetail(m); loadScreenshotsForDetail(m); mountTrailerPlayer(m); bindTrailerFallbackEvents(); }
    }
    
    if (state.view === prevView){
      // Тот же самый экран, что и до перерисовки — точечное действие, а не переход.
      // Возвращаем прокрутку туда, где пользователь был, вместо "прыжка" наверх.
      if (prevScrollTop > 0) app.scrollTop = prevScrollTop;
    } else if (state.view === 'search' || state.view === 'discoverList' || state.view === 'home') {
      const pos = state.scrollPositions[state.view] || 0;
      if (pos > 0) {
        setTimeout(() => app.scrollTop = pos, 10);
      }
    }
    syncSearchBlur();
  }

  function focusSearchInput(){
    const el = document.getElementById('tmdbQueryBottom');
    if (!el) return;
    try{ el.focus({preventScroll:true}); }catch(e){ el.focus(); }
  }

  async function openMovie(id){ 
    isOverviewExpanded = false; 
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    state.detailId = id; 
    state.previewItem = null; 
    
    state.tmdbQuery = '';
    state.tmdbResults = null;

    state.view = 'detail'; 
    render(); 
    document.getElementById('app').scrollTop = 0; 
  }

  async function previewTmdb(tmdbId, mediaType){
    isOverviewExpanded = false;
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    
    state.tmdbQuery = '';
    state.tmdbResults = null;

    try{
      const data = await tmdbFetch('/' + mediaType + '/' + tmdbId, state.tmdbKey);
      const mapped = mapTmdbItem(data, mediaType);
      const existing = state.movies.find(x => x.tmdbId === mapped.tmdbId);
      if (existing){
        state.detailId = existing.id;
        state.previewItem = null;
      } else {
        const backdrops = await tmdbImages(tmdbId, mediaType, state.tmdbKey);
        mapped.screenshots = backdrops.slice(0, 6);
        state.detailId = null;
        state.previewItem = mapped;
      }
      state.view = 'detail';
      render();
      document.getElementById('app').scrollTop = 0;
    }catch(e){
      customAlert('Не удалось загрузить информацию о фильме.');
    }
  }

  function customAlert(msg){
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal" style="text-align:center;padding:24px;"><div class="modal-title">Внимание</div><div class="modal-msg">'+escapeHtml(msg)+'</div><button class="primary-btn" id="alertOk" style="width:100%;margin-top:12px;">Ок</button></div>';
    document.body.appendChild(div);
    div.querySelector('#alertOk').onclick = () => div.remove();
  }

  // Модалка добавления/редактирования личной заметки к фильму — открывается по кнопке
  // с иконкой пера на странице фильма. Заметка хранится в поле movie.myNote и выводится
  // под описанием фильма на странице деталей, а также помечается мини-иконкой пера
  // на постере фильма на главных экранах, если заметка непустая.
  function openNoteEditor(movie){
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    const existing = movie.myNote || '';
    div.innerHTML = `
      <div class="modal">
        <div class="modal-title">Моя заметка</div>
        <div class="modal-msg" style="padding-top:0;">Личное мнение о фильме — будет видно только тебе под описанием.</div>
        <div style="margin-top:6px;" class="field">
          <textarea id="noteTextarea" placeholder="Что думаешь об этом фильме?" style="min-height:140px;">${escapeHtml(existing)}</textarea>
        </div>
        <div class="modal-actions" style="margin-top:16px;display:flex;gap:8px;">
          <button type="button" class="secondary-btn glass-flat" id="noteCancel">Отмена</button>
          <button type="button" class="primary-btn" id="noteSave" style="margin-top:0;">Сохранить</button>
        </div>
        ${existing ? '<button type="button" class="danger-btn" id="noteDelete" style="margin-top:10px;width:100%;">Удалить заметку</button>' : ''}
      </div>
    `;
    document.body.appendChild(div);

    const ta = div.querySelector('#noteTextarea');
    if (ta) { ta.focus(); ta.selectionStart = ta.selectionEnd = ta.value.length; }

    const close = () => div.remove();

    div.querySelector('#noteCancel').onclick = close;
    div.addEventListener('click', e => { if (e.target === div) close(); });

    div.querySelector('#noteSave').onclick = async () => {
      const val = (ta ? ta.value : '').trim();
      movie.myNote = val ? val : null;
      close();
      render();
      await updateMovie(movie);
    };

    const delBtn = div.querySelector('#noteDelete');
    if (delBtn){
      delBtn.onclick = async () => {
        movie.myNote = null;
        close();
        render();
        await updateMovie(movie);
      };
    }
  }

  // ===== Экспорт / импорт библиотеки (перенос фильмов между устройствами через буфер обмена) =====

  const EXPORT_PREFIX = 'KINOBLO1:';

  function buildExportPayload(){
    return {
      v: 1,
      exportedAt: Date.now(),
      categories: state.categories.map(c => {
        const o = { v:c.v, l:c.l, sub:c.sub||'', icon:c.icon, color:c.color };
        // Совместные категории обязательно несут флаг shared и код shared/<code> —
        // без них на другом устройстве категория при синке аккаунта превращалась
        // в обычную (несовместную) с тем же названием.
        if (c.shared){ o.shared = true; o.code = c.code; }
        return o;
      }),
      movies: state.movies.map(m => Object.assign({}, m))
    };
  }

  function encodeExportPayload(payload){
    const json = JSON.stringify(payload);
    const b64 = btoa(unescape(encodeURIComponent(json)));
    return EXPORT_PREFIX + b64;
  }

  function decodeExportPayload(str){
    let s = (str || '').trim();
    const idx = s.indexOf(EXPORT_PREFIX);
    if (idx === -1) throw new Error('no-prefix');
    s = s.slice(idx + EXPORT_PREFIX.length);
    s = s.replace(/\s+/g, ''); // на случай переносов строк при вставке на телефоне
    const json = decodeURIComponent(escape(atob(s)));
    const payload = JSON.parse(json);
    if (!payload || !Array.isArray(payload.movies) || !Array.isArray(payload.categories)) {
      throw new Error('bad-shape');
    }
    return payload;
  }

  // ===== Аккаунты (ник + 4-значный пинкод) =====
  // Аккаунт хранится в том же общем Firebase-бэкенде, что и совместные категории:
  // accounts/<ключ_ника> = { nick, pin, updatedAt, data:{ categories, movies } }.
  // Локально запоминаем только ник и пин текущего вошедшего пользователя (через
  // STORAGE.setSetting), чтобы при следующем открытии приложения не разлогинивало.
  // Любое локальное изменение фильмов/категорий (уже проходящее через STORAGE)
  // автоматически (с debounce) отправляется в аккаунт, если пользователь вошёл.
  const ACCOUNT_NICK_KEY = 'account_nick';
  const ACCOUNT_PIN_KEY = 'account_pin';

  function normalizeNickKey(nick){
    return String(nick || '').trim().toLowerCase().replace(/[.#$\[\]\/\s]+/g, '_');
  }

  let _applyingRemoteAccountData = false;
  // Момент (Date.now()), до которого нужно игнорировать входящие SSE-события live-синка.
  // Без этого свой же пуш данных на сервер (см. ниже) прилетает обратно через тот же
  // EventSource как "изменение" — и приложение начинает полностью перезагружать и
  // перерисовывать библиотеку прямо в момент, когда пользователь ещё листает оценку
  // фильма или переключает категории (то самое "дёрганье" интерфейса).
  let _ownPushSuppressUntil = 0;
  // Раньше любое локальное изменение (оценка, категория, заметка и т.п.) запускало
  // отправку на сервер уже через 1.2 сек — и почти сразу после этого прилетало
  // обратно через SSE-подписку, вызывая лишнюю перерисовку прямо во время
  // взаимодействия. Теперь изменение только помечает данные как "несинхронизированные"
  // (_accountDirty), а сама отправка на сервер происходит позже, одним куском —
  // когда пользователь уходит с текущего раздела приложения или сворачивает/закрывает
  // вкладку (см. flushAccountSyncNow и её вызовы в render()/visibilitychange/pagehide).
  let _accountDirty = false;
  // Раньше синк на сервер срывался с места при каждой смене вкладки/раздела —
  // на практике это тоже "почти после каждого действия" (открыл фильм → вернулся
  // назад → уже улетел запрос). Теперь между двумя отправками должно пройти не
  // меньше ACCOUNT_SYNC_MIN_INTERVAL — а чтобы изменения всё равно не терялись,
  // если человек долго сидит на одном экране, раз в тот же интервал само собой
  // проверяем: если данные помечены как "грязные", досылаем их по таймеру.
  const ACCOUNT_SYNC_MIN_INTERVAL = 45000; // не чаще раза в 45 секунд
  let _lastSyncFlushAt = 0;
  function scheduleAccountSync(){
    if (_applyingRemoteAccountData) return; // это мы сами только что применили чужие изменения — не гоняем их обратно
    if (!state || !state.account || !state.account.nick) return;
    _accountDirty = true;
  }

  async function flushAccountSyncNow(useKeepalive, force){
    if (!_accountDirty) return;
    if (!state || !state.account || !state.account.nick) return;
    // force=true — используется, когда приложение сворачивают/закрывают: там
    // ждать нельзя, копим данные не успеем. В остальных случаях (смена вкладки
    // и т.п.) уважаем минимальный интервал между отправками.
    if (!force && Date.now() - _lastSyncFlushAt < ACCOUNT_SYNC_MIN_INTERVAL) return;
    const key = normalizeNickKey(state.account.nick);
    if (!key) return;
    _accountDirty = false;
    _lastSyncFlushAt = Date.now();
    const payload = buildExportPayload();
    const opts = useKeepalive ? { keepalive:true } : undefined;
    await fbSet('accounts/' + key + '/data', { categories: payload.categories, movies: payload.movies }, opts);
    await fbSet('accounts/' + key + '/updatedAt', Date.now(), opts);
    // Даём запас времени на то, чтобы SSE-эхо этого же пуша долетело и было отфильтровано
    // (задержка события у Firebase + 400мс дебаунс в onEvent ниже).
    _ownPushSuppressUntil = Date.now() + 2500;
  }

  // Подстраховка: пока приложение открыто и не сворачивается (человек долго сидит
  // на одном экране, копит изменения), раз в ACCOUNT_SYNC_MIN_INTERVAL проверяем
  // накопленную "грязь" и отправляем — чтобы данные не залёживались локально
  // дольше интервала синка, даже без переключения вкладок.
  setInterval(() => { flushAccountSyncNow(); }, ACCOUNT_SYNC_MIN_INTERVAL);

  async function registerAccount(nick, pin){
    const cleanNick = String(nick || '').trim();
    const key = normalizeNickKey(cleanNick);
    if (!key || key.length < 2) return { ok:false, msg:'Ник должен быть не короче 2 символов.' };
    if (!/^[0-9]{4}$/.test(pin)) return { ok:false, msg:'Пинкод — это ровно 4 цифры.' };
    if (!sharedBackendReady()) return { ok:false, msg:'Аккаунты сейчас недоступны — нет соединения с сервером.' };
    const existing = await fbGet('accounts/' + key);
    if (existing) return { ok:false, msg:'Такой ник уже занят. Выбери другой.' };
    const payload = buildExportPayload();
    const ok = await fbSet('accounts/' + key, {
      nick: cleanNick, pin: pin, updatedAt: Date.now(),
      data: { categories: payload.categories, movies: payload.movies }
    });
    if (!ok) return { ok:false, msg:'Не удалось создать аккаунт. Проверь соединение и попробуй ещё раз.' };
    await STORAGE.setSetting(ACCOUNT_NICK_KEY, cleanNick);
    await STORAGE.setSetting(ACCOUNT_PIN_KEY, pin);
    state.account = { nick: cleanNick };
    startAccountLiveSync();
    return { ok:true };
  }

  async function loginAccount(nick, pin){
    const cleanNick = String(nick || '').trim();
    const key = normalizeNickKey(cleanNick);
    if (!key) return { ok:false, msg:'Введи ник.' };
    if (!/^[0-9]{4}$/.test(pin)) return { ok:false, msg:'Пинкод — это ровно 4 цифры.' };
    if (!sharedBackendReady()) return { ok:false, msg:'Аккаунты сейчас недоступны — нет соединения с сервером.' };
    const acc = await fbGet('accounts/' + key);
    if (!acc) return { ok:false, msg:'Аккаунт не найден. Проверь ник или соединение с интернетом.' };
    if (String(acc.pin) !== String(pin)) return { ok:false, msg:'Неверный пинкод.' };

    // Сбрасываем текущий аккаунт ДО перезаписи локальных данных, чтобы очистка
    // старой библиотеки ниже не улетела синком поверх данных предыдущего аккаунта.
    state.account = { nick:null };

    const remoteMovies = (acc.data && Array.isArray(acc.data.movies)) ? acc.data.movies : [];
    const remoteCats = (acc.data && Array.isArray(acc.data.categories) && acc.data.categories.length) ? acc.data.categories : DEFAULT_CATEGORIES.slice();

    const oldIds = await STORAGE.getMovieIds();
    for (const id of oldIds){ await rawRemove(movieKey(id)); }
    await STORAGE.saveMovieIds([]);
    for (const m of remoteMovies){
      const copy = Object.assign({}, m);
      normalizeMovieCats(copy);
      await STORAGE.saveMovie(copy);
    }
    await STORAGE.saveCategories(remoteCats);

    state.movies = await STORAGE.loadAllMovies();
    state.categories = remoteCats;

    await STORAGE.setSetting(ACCOUNT_NICK_KEY, acc.nick || cleanNick);
    await STORAGE.setSetting(ACCOUNT_PIN_KEY, pin);
    state.account = { nick: acc.nick || cleanNick };
    startAccountLiveSync();
    return { ok:true };
  }

  async function logoutAccount(){
    stopAccountLiveSync();
    await STORAGE.setSetting(ACCOUNT_NICK_KEY, '');
    await STORAGE.setSetting(ACCOUNT_PIN_KEY, '');
    state.account = { nick:null };
  }

  // Подтягивает свежие данные аккаунта с сервера на это устройство (например, если
  // фильмы/оценки добавляли с другого телефона под тем же аккаунтом).
  async function refreshAccountFromServer(){
    if (!state.account || !state.account.nick) return { ok:false, msg:'Ты не вошёл в аккаунт.' };
    const pin = await STORAGE.getSetting(ACCOUNT_PIN_KEY);
    if (!pin) return { ok:false, msg:'Не удалось подтвердить аккаунт локально. Войди заново.' };
    return loginAccount(state.account.nick, pin);
  }

  async function initAccountFromLocal(){
    const nick = await STORAGE.getSetting(ACCOUNT_NICK_KEY);
    state.account = { nick: nick || null };
    if (nick) startAccountLiveSync();
  }

  // ===== Живая синхронизация между устройствами (Server-Sent Events поверх Firebase REST) =====
  // Firebase Realtime Database отдаёт поток изменений прямо по обычному GET-запросу
  // с заголовком Accept: text/event-stream — а именно так и работает нативный EventSource
  // в браузере, без каких-либо доп. SDK. Подписываемся на узел accounts/<ник>/data:
  // как только с ДРУГОГО устройства (того же аккаунта) что-то поменяется — фильм, категория,
  // оценка, заметка — сюда прилетит событие, и мы подтянем свежие данные и перерисуем экран.
  let _accountEventSource = null;
  let _remoteApplyTimer = null;

  function startAccountLiveSync(){
    stopAccountLiveSync();
    if (!state.account || !state.account.nick || !sharedBackendReady()) return;
    const key = normalizeNickKey(state.account.nick);
    if (!key) return;
    try{
      const es = new EventSource(fbUrl('accounts/' + key + '/data'));
      const onEvent = () => {
        if (_remoteApplyTimer) clearTimeout(_remoteApplyTimer);
        _remoteApplyTimer = setTimeout(() => {
          // Если это эхо нашего же недавнего пуша — просто перепланируем проверку
          // на конец окна подавления, ничего не перерисовывая раньше времени.
          if (Date.now() < _ownPushSuppressUntil){
            _remoteApplyTimer = setTimeout(() => applyRemoteAccountData(key), _ownPushSuppressUntil - Date.now() + 50);
            return;
          }
          applyRemoteAccountData(key);
        }, 400);
      };
      es.addEventListener('put', onEvent);
      es.addEventListener('patch', onEvent);
      es.onerror = () => { /* EventSource сам переподключается по спецификации — ничего не делаем */ };
      _accountEventSource = es;
    }catch(e){ _accountEventSource = null; }
  }

  function stopAccountLiveSync(){
    if (_remoteApplyTimer){ clearTimeout(_remoteApplyTimer); _remoteApplyTimer = null; }
    if (_accountEventSource){
      try{ _accountEventSource.close(); }catch(e){}
      _accountEventSource = null;
    }
  }

  // Полностью перекладывает локальную библиотеку в соответствие с тем, что сейчас лежит
  // в аккаунте на сервере — так же, как при входе, только без разлогина/модалок.
  async function applyRemoteAccountData(key){
    if (!state.account || normalizeNickKey(state.account.nick) !== key) return; // аккаунт сменился, пока летел запрос
    const data = await fbGet('accounts/' + key + '/data');
    if (!data) return;
    const remoteMovies = Array.isArray(data.movies) ? data.movies : [];
    const remoteCats = (Array.isArray(data.categories) && data.categories.length) ? data.categories : state.categories;

    _applyingRemoteAccountData = true;
    try{
      const oldIds = await STORAGE.getMovieIds();
      for (const id of oldIds){ await rawRemove(movieKey(id)); }
      await STORAGE.saveMovieIds([]);
      for (const m of remoteMovies){
        const copy = Object.assign({}, m);
        normalizeMovieCats(copy);
        await STORAGE.saveMovie(copy);
      }
      await STORAGE.saveCategories(remoteCats);
      state.movies = await STORAGE.loadAllMovies();
      state.categories = remoteCats;
      if (repairSharedCategoryFlags(state.categories)) await STORAGE.saveCategories(state.categories);

      _applyingRemoteAccountData = false;
    }
    render();
    recoverMissingPosters();

  // Пока приложение было свёрнуто, поток SSE мог оборваться (Telegram WebView это делает
  // охотно) — при возврате на экран переоткрываем соединение и сразу же принудительно
  // подтягиваем актуальные данные, чтобы не ждать следующего события.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state.account && state.account.nick){
      startAccountLiveSync();
      const key = normalizeNickKey(state.account.nick);
      if (key) applyRemoteAccountData(key);
    } else if (document.visibilityState === 'hidden'){
      // Пользователь свернул приложение/переключился на другую вкладку — самое
      // время отправить накопленные локальные изменения одним куском, невзирая
      // на минимальный интервал между синками (force=true) — рисковать нельзя.
      flushAccountSyncNow(true, true);
    }
  });
  // На случай, если вкладка/мини-апп закрывается совсем (а не просто сворачивается) —
  // visibilitychange тоже успевает сработать, но pagehide подстраховывает те платформы,
  // где это не гарантировано. keepalive:true позволяет запросу долететь уже после того,
  // как страница начала выгружаться.
  window.addEventListener('pagehide', () => { flushAccountSyncNow(true, true); });

  // ===== Восстановление обложек =====
  // Если у фильма нет постера (например, старая запись без картинки, или карточка
  // пришла с другого устройства без поля poster), пытаемся дотянуть картинку из TMDB:
  // сначала по сохранённому tmdbId (точный код фильма), а если его нет — поиском по
  // названию, беря первый результат с постером.
  let _posterRecoveryRunning = false;
  async function ensurePosterForMovie(m){
    if (!m || m.poster) return false;
    let found = null;
    try{
      if (m.tmdbId != null && m.mediaType){
        const data = await tmdbFetch('/' + m.mediaType + '/' + m.tmdbId, state.tmdbKey);
        if (data && data.poster_path) found = data;
      }
      if (!found && m.title){
        const data = await tmdbFetch('/search/multi?query=' + encodeURIComponent(m.title), state.tmdbKey);
        const results = (data && data.results) || [];
        const match = results.find(r => (r.media_type === 'movie' || r.media_type === 'tv') && r.poster_path);
        if (match){
          found = match;
          if (m.tmdbId == null){ m.tmdbId = match.id; m.mediaType = match.media_type === 'tv' ? 'tv' : 'movie'; }
        }
      }
    }catch(e){ return false; }
    if (!found || !found.poster_path) return false;
    m.poster = TMDB_IMG_PROXY_BASE + '/t/p/w500' + found.poster_path;
    if (!m.backdrop && found.backdrop_path) m.backdrop = TMDB_IMG_PROXY_BASE + '/t/p/w1280' + found.backdrop_path;
    await updateMovie(m);
    return true;
  }

  async function recoverMissingPosters(){
    if (_posterRecoveryRunning) return;
    const missing = state.movies.filter(m => !m.poster);
    if (!missing.length) return;
    _posterRecoveryRunning = true;
    try{
      let changedAny = false;
      for (const m of missing){
        const changed = await ensurePosterForMovie(m);
        if (changed) changedAny = true;
      }
      if (changedAny) render();
    } finally {
      _posterRecoveryRunning = false;
    }
  }

  let catDragSuppressClick = false;

  // Долгое нажатие на заголовок категории на главном экране запускает перетаскивание —
  // вся секция (заголовок + ряд фильмов) следует за пальцем по вертикали, а соседние
  // секции плавно расступаются, показывая, куда она встанет. Порядок сохраняется
  // в state.categories при отпускании.
  function initCategoryDragReorder(){
    const app = document.getElementById('app');
    if (!app) return;
    document.querySelectorAll('.section-head[data-cat]').forEach(headEl => {
      let pressTimer = null;
      let longPressActive = false;
      let startY = 0;
      let prevTouchY = 0;
      let dragCtx = null;
      let lastClientY = 0;
      let autoScrollRAF = null;
      let collapseTimer = null;
      let draggedSectionEl = null;

      const COLLAPSE_DURATION = 300;

      const cancelPress = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

      // Автопрокрутка: пока идёт перетаскивание и палец находится у верхней или
      // нижней кромки видимой области, плавно прокручиваем #app в ту сторону —
      // скорость нарастает по мере приближения к самому краю.
      const AUTOSCROLL_EDGE = 190;
      const AUTOSCROLL_MIN_SPEED = 6;
      const AUTOSCROLL_MAX_SPEED = 26;

      const stopAutoScroll = () => {
        if (autoScrollRAF){ cancelAnimationFrame(autoScrollRAF); autoScrollRAF = null; }
      };

      const autoScrollTick = () => {
        if (!dragCtx){ autoScrollRAF = null; return; }
        const appRect = app.getBoundingClientRect();
        const distFromTop = lastClientY - appRect.top;
        const distFromBottom = appRect.bottom - lastClientY;
        let speed = 0;
        if (distFromTop >= 0 && distFromTop < AUTOSCROLL_EDGE){
          const ratio = 1 - distFromTop / AUTOSCROLL_EDGE;
          speed = -(AUTOSCROLL_MIN_SPEED + (AUTOSCROLL_MAX_SPEED - AUTOSCROLL_MIN_SPEED) * ratio);
        } else if (distFromBottom >= 0 && distFromBottom < AUTOSCROLL_EDGE){
          const ratio = 1 - distFromBottom / AUTOSCROLL_EDGE;
          speed = AUTOSCROLL_MIN_SPEED + (AUTOSCROLL_MAX_SPEED - AUTOSCROLL_MIN_SPEED) * ratio;
        }
        if (speed !== 0){
          const maxScrollTop = app.scrollHeight - app.clientHeight;
          const prevScrollTop = app.scrollTop;
          const nextScrollTop = Math.max(0, Math.min(maxScrollTop, prevScrollTop + speed));
          const actualDelta = nextScrollTop - prevScrollTop;
          if (actualDelta !== 0){
            app.scrollTop = nextScrollTop;
            // Компенсируем смещение контента прокруткой, чтобы перетаскиваемая
            // секция визуально оставалась под пальцем.
            dragCtx.startClientY -= actualDelta;
            onMove(lastClientY);
          }
        }
        autoScrollRAF = requestAnimationFrame(autoScrollTick);
      };

      const beginDrag = (clientY) => {
        const sectionEl = headEl.closest('.section[data-cat-section]');
        if (!sectionEl) return;
        const sections = Array.from(app.querySelectorAll('.section[data-cat-section]'));
        const draggedIndex = sections.indexOf(sectionEl);
        if (draggedIndex === -1) return;

        longPressActive = true;
        catDragSuppressClick = true;
        hapticSelect();
        lastClientY = clientY;
        draggedSectionEl = sectionEl;

        sectionEl.classList.add('cat-dragging');
        app.classList.add('cat-reorder-active');

        // Даём рядам с постерами схлопнуться (см. CSS у .cat-reorder-active) и
        // только после этого включаем расчёт перетаскивания — уже по высоте
        // компактных заголовков, а не полных рядов с постерами.
        clearTimeout(collapseTimer);
        collapseTimer = setTimeout(() => {
          if (!longPressActive || draggedSectionEl !== sectionEl) return;
          const rects = sections.map(el => ({ el, top: el.offsetTop, height: el.offsetHeight }));
          dragCtx = { sectionEl, rects, draggedIndex, targetIndex: draggedIndex, startClientY: lastClientY, draggedInfo: rects[draggedIndex] };
          stopAutoScroll();
          autoScrollRAF = requestAnimationFrame(autoScrollTick);
        }, COLLAPSE_DURATION);
      };

      const onMove = (clientY) => {
        if (!longPressActive){
          // Заголовок специально не отдаёт жест браузеру (touch-action:none),
          // чтобы тот не перехватывал его на середине перетаскивания — поэтому
          // пока долгое нажатие ещё не сработало, прокручиваем страницу вручную,
          // как обычный свайп.
          const delta = prevTouchY - clientY;
          prevTouchY = clientY;
          if (pressTimer && Math.abs(clientY - startY) > 8) cancelPress();
          const maxScrollTop = app.scrollHeight - app.clientHeight;
          if (maxScrollTop > 0){
            app.scrollTop = Math.max(0, Math.min(maxScrollTop, app.scrollTop + delta));
          }
          return;
        }
        lastClientY = clientY;
        if (!dragCtx) return;
        const dy = clientY - dragCtx.startClientY;
        dragCtx.sectionEl.style.transform = 'translateY(' + dy + 'px)';

        const draggedCenter = dragCtx.draggedInfo.top + dragCtx.draggedInfo.height / 2 + dy;
        let newTarget = dragCtx.draggedIndex;

        dragCtx.rects.forEach((r, i) => {
          if (i === dragCtx.draggedIndex) return;
          const siblingCenter = r.top + r.height / 2;
          if (i < dragCtx.draggedIndex){
            if (draggedCenter < siblingCenter){
              r.el.style.transform = 'translateY(' + dragCtx.draggedInfo.height + 'px)';
              newTarget = Math.min(newTarget, i);
            } else {
              r.el.style.transform = '';
            }
          } else if (i > dragCtx.draggedIndex){
            if (draggedCenter > siblingCenter){
              r.el.style.transform = 'translateY(-' + dragCtx.draggedInfo.height + 'px)';
              newTarget = Math.max(newTarget, i);
            } else {
              r.el.style.transform = '';
            }
          }
        });

        dragCtx.targetIndex = newTarget;
      };

      const endDrag = () => {
        cancelPress();
        stopAutoScroll();
        clearTimeout(collapseTimer);
        if (!longPressActive) return;
        longPressActive = false;
        const ctx = dragCtx;
        dragCtx = null;
        app.classList.remove('cat-reorder-active');
        if (draggedSectionEl){
          draggedSectionEl.classList.remove('cat-dragging');
          draggedSectionEl = null;
        }

        if (ctx){
          ctx.rects.forEach(r => { r.el.style.transform = ''; });

          if (ctx.targetIndex !== ctx.draggedIndex){
            const moved = state.categories.splice(ctx.draggedIndex, 1)[0];
            state.categories.splice(ctx.targetIndex, 0, moved);
            STORAGE.saveCategories(state.categories);
            hapticOk();
          }
          render();
        }
        setTimeout(() => { catDragSuppressClick = false; }, 50);
      };

      headEl.addEventListener('contextmenu', e => e.preventDefault());
      headEl.addEventListener('selectstart', e => e.preventDefault());

      headEl.addEventListener('touchstart', e => {
        e.stopPropagation();
        const t = e.touches[0];
        startY = t.clientY;
        prevTouchY = t.clientY;
        cancelPress();
        pressTimer = setTimeout(() => beginDrag(t.clientY), 350);
      }, {passive:true});

      headEl.addEventListener('touchmove', e => {
        const t = e.touches[0];
        e.preventDefault();
        onMove(t.clientY);
      }, {passive:false});

      headEl.addEventListener('touchend', endDrag);
      headEl.addEventListener('touchcancel', endDrag);

      headEl.addEventListener('mousedown', e => {
        startY = e.clientY;
        prevTouchY = e.clientY;
        cancelPress();
        pressTimer = setTimeout(() => beginDrag(e.clientY), 350);
        const onMouseMove = ev => onMove(ev.clientY);
        const onMouseUp = () => {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
          endDrag();
        };
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    });
  }

  async function exportLibrary(){
    if (!state.movies.length){
      customAlert('Пока нечего копировать — добавь хотя бы один фильм.');
      return;
    }
    const code = encodeExportPayload(buildExportPayload());

    let copiedAutomatically = false;
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(code);
        copiedAutomatically = true;
      }
    }catch(e){ copiedAutomatically = false; }

    if (copiedAutomatically){
      hapticOk();
      customAlert('Скопировано! Открой Kinoblo на другом устройстве и нажми «Вставить».');
      return;
    }

    hapticErr();
    openCopyFallbackModal(code);
  }

  async function importLibrary(){
    let text = null;
    try{
      if (navigator.clipboard && navigator.clipboard.readText){
        text = await navigator.clipboard.readText();
      }
    }catch(e){ text = null; }

    if (text && text.indexOf(EXPORT_PREFIX) !== -1){
      try{
        const payload = decodeExportPayload(text);
        confirmAndMergePayload(payload);
        return;
      }catch(e){ /* падаем в ручной ввод ниже */ }
    }

    if (tg && typeof tg.readTextFromClipboard === 'function'){
      try{
        tg.readTextFromClipboard(clip => {
          if (clip && clip.indexOf(EXPORT_PREFIX) !== -1){
            try{
              const payload = decodeExportPayload(clip);
              confirmAndMergePayload(payload);
              return;
            }catch(e){}
          }
          openPasteFallbackModal();
        });
        return;
      }catch(e){}
    }

    openPasteFallbackModal();
  }

      let payload;
      try{
        payload = decodeExportPayload(raw);
      }catch(e){
        customAlert('Код не распознан. Проверь, что скопировал его полностью, и попробуй снова.');
        return;
      }
      div.remove();
      confirmAndMergePayload(payload);
    };
  }

  function confirmAndMergePayload(payload){
    const movieCount = payload.movies.length;
    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal" style="text-align:center;padding:24px;">'
      + '<div class="modal-title">Добавить фильмы?</div>'
      + '<div class="modal-msg">Во вставленном коде '+movieCount+' '+pluralMovies(movieCount)+'. Они добавятся в твою коллекцию, категории будут сопоставлены по названию (или созданы заново). Уже добавленные фильмы не задвоятся.</div>'
      + '<div class="modal-actions" style="margin-top:16px;display:flex;gap:8px;">'
      + '<button type="button" class="secondary-btn glass-flat" id="mergeCancelBtn">Отмена</button>'
      + '<button type="button" class="primary-btn" id="mergeConfirmBtn" style="margin-top:0;">Добавить</button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.querySelector('#mergeCancelBtn').onclick = () => div.remove();
    div.querySelector('#mergeConfirmBtn').onclick = async () => {

  function pluralMovies(n){
    const mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return 'фильм/сериал';
    if ([2,3,4].indexOf(mod10) !== -1 && [12,13,14].indexOf(mod100) === -1) return 'фильма/сериала';
    return 'фильмов/сериалов';
  }

  async function mergeImportedPayload(payload){
    const catMap = {};
    (payload.categories || []).forEach(importedCat => {
      const existing = state.categories.find(c => c.l.trim().toLowerCase() === (importedCat.l||'').trim().toLowerCase());
      if (existing){
        catMap[importedCat.v] = existing.v;
      } else {
        const newV = makeLocalId('cat');
        state.categories.push({
          v: newV,
          l: importedCat.l || 'Без названия',
          sub: importedCat.sub || '',
          icon: importedCat.icon || CAT_ICON_OPTIONS[0],
          color: importedCat.color || CAT_COLOR_PALETTE[0]
        });
        catMap[importedCat.v] = newV;
      }
    });
    await STORAGE.saveCategories(state.categories);

    let added = 0, skipped = 0;
    for (const importedMovie of (payload.movies || [])){
      const dupe = importedMovie.tmdbId != null
        ? state.movies.find(x => x.tmdbId === importedMovie.tmdbId && x.mediaType === importedMovie.mediaType)
        : null;
      if (dupe){ skipped++; continue; }

      const newMovie = Object.assign({}, importedMovie);
      newMovie.id = makeLocalId('m');
      const importedCats = (Array.isArray(importedMovie.categories) && importedMovie.categories.length)
        ? importedMovie.categories : (importedMovie.status ? [importedMovie.status] : []);
      newMovie.categories = importedCats.map(v => catMap[v]).filter(Boolean);
      if (!newMovie.categories.length) newMovie.categories = state.categories[0] ? [state.categories[0].v] : [];
      newMovie.catAddedAt = {};
      if (!newMovie.addedAt) newMovie.addedAt = Date.now();
      newMovie.categories.forEach(c => { newMovie.catAddedAt[c] = newMovie.addedAt; });

      const ok = await addMovie(newMovie);
      if (ok){
        state.movies.push(newMovie);
        added++;
      } else {
        skipped++;
      }
    }

    render();
    hapticOk();
    customAlert('Готово! Добавлено: ' + added + (skipped ? ', пропущено (уже есть): ' + skipped : '') + '.');
  }

  function initSwipeBack(){
    let startX = 0, currentX = 0, isSwiping = false, startTime = 0;
    const app = document.getElementById('app');
    const arrowIndicator = document.getElementById('swipeArrowIndicator');

    app.addEventListener('touchstart', e => {
      if (e.touches[0].clientX < 45){
        startX = e.touches[0].clientX;
        currentX = startX;
        isSwiping = true;
        startTime = Date.now();
      }
    }, {passive:true});

    app.addEventListener('touchmove', e => {
      if (!isSwiping) return;
      currentX = e.touches[0].clientX;
      const diff = currentX - startX;
      
      if (diff > 0){
        app.style.transform = 'translateX(' + diff + 'px) scale(' + (1 - Math.min(diff / 1000, 0.05)) + ')';
        app.style.opacity = String(1 - Math.min(diff / 400, 0.6));
        app.style.transition = 'none';

        if (arrowIndicator) {
          const progress = Math.min(diff / 120, 1);
          const scale = 0.3 + progress * 0.7;
          const translateX = -20 + progress * 25;
          const opacity = progress;
          
          arrowIndicator.style.transform = `translateY(-50%) scale(${scale}) translateX(${translateX}px)`;
          arrowIndicator.style.opacity = opacity;
        }
      }
    }, {passive:true});

    app.addEventListener('touchend', e => {
      if (!isSwiping) return;
      isSwiping = false;
      const diff = currentX - startX;
      const duration = Date.now() - startTime;

      if (arrowIndicator) {
        arrowIndicator.style.transform = 'translateY(-50%) scale(0) translateX(-20px)';
        arrowIndicator.style.opacity = '0';
      }

      if (diff > 100 || (diff > 40 && duration < 250)){
        app.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease';
        app.style.transform = 'translateX(100vw) scale(0.9)';
        app.style.opacity = '0';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
          if (state.view === 'detail' || state.view === 'category' || state.view === 'discoverList' || state.view === 'choose') {
            popNav();
          } else if (state.view === 'search') {
            state.view = 'home';
          }
          render();
        }, 220);
      } else {
        app.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease';
        app.style.transform = 'translateX(0) scale(1)';
        app.style.opacity = '1';
        setTimeout(() => { 
          app.style.transition = ''; 
          app.style.transform = ''; 
          app.style.opacity = ''; 
        }, 200);
      }
    });
  }

  // Свайп вниз для закрытия карточки фильма (аналог свайпа влево-назад, только по
  // вертикали). Работает только на экране деталей и только когда лента уже
  // прокручена до самого верха — иначе жест будет конфликтовать с обычной
  // прокруткой контента карточки вниз.
  function initPullDownToClose(){
    let startY = 0, currentY = 0, startX = 0, isPulling = false, isConfirmedVertical = false, startTime = 0;
    const app = document.getElementById('app');

    app.addEventListener('touchstart', e => {
      if (state.view !== 'detail') return;
      if (app.scrollTop > 0) return;
      // Не перехватываем жест, если он начался на горизонтальной карусели скриншотов —
      // там у пользователя должна остаться возможность свайпать вбок.
      if (e.target.closest('.movie-screenshots-scroll')) return;
      startY = e.touches[0].clientY;
      startX = e.touches[0].clientX;
      currentY = startY;
      isPulling = true;
      isConfirmedVertical = false;
      startTime = Date.now();
    }, {passive:true});

    app.addEventListener('touchmove', e => {
      if (!isPulling) return;
      currentY = e.touches[0].clientY;
      const dy = currentY - startY;
      const dx = e.touches[0].clientX - startX;

      if (!isConfirmedVertical){
        // Ждём, пока станет понятно направление жеста: если движение в основном
        // горизонтальное или лента успела уйти от верха (значит это обычный скролл) —
        // жест закрытия отменяется и дальше ничего не трогаем.
        if (Math.abs(dx) > Math.abs(dy) || app.scrollTop > 0){
          isPulling = false;
          return;
        }
        if (dy > 8) isConfirmedVertical = true;
        else return;
      }

      if (dy > 0){
        app.style.transform = 'translateY(' + dy + 'px) scale(' + (1 - Math.min(dy / 1000, 0.05)) + ')';
        app.style.opacity = String(1 - Math.min(dy / 400, 0.6));
        app.style.transition = 'none';
      }
    }, {passive:true});

    app.addEventListener('touchend', () => {
      if (!isPulling) return;
      isPulling = false;
      const dy = isConfirmedVertical ? (currentY - startY) : 0;
      const duration = Date.now() - startTime;
      isConfirmedVertical = false;
      if (dy <= 0) return;

      if (dy > 110 || (dy > 50 && duration < 250)){
        app.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s ease';
        app.style.transform = 'translateY(100vh) scale(0.92)';
        app.style.opacity = '0';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
          if (state.view === 'detail') popNav();
          render();
        }, 220);
      } else {
        app.style.transition = 'transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.2s ease';
        app.style.transform = 'translateY(0) scale(1)';
        app.style.opacity = '1';
        setTimeout(() => {
          app.style.transition = '';
          app.style.transform = '';
          app.style.opacity = '';
        }, 200);
      }
    });
  }

  // Клик по аватарке → системный выбор фото (галерея на телефоне, проводник на ПК).
  // Картинку ужимаем в квадрат 320×320 через canvas перед сохранением — иначе
  // фото с телефона в оригинальном размере (несколько МБ) не влезет в лимиты
  // локального хранилища устройства.
  function setupAccountAvatarHandlers(){
    const btn = document.getElementById('accountAvatarBtn');
    const input = document.getElementById('avatarFileInput');
    if (!btn || !input) return;
    btn.onclick = () => input.click();
    input.onchange = async () => {
      const file = input.files && input.files[0];
      input.value = '';
      if (!file || !file.type || file.type.indexOf('image/') !== 0) return;
      try{
        const dataUrl = await resizeImageToDataUrl(file, 320);
        state.avatarDataUrl = dataUrl;
        await STORAGE.setSetting('avatar_v1', dataUrl);
        hapticOk();
        render();
      }catch(e){
        hapticErr();
        customAlert('Не получилось загрузить фото — попробуй другую картинку.');
      }
    };
  }

  function resizeImageToDataUrl(file, size){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('read-failed'));
      reader.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error('decode-failed'));
        img.onload = () => {
          try{
            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            const canvas = document.createElement('canvas');
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            resolve(canvas.toDataURL('image/jpeg', 0.86));
          }catch(e){ reject(e); }
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

          cats.splice(idx, 1);

    document.querySelectorAll('.rate-star-btn[data-rate]').forEach(btn => {
      btn.onclick = () => {
        const r = parseInt(btn.getAttribute('data-rate'), 10);
        const m = state.movies.find(x => x.id === state.detailId);
        if (!m) return;
        m.myRating = (m.myRating === r) ? null : r;
        // Точечное обновление вместо полного render() — по той же причине,
        // что и у переключателя категорий выше: не дёргаем трейлер/скриншоты.
        document.querySelectorAll('.rate-star-btn[data-rate]').forEach(sBtn => {
          const i = parseInt(sBtn.getAttribute('data-rate'), 10);
          sBtn.classList.toggle('filled', m.myRating != null && m.myRating >= i);
          sBtn.classList.toggle('selected-star', m.myRating === i);
        });
        const valEl = document.querySelector('.my-rating-val-mini');
        if (valEl) valEl.textContent = m.myRating != null ? (m.myRating + ' / 10') : 'Не выбрана';
        saveMovieDebounced(m);
      };
    });

    const toggleBtn = document.getElementById('toggleOverviewBtn');
    if (toggleBtn){
      toggleBtn.onclick = () => {
        isOverviewExpanded = !isOverviewExpanded;
        const overviewDiv = document.getElementById('detailOverview');
        const extraEl = document.getElementById('overviewExtra');
        if (overviewDiv && extraEl){
          if (isOverviewExpanded){
            // Сначала делаем элемент строчным (display:inline), но ещё прозрачным —
            // и только следующим кадром запускаем плавное появление (opacity), иначе
            // браузер схлопнёт переход display:none -> inline с opacity 0 -> 1 в один
            // мгновенный скачок без анимации.
            extraEl.classList.add('overview-extra-mounted');
            requestAnimationFrame(() => requestAnimationFrame(() => {
              overviewDiv.classList.add('expanded');
            }));
          } else {
            overviewDiv.classList.remove('expanded');
            const onFadeOut = (e) => {
              if (e.target !== extraEl || e.propertyName !== 'opacity') return;
              extraEl.classList.remove('overview-extra-mounted');
              extraEl.removeEventListener('transitionend', onFadeOut);
            };
            extraEl.addEventListener('transitionend', onFadeOut);
          }
        }
        toggleBtn.textContent = isOverviewExpanded ? 'свернуть' : 'еще';
      };
    }

    document.querySelectorAll('.movie-screenshot-item[data-fullscreen-index]').forEach(el => {
      el.onclick = () => {
        const idx = parseInt(el.getAttribute('data-fullscreen-index'), 10);
        const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
        if (!m || !m.screenshots || !m.screenshots.length) return;
        
        let curIdx = idx;
        const hasMultiple = m.screenshots.length > 1;
        const modal = document.createElement('div');
        modal.className = 'fullscreen-modal';
        
        const updateModalContent = () => {
          const arrowsHtml = hasMultiple
            ? '<button class="fullscreen-arrow fullscreen-arrow-prev" title="Предыдущее изображение">'+icon('back', 22)+'</button>'
            + '<button class="fullscreen-arrow fullscreen-arrow-next" title="Следующее изображение">'+icon('back', 22)+'</button>'
            : '';
          modal.innerHTML = `
            <div class="fullscreen-counter">${curIdx + 1} / ${m.screenshots.length}</div>
            <button class="fullscreen-close">${icon('close', 20)}</button>
            ${arrowsHtml}
            <img src="${escapeHtml(m.screenshots[curIdx])}" alt="" draggable="false">
          `;
          modal.querySelector('.fullscreen-close').onclick = () => modal.remove();
          modal.onclick = (ev) => {
            if (ev.target === modal) modal.remove();
          };
          if (hasMultiple){
            modal.querySelector('.fullscreen-arrow-prev').onclick = (ev) => {
              ev.stopPropagation();
              curIdx = (curIdx - 1 + m.screenshots.length) % m.screenshots.length;
              updateModalContent();
            };
            modal.querySelector('.fullscreen-arrow-next').onclick = (ev) => {
              ev.stopPropagation();
              curIdx = (curIdx + 1) % m.screenshots.length;
              updateModalContent();
            };
          }
        };
        
        updateModalContent();
        document.body.appendChild(modal);

        // Колесо мыши на ПК тоже листает картинки (вперёд/назад), как и стрелки —
        // а заодно не даёт скроллу "пролезть" сквозь модалку и прокрутить страницу
        // фильма на фоне (модалка ведь fixed поверх всего, скролла внутри у неё нет).
        let wheelLockedUntil = 0;
        const onWheel = (ev) => {
          ev.preventDefault();
          if (!hasMultiple) return;
          const now = Date.now();
          if (now < wheelLockedUntil) return;
          wheelLockedUntil = now + 280;
          if (ev.deltaY > 0 || ev.deltaX > 0){
            curIdx = (curIdx + 1) % m.screenshots.length;
          } else {
            curIdx = (curIdx - 1 + m.screenshots.length) % m.screenshots.length;
          }
          updateModalContent();
        };
        modal.addEventListener('wheel', onWheel, { passive:false });

        // Стрелками ← / → тоже можно листать изображения — удобно на ПК,
        // где свайп мышью не так очевиден, как на телефоне.
        const onKeydown = (ev) => {
          if (ev.key === 'ArrowLeft' && hasMultiple){
            // preventDefault — иначе стрелки, помимо переключения картинки,
            // ещё и выполняют своё стандартное браузерное действие: чуть
            // скроллят страницу фильма позади модалки (на ПК это заметно
            // как небольшое подёргивание фона при каждом нажатии).
            ev.preventDefault();
            curIdx = (curIdx - 1 + m.screenshots.length) % m.screenshots.length;
            updateModalContent();
          } else if (ev.key === 'ArrowRight' && hasMultiple){
            ev.preventDefault();
            curIdx = (curIdx + 1) % m.screenshots.length;
            updateModalContent();
          } else if (ev.key === 'Escape'){
            modal.remove();
          }
        };
        document.addEventListener('keydown', onKeydown);
        const cleanupObserver = new MutationObserver(() => {
          if (!document.body.contains(modal)){
            document.removeEventListener('keydown', onKeydown);
            cleanupObserver.disconnect();
          }
        });
        cleanupObserver.observe(document.body, { childList: true });

        // Один и тот же жест обрабатывает и горизонтальное листание между картинками
        // (как раньше), и потягивание вниз для закрытия (как на карточке фильма) —
        // направление определяется по первому заметному сдвигу пальца и дальше не
        // меняется до конца текущего касания, чтобы жесты не путались между собой.
        let touchStartX = 0, touchStartY = 0, dragDir = null;
        modal.addEventListener('touchstart', (e) => {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          dragDir = null;
          const img = modal.querySelector('img');
          if (img) img.style.transition = 'none';
        }, {passive: true});

        modal.addEventListener('touchmove', (e) => {
          const dx = e.touches[0].clientX - touchStartX;
          const dy = e.touches[0].clientY - touchStartY;
          if (!dragDir){
            if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return;
            dragDir = Math.abs(dy) > Math.abs(dx) ? 'vertical' : 'horizontal';
          }
          if (dragDir === 'vertical' && dy > 0){
            const img = modal.querySelector('img');
            if (img) img.style.transform = 'translateY(' + dy + 'px) scale(' + (1 - Math.min(dy / 1000, 0.08)) + ')';
            modal.style.background = 'rgba(0,0,0,' + Math.max(0.95 - Math.min(dy / 400, 0.75), 0.2) + ')';
          }
        }, {passive: true});

        modal.addEventListener('touchend', (e) => {
          const dx = e.changedTouches[0].clientX - touchStartX;
          const dy = e.changedTouches[0].clientY - touchStartY;
          const img = modal.querySelector('img');

          if (dragDir === 'vertical'){
            if (dy > 100){
              if (img){
                img.style.transition = 'transform 0.22s ease, opacity 0.22s ease';
                img.style.transform = 'translateY(60vh) scale(0.85)';
                img.style.opacity = '0';
              }
              modal.style.transition = 'background 0.22s ease';
              modal.style.background = 'rgba(0,0,0,0)';
              setTimeout(() => modal.remove(), 200);
            } else if (img){
              img.style.transition = 'transform 0.2s ease';
              img.style.transform = 'translateY(0) scale(1)';
              modal.style.transition = 'background 0.2s ease';
              modal.style.background = 'rgba(0, 0, 0, 0.95)';
            }
          } else if (dragDir === 'horizontal' && Math.abs(dx) > 50) {
            if (dx > 0) {
              curIdx = (curIdx - 1 + m.screenshots.length) % m.screenshots.length;
            } else {
              curIdx = (curIdx + 1) % m.screenshots.length;
            }
            updateModalContent();
          }
          dragDir = null;
        }, {passive: true});
      };
    });

    const addCatBtn = document.getElementById('addCategoryBtn');
    if (addCatBtn){
      addCatBtn.onclick = () => {
        openAddCategoryChooser();
      };
    }

    const editCatBtn = document.getElementById('editCatBtn');
    if (editCatBtn){
      editCatBtn.onclick = () => {
        const cat = state.categories.find(c => c.v === state.categoryFilter);
        if (cat) openCategoryEditor(cat);
      };
    }

    const refreshSharedBtn = document.getElementById('refreshSharedBtn');
    if (refreshSharedBtn){
      refreshSharedBtn.onclick = async () => {
        if (refreshSharedBtn.dataset.busy === '1') return;
        refreshSharedBtn.dataset.busy = '1';
        refreshSharedBtn.style.opacity = '0.5';
        const cat = state.categories.find(c => c.v === state.categoryFilter);
        if (cat && cat.code){
          await syncSharedCategoryMovies(cat.code);
          await syncSharedCategoryMeta(cat.code);
        }
        refreshSharedBtn.dataset.busy = '0';
        hapticOk();
        render();
      };
    }

    const accountLoginBtn = document.getElementById('accountLoginBtn');
    if (accountLoginBtn) accountLoginBtn.onclick = () => openLoginModal();

    const accountRegisterBtn = document.getElementById('accountRegisterBtn');
    if (accountRegisterBtn) accountRegisterBtn.onclick = () => openRegisterModal();

    const accountLogoutBtn = document.getElementById('accountLogoutBtn');
    if (accountLogoutBtn){
      accountLogoutBtn.onclick = async () => {
        await logoutAccount();
        hapticOk();
        render();
      };
    }

    setupAccountAvatarHandlers();
  }
