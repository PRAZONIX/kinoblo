<body>
<div id="app"></div>

<!-- Элемент анимированной капли-стрелочки для свайпа -->
<div id="swipeArrowIndicator" class="swipe-arrow-indicator">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M15 18l-6-6 6-6"/>
  </svg>
</div>

<script>
(function(){
  let tg = null;
  let tmdbSearchTimer = null;
  let isOverviewExpanded = false; 
  let navStack = []; // стек предыдущих экранов для корректной работы "назад" (свайп/кнопка) при вложенных переходах

  function pushNav(){
    navStack.push({
      view: state.view,
      detailId: state.detailId,
      previewItem: state.previewItem,
      categoryFilter: state.categoryFilter,
      discoverListKey: state.discoverListKey
    });
  }

  function popNav(){
    leaveDiscoverListView();
    if (navStack.length){
      const prev = navStack.pop();
      state.view = prev.view;
      state.detailId = prev.detailId;
      state.previewItem = prev.previewItem;
      state.categoryFilter = prev.categoryFilter;
      state.discoverListKey = prev.discoverListKey;
    } else {
      state.view = 'home';
    }
  }

  function initTelegram(){
    try{
      tg = window.Telegram && window.Telegram.WebApp;
      if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor('#07070a'); tg.setBackgroundColor && tg.setBackgroundColor('#07070a'); }
    }catch(e){}
  }
  function loadTelegramSdkThenStart(){
    let started = false;
    const start = () => { if (started) return; started = true; initTelegram(); loadAll(); };
    const fallback = setTimeout(start, 1000);
    try{
      const s = document.createElement('script');
      s.src = 'https://telegram.org/js/telegram-web-app.js';
      s.onload = () => { clearTimeout(fallback); start(); };
      s.onerror = () => { clearTimeout(fallback); start(); };
      document.head.appendChild(s);
    }catch(e){ clearTimeout(fallback); start(); }
  }

  const ICONS = {
    home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>',
    menu:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
    close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
    image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>',
    heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.6Z"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>',
    eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg>',
    external:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>',

  const FIREBASE_DB_URL = 'https://kinoblo-default-rtdb.firebaseio.com';

  function sharedBackendReady(){ return !!FIREBASE_DB_URL; }
  function fbUrl(path){ return FIREBASE_DB_URL.replace(/\/$/, '') + '/' + path + '.json'; }
  async function fbGet(path){
    if (!sharedBackendReady()) return null;
    try{
      const res = await fetch(fbUrl(path));
      if (!res.ok) return null;
      return await res.json();
    }catch(e){ return null; }
  }
  async function fbSet(path, data, opts){
    if (!sharedBackendReady()) return false;

  function genShareCode(){
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let out = '';
    for (let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
    return out;
  }
  function isSharedCat(v){ return typeof v === 'string' && v.indexOf('shared_') === 0; }
  function shareCodeOf(v){ return isSharedCat(v) ? v.slice(7) : null; }
  // Совместность категории раньше держалась только на полях c.shared/c.code —
  // если они где-то терялись (например, при синке аккаунта до этого фикса),
  // категория выглядела как обычная и переставала попадать в автосинк
  // (см. syncAllSharedCategories, фильтр "c.shared && c.code"), хотя её id
  // (c.v) по-прежнему начинался с "shared_<код>". Здесь на каждой загрузке
  // категорий эти поля восстанавливаются прямо из c.v, так что раз возникшая
  // "поломка" сама себя чинит и больше не повторяется.
  function repairSharedCategoryFlags(cats){
    let changed = false;
    (cats || []).forEach(c => {
      if (c && isSharedCat(c.v) && (!c.shared || c.code !== shareCodeOf(c.v))){
        c.shared = true;
        c.code = shareCodeOf(c.v);
        changed = true;
      }
    });
    return changed;
  }

  // ===== Мульти-категории =====
  // Фильм теперь может состоять сразу в нескольких категориях (m.categories — массив),
  // а не только в одной (старое поле m.status). m.catAddedAt хранит момент добавления
  // фильма в каждую конкретную категорию — по нему сортируется список внутри раздела,
  // поэтому свежедобавленный фильм всегда оказывается в начале именно той категории,
  // куда его только что закинули, а не только общего списка библиотеки.
  function normalizeMovieCats(m, fallbackCatV){
    if (!m) return m;
    if (!Array.isArray(m.categories) || !m.categories.length){
      const legacy = m.status;
      m.categories = legacy ? [legacy] : (fallbackCatV ? [fallbackCatV] : ((state.categories && state.categories[0]) ? [state.categories[0].v] : []));
    }
    if (!m.catAddedAt || typeof m.catAddedAt !== 'object') m.catAddedAt = {};
    m.categories.forEach(c => { if (m.catAddedAt[c] == null) m.catAddedAt[c] = m.addedAt || Date.now(); });
    delete m.status;
    return m;
  }
  function movieInCat(m, catV){ return !!m && Array.isArray(m.categories) && m.categories.indexOf(catV) !== -1; }
  function sharedCatsOf(m){ return (m && Array.isArray(m.categories)) ? m.categories.filter(isSharedCat) : []; }
  async function copyTextToClipboard(text){
    try{
      if (navigator.clipboard && navigator.clipboard.writeText){
        await navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){}
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  }
  async function syncSharedCategoryMovies(code){
    if (!sharedBackendReady() || !code) return;
    const remote = await fbGet('shared/'+code+'/movies');
    const catV = 'shared_'+code;
    const remoteMovies = remote ? Object.keys(remote).map(k => remote[k]) : [];
    remoteMovies.forEach(rm => normalizeMovieCats(rm, catV));
    const remoteIds = remoteMovies.map(m => m.id);
    // Фильмы, которые раньше были в этой совместной категории локально, но пропали
    // из общего списка на сервере — снимаем метку категории (а не всегда удаляем
    // целиком: фильм мог параллельно лежать ещё и в личной категории).
    const staleLocal = state.movies.filter(m => movieInCat(m, catV) && remoteIds.indexOf(m.id) === -1);
    for (const m of staleLocal){
      m.categories = (m.categories||[]).filter(c => c !== catV);
      if (m.categories.length) await STORAGE.saveMovie(m);
      else await STORAGE.deleteMovie(m.id);
    }
    state.movies = state.movies.filter(m => m.categories && m.categories.length);
    for (const rm of remoteMovies){
      const local = state.movies.find(x => x.id === rm.id);
      if (local){
        const mergedCats = Array.from(new Set([].concat(local.categories||[], rm.categories||[catV])));
        const mergedCatAddedAt = Object.assign({}, rm.catAddedAt, local.catAddedAt);
        Object.assign(local, rm);
        local.categories = mergedCats;
        local.catAddedAt = mergedCatAddedAt;
        await STORAGE.saveMovie(local);
      } else {
        state.movies.push(rm);
        await STORAGE.saveMovie(rm);
      }
    }
  }

    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.getItem(key, (err, value) => resolve(err ? null : (value || null))); }
        catch(e){ resolve(null); }
      } else {
        try{ resolve(localStorage.getItem(key)); }catch(e){ resolve(null); }
      }
    });
  }
  function rawSet(key, value){
    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.setItem(key, value, (err, ok) => resolve(!err && ok !== false)); }
        catch(e){ resolve(false); }
      } else {
        try{ localStorage.setItem(key, value); resolve(true); }catch(e){ resolve(false); }
      }
    });
  }
  function rawRemove(key){
    return new Promise(resolve => {
      if (storageBackend === 'device'){
        try{ tg.DeviceStorage.removeItem(key, (err, ok) => resolve(!err && ok !== false)); }
        catch(e){ resolve(false); }
      } else {
        try{ localStorage.removeItem(key); resolve(true); }catch(e){ resolve(false); }
      }
    });
  }

      let oldRaw = null;

      if (!oldRaw && tg && tg.CloudStorage){

          try{ tg.CloudStorage.getItem(OLD_BLOB_KEY, (err, v) => resolve(err ? null : v)); }
          catch(e){ resolve(null); }

      if (oldRaw){

        try{ oldMovies = JSON.parse(oldRaw); }catch(e){ oldMovies = []; }
        if (Array.isArray(oldMovies) && oldMovies.length){
          const ids = await this.getMovieIds();

  // Экономит сеть при обычной навигации (открыл фильм → назад → открыл снова,
  // переключение между категориями "Поиска" туда-обратно и т.п.), при этом TTL
  // (3 мин) намного короче интервалов плановой проверки обновлений подборок
  // (10-15 мин), так что логика "есть новинки" по-прежнему всегда видит свежие данные.
  const TMDB_CACHE_TTL_MS = 3 * 60 * 1000;
  const tmdbCache = new Map();
  const tmdbInFlight = new Map();

  // Запросы к TMDB идут не напрямую на api.themoviedb.org, а через собственный
  // прокси на Cloudflare Workers. Так у пользователей без VPN (или с VPN на
  // датацентровом IP, который TMDB/Cloudflare банит) приложение всё равно грузится:
  // браузер стучится только на этот адрес, а сам прокси уже сам обращается к TMDB.
  // ВАЖНО: после деплоя воркера подставь сюда его реальный адрес вида
  // https://<имя-воркера>.<твой-сабдомен>.workers.dev
  const TMDB_PROXY_BASE = 'https://kinoblo-proxy.zenabunicev.workers.dev/3';
  // Картинки (постеры, кадры) TMDB отдаёт с отдельного домена image.tmdb.org —
  // он тоже проксируется через тот же воркер (см. обновлённый tmdb-proxy-worker.js),
  // просто без префикса /3.
  const TMDB_IMG_PROXY_BASE = 'https://kinoblo-proxy.zenabunicev.workers.dev';

  async function tmdbFetch(path, key){
    const base = TMDB_PROXY_BASE;
    const sep = path.indexOf('?') > -1 ? '&' : '?';
    const url = base + path + sep + 'api_key=' + encodeURIComponent(key) + '&language=ru-RU';

    const cached = tmdbCache.get(url);
    if (cached && (Date.now() - cached.time) < TMDB_CACHE_TTL_MS) return cached.data;

    const inFlight = tmdbInFlight.get(url);
    if (inFlight) return inFlight;

    const req = (async () => {
      const res = await fetch(url);
      if (!res.ok) throw new Error('TMDB HTTP ' + res.status);
      const data = await res.json();
      tmdbCache.set(url, { time: Date.now(), data });
      return data;
    })();
    tmdbInFlight.set(url, req);
    try{
      return await req;
    } finally {
      tmdbInFlight.delete(url);
    }
  }

  function mapTmdbItem(r, forcedKind){

    return {
      tmdbId: r.id,
      mediaType: isTv ? 'tv' : 'movie',
      title: (isTv ? (r.name || r.original_name) : (r.title || r.original_title)) || '',
      year: ((isTv ? r.first_air_date : r.release_date) || '').slice(0, 4),
      poster: r.poster_path ? (TMDB_IMG_PROXY_BASE + '/t/p/w500' + r.poster_path) : '',
      backdrop: r.backdrop_path ? (TMDB_IMG_PROXY_BASE + '/t/p/w1280' + r.backdrop_path) : '',
      description: r.overview || '',
      genres: (r.genre_ids || []).map(id => gmap[id]).filter(Boolean),
      voteAverage: typeof r.vote_average === 'number' ? r.vote_average : null,
      popularity: r.popularity || 0,
      type: isTv ? 'series' : 'movie',
      // Число сезонов приходит только из полного /tv/{id} (не из discover/search),
      // поэтому здесь может быть null — подгружается лениво в карточке фильма (см. loadSeasonInfoForDetail).
      numberOfSeasons: isTv && typeof r.number_of_seasons === 'number' ? r.number_of_seasons : null,
      numberOfEpisodes: isTv && typeof r.number_of_episodes === 'number' ? r.number_of_episodes : null

  // Правильное склонение слова «сезон» под число (1 сезон / 2 сезона / 5 сезонов).
  function seasonsLabel(n){
    if (n == null || typeof n !== 'number' || n <= 0) return '';
    const mod10 = n % 10, mod100 = n % 100;
    let word;
    if (mod10 === 1 && mod100 !== 11) word = 'сезон';
    else if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) word = 'сезона';
    else word = 'сезонов';
    return n + ' ' + word;
  }

  // и тогда фильтр по жанру для сериалов просто не применяется (иначе снова 0 результатов).
  const MOVIE_TO_TV_GENRE_MAP = {
    28: 10759,    // Боевик -> Action & Adventure
    12: 10759,    // Приключения -> Action & Adventure
    16: 16,       // Мультфильм -> Animation
    35: 35,       // Комедия
    80: 80,       // Криминал
    99: 99,       // Документальный
    18: 18,       // Драма
    10751: 10751, // Семейный
    14: 10765,    // Фэнтези -> Sci-Fi & Fantasy
    36: null,     // История — аналога у сериалов нет
    27: null,     // Ужасы — аналога у сериалов нет
    10402: null,  // Мюзикл — аналога у сериалов нет
    9648: 9648,   // Детектив
    10749: 10766, // Мелодрама/Романтика -> Soap (ближайший аналог)
    878: 10765,   // Фантастика -> Sci-Fi & Fantasy
    53: null,     // Триллер — аналога у сериалов нет

  // null, если для tv у выбранного жанра нет соответствия и фильтр применять нельзя.
  function genreIdForKind(genreId, kind){
    if (!genreId) return null;
    if (kind !== 'tv') return genreId;
    return Object.prototype.hasOwnProperty.call(MOVIE_TO_TV_GENRE_MAP, genreId)
      ? MOVIE_TO_TV_GENRE_MAP[genreId]
      : genreId;
  }
  // Добавляет выбранный пользователем жанр к параметрам запроса, СОХРАНЯЯ уже

  }

  // Строит запросы к TMDB /discover для подборки cat с учётом выбранных фильтров (год/тип/страна).
  // Возвращает массив {kind, url} — по одному на каждый нужный вид контента (movie и/или tv).
  function buildDiscoverRequests(cat, filters, page){
    let kinds;
    if (filters.type === 'movie') kinds = ['movie'];
    else if (filters.type === 'series') kinds = ['tv'];
    else if (filters.type === 'cartoon') kinds = ['movie'];
    else if (filters.type === 'anime') kinds = ['tv'];
    else if (cat.kind === 'mixed') kinds = ['movie', 'tv'];
    else kinds = [cat.kind];

    return kinds.map(kind => {
      const params = new URLSearchParams();
      let simpleEndpoint = null;

      if (cat.provider || cat.company){
        if (cat.provider){ params.set('with_watch_providers', String(cat.provider)); params.set('watch_region', 'US'); }
        if (cat.company){ params.set('with_companies', String(cat.company)); }
      } else if (cat.path){
        const qIdx = cat.path.indexOf('?');
        const basePath = qIdx === -1 ? cat.path : cat.path.slice(0, qIdx);
        const qs = qIdx === -1 ? '' : cat.path.slice(qIdx + 1);
        if (basePath.indexOf('/discover/') === 0){
          if (qs) new URLSearchParams(qs).forEach((v, k) => params.set(k, v));
        } else if (kind === cat.kind && !filters.year && !filters.country && !filters.type && !filters.genre){
          simpleEndpoint = basePath;
        }
      }

      if (filters.type === 'cartoon'){ params.set('with_genres', '16'); params.delete('with_original_language'); }
      else if (filters.type === 'anime'){ params.set('with_genres', '16'); params.set('with_original_language', 'ja'); }

      if (filters.genre) addGenreFilterToParams(params, filters.genre, kind);

      if (filters.year) params.set(kind === 'tv' ? 'first_air_date_year' : 'primary_release_year', String(filters.year));
      if (filters.country) params.set('with_origin_country', filters.country);

      if (simpleEndpoint) return { kind, url: simpleEndpoint + '?page=' + page };

      if (!params.has('sort_by')) params.set('sort_by', 'popularity.desc');
      params.set('page', String(page));
      return { kind, url: '/discover/' + kind + '?' + params.toString() };
    });
  }

  // Общая логика получения свежего списка тайтлов подборки с TMDB — используется и при первой
  // загрузке категории, и при периодической проверке на новинки (см. checkDiscoverCategoryForUpdates).
  async function fetchDiscoverCategoryItems(cat){
    let items = [];
    if (cat.path){
      const data = await tmdbFetch(cat.path, state.tmdbKey);
      items = (data.results || []).map(r => ({r, kind: cat.kind}));
    } else if (cat.special === 'lgbt'){
      let kwIds = state.discover.lgbtKeywordIds;
      if (!kwIds){
        const [kw1, kw2] = await Promise.all([
          tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
          tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
        ]);
        const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
        const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
        kwIds = [id1, id2].filter(Boolean);
        state.discover.lgbtKeywordIds = kwIds;
      }
      if (kwIds.length){
        const kwParam = kwIds.join('|');
        const [mv, tv] = await Promise.all([
          tmdbFetch('/discover/movie?with_keywords=' + kwParam + '&sort_by=popularity.desc&primary_release_date.gte=2015-01-01', state.tmdbKey),
          tmdbFetch('/discover/tv?with_keywords=' + kwParam + '&sort_by=popularity.desc&first_air_date.gte=2015-01-01', state.tmdbKey)
        ]);
        items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
      }
    } else if (cat.provider || cat.company){
      const param = cat.provider ? ('with_watch_providers=' + cat.provider + '&watch_region=US') : ('with_companies=' + cat.company);
      const [mv, tv] = await Promise.all([
        tmdbFetch('/discover/movie?' + param + '&sort_by=popularity.desc', state.tmdbKey),
        tmdbFetch('/discover/tv?' + param + '&sort_by=popularity.desc', state.tmdbKey)
      ]);
      items = (mv.results || []).map(r => ({r, kind:'movie'})).concat((tv.results || []).map(r => ({r, kind:'tv'})));
    }
    items.sort((a,b) => (b.r.popularity || 0) - (a.r.popularity || 0));
    return items.slice(0, 14).map(x => mapTmdbItem(x.r, x.kind));
  }

  // ===== Персистентная метка "новинка" =====
  // Раньше isNew сравнивался только с тем, что уже лежало в state.discover.cache — это чисто оперативная
  // память, и она обнуляется при каждой перезагрузке страницы (в т.ч. просто открыв обновлённую версию
  // приложения). Из-за этого пропадали значки "Новое" у фильмов, хотя сами фильмы никуда не девались —
  // просто заново отрисованный список считался "стартовым срезом", и сравнивать было не с чем.
  // Теперь дата первого обнаружения каждого тайтла в подборке хранится в постоянном хранилище устройства,
  // и бейдж держится NEW_BADGE_WINDOW_MS с момента первого обнаружения — переживает перезагрузки и
  // обновления приложения, а не только "живёт" в рамках одной открытой вкладки.
  const NEW_BADGE_WINDOW_MS = 48 * 60 * 60 * 1000; // сколько времени фильм считается "новинкой" после первого обнаружения

  async function loadSeenMap(catKey){
    try{
      const raw = await rawGet('kinoblo_seen_' + catKey);
      if (!raw) return { map: {}, isFirstEver: true };
      const obj = JSON.parse(raw);
      return { map: (obj && typeof obj === 'object') ? obj : {}, isFirstEver: false };
    }catch(e){ return { map: {}, isFirstEver: true }; }
  }

  // Проставляет item.isNew на основе персистентной истории показов категории и обновляет её,
  // если появились тайтлы, которых раньше в подборке не было. Ничего не удаляет и не фильтрует —
  // список items остаётся тем же самым, меняются только флаги isNew.
  async function applyNewBadges(catKey, items){
    const { map: seenMap, isFirstEver } = await loadSeenMap(catKey);
    const now = Date.now();
    let changed = false;
    items.forEach(item => {
      const id = item.mediaType + '_' + item.tmdbId;
      let firstSeen = seenMap[id];
      if (firstSeen == null){
        // Самый первый раз, когда подборка вообще загружается на этом устройстве — это стартовый срез,
        // а не "новинки", поэтому firstSeen помечается как "давно" (0), чтобы бейдж не появился.
        firstSeen = isFirstEver ? 0 : now;
        seenMap[id] = firstSeen;
        changed = true;
      }
      if (firstSeen && (now - firstSeen) < NEW_BADGE_WINDOW_MS) item.isNew = true;
    });
    if (changed) rawSet('kinoblo_seen_' + catKey, JSON.stringify(seenMap));
    return items;
  }

  async function loadDiscoverCategory(cat){
    if (state.discover.cache[cat.key] || state.discover.loading[cat.key]) return;
    state.discover.loading[cat.key] = true;
    try{
      const items = await fetchDiscoverCategoryItems(cat);
      state.discover.cache[cat.key] = await applyNewBadges(cat.key, items);
      state.discover.cacheTime[cat.key] = Date.now();
    }catch(e){
      state.discover.cache[cat.key] = [];
    }
    state.discover.loading[cat.key] = false;
    renderDiscoverCategoryRow(cat.key);
  }

  async function loadDiscoverFullPage(key){
    const cat = discoverCatByKey(key);
    if (!cat || state.discover.fullLoading[key] || state.discover.fullDone[key]) return;
    state.discover.fullLoading[key] = true;
    
    const loader = document.getElementById('infiniteLoader');
    if (loader) loader.style.display = 'block';

    const filters = getDiscoverFilters(key);
    const page = (state.discover.fullPage[key] || 0) + 1;
    let items = [];
    let newItems = [];
    try{
      if (cat.special === 'lgbt'){
        let kwIds = state.discover.lgbtKeywordIds;
        if (!kwIds){
          const [kw1, kw2] = await Promise.all([
            tmdbFetch('/search/keyword?query=gay', state.tmdbKey),
            tmdbFetch('/search/keyword?query=lgbt', state.tmdbKey)
          ]);
          const id1 = kw1.results && kw1.results[0] && kw1.results[0].id;
          const id2 = kw2.results && kw2.results[0] && kw2.results[0].id;
          kwIds = [id1, id2].filter(Boolean);
          state.discover.lgbtKeywordIds = kwIds;
        }
        if (kwIds.length){
          const kwParam = kwIds.join('|');
          let kinds;
          if (filters.type === 'movie' || filters.type === 'cartoon') kinds = ['movie'];
          else if (filters.type === 'series' || filters.type === 'anime') kinds = ['tv'];
          else kinds = ['movie', 'tv'];
          const reqs = kinds.map(kind => {
            const params = new URLSearchParams();
            params.set('with_keywords', kwParam);
            params.set('sort_by', 'popularity.desc');
            params.set('page', String(page));
            if (filters.type === 'cartoon'){ params.set('with_genres', '16'); }
            else if (filters.type === 'anime'){ params.set('with_genres', '16'); params.set('with_original_language', 'ja'); }
            if (filters.genre) addGenreFilterToParams(params, filters.genre, kind);
            if (filters.year) params.set(kind === 'tv' ? 'first_air_date_year' : 'primary_release_year', String(filters.year));
            else params.set(kind === 'tv' ? 'first_air_date.gte' : 'primary_release_date.gte', '2015-01-01');
            if (filters.country) params.set('with_origin_country', filters.country);
            return { kind, url: '/discover/' + kind + '?' + params.toString() };
          });
          const results = await Promise.all(reqs.map(r => tmdbFetch(r.url, state.tmdbKey)));
          items = [];
          results.forEach((data, i) => { items = items.concat((data.results || []).map(r => mapTmdbItem(r, reqs[i].kind))); });
          if (reqs.length > 1) items.sort((a,b) => (b.popularity||0) - (a.popularity||0));
          const maxPages = Math.max.apply(null, results.map(d => d.total_pages || 1));
          if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
        } else { state.discover.fullDone[key] = true; }
      } else {
        const reqs = buildDiscoverRequests(cat, filters, page);
        const results = await Promise.all(reqs.map(r => tmdbFetch(r.url, state.tmdbKey)));
        items = [];
        results.forEach((data, i) => { items = items.concat((data.results || []).map(r => mapTmdbItem(r, reqs[i].kind))); });
        if (reqs.length > 1) items.sort((a,b) => (b.popularity||0) - (a.popularity||0));
        const maxPages = Math.max.apply(null, results.map(d => d.total_pages || 1));
        if (page >= maxPages || page >= 20) state.discover.fullDone[key] = true;
      }
      const existing = state.discover.full[key] || [];
      const seen = new Set(existing.map(x => x.mediaType + '_' + x.tmdbId));
      newItems = items.filter(x => !seen.has(x.mediaType + '_' + x.tmdbId));
      state.discover.full[key] = existing.concat(newItems);
      state.discover.fullPage[key] = page;
      if (page >= 20) state.discover.fullDone[key] = true;
    }catch(e){
      if (!(state.discover.full[key] || []).length) state.discover.full[key] = [];
      state.discover.fullDone[key] = true;
    }
    state.discover.fullLoading[key] = false;

    // Если мы всё ещё смотрим этот же список — дописываем новые карточки прямо в DOM,
    // не трогая остальную страницу. Полный render() тут не годится: он пересоздаёт
    // #app.innerHTML целиком, из-за чего браузер сбрасывает scrollTop в 0 и ленту
    // откатывало наверх при каждой подгрузке новых фильмов.
    const app = document.getElementById('app');
    const grid = state.view === 'discoverList' && state.discoverListKey === key
      ? app.querySelector('.movies-grid') : null;
    if (grid){
      if (newItems && newItems.length){
        const temp = document.createElement('div');
        temp.innerHTML = newItems.map(discoverCard).join('');
        while (temp.firstChild) grid.appendChild(temp.firstChild);
        bindEvents();
      }
      const loaderEl = document.getElementById('infiniteLoader');
      if (loaderEl){
        if (state.discover.fullDone[key]) loaderEl.remove();
        else loaderEl.style.display = 'none';
      }
    } else {
      render();
    }

    // На широких экранах карточек на страницу помещается больше в ширину,
    // поэтому первая (и иногда вторая-третья) страница может целиком уместиться
    // на экране без вертикального скролла — а раз скроллить нечем, обычный
    // scroll-триггер подгрузки (initInfiniteScroll) вообще не срабатывает, и
    // список "застревает" на первой партии фильмов. Поэтому после каждой
    // подгрузки дополнительно проверяем: не короче ли контент, чем видимая
    // область — и если короче, сразу подгружаем следующую страницу, пока
    // список не заполнит экран (или пока подборка не закончится).
    setTimeout(() => {
      if (state.view !== 'discoverList' || state.discoverListKey !== key) return;
      if (state.discover.fullLoading[key] || state.discover.fullDone[key]) return;
      const appEl = document.getElementById('app');
      if (appEl && appEl.scrollHeight <= appEl.clientHeight + 200){
        loadDiscoverFullPage(key);
      }
    }, 60);
  }

  function initInfiniteScroll(){
    const app = document.getElementById('app');
    if(!app) return;
    
    app.addEventListener('scroll', () => {
      if (state.view !== 'discoverList') return;
      const key = state.discoverListKey;
      if (!key) return;

      const scrollTop = app.scrollTop;
      const scrollHeight = app.scrollHeight;
      const clientHeight = app.clientHeight;

      if (scrollTop + clientHeight >= scrollHeight - 300) {
        if (!state.discover.fullLoading[key] && !state.discover.fullDone[key]) {
          loadDiscoverFullPage(key);
        }
      }
    }, {passive: true});
  }

  function openDiscoverList(key){
    state.scrollPositions[state.view] = document.getElementById('app').scrollTop || 0;
    pushNav();
    state.discoverListKey = key;
    state.view = 'discoverList';
    render();
    document.getElementById('app').scrollTop = 0;
    if (!(state.discover.full[key] || []).length) loadDiscoverFullPage(key);
  }

  async function tmdbSearch(query, key){
    const data = await tmdbFetch('/search/multi?query=' + encodeURIComponent(query), key);
    let results = (data.results || [])
      .filter(r => r.media_type === 'movie' || r.media_type === 'tv')
      .slice(0, 10)
      .map(r => mapTmdbItem(r));
    
    results.sort((a, b) => (a.popularity || 0) - (b.popularity || 0));
    
    return results;
  }

  async function tmdbImages(tmdbId, mediaType, key){
    try{
      const kind = mediaType === 'tv' ? 'tv' : 'movie';
      const res = await fetch(TMDB_PROXY_BASE + '/' + kind + '/' + tmdbId + '/images?api_key=' + encodeURIComponent(key));
      const data = await res.json();
      const backdrops = data.backdrops || [];
      return backdrops.map(b => TMDB_IMG_PROXY_BASE + '/t/p/w780' + b.file_path);
    }catch(e){ return []; }
  }

  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Подгоняет размер картинки TMDB под реальный размер отображения — маленькие
  // карточки в сетке/рядах не нуждаются в w500, а полноразмерный w500 в 1.5-2 раза
  // тяжелее нужного и заметно замедляет первую отрисовку списков на мобильном интернете.
  // Для полноэкранных мест (хиро-баннер, фон детальной страницы) размер не трогаем.
  function tmdbImgSize(url, size){
    if (!url) return url;
    return url.replace(/\/t\/p\/(w\d+|original)\//, '/t/p/' + size + '/');
  }

  function openExternal(url){
    if (!url) return;
    if (tg && typeof tg.openLink === 'function'){
      try { tg.openLink(url, {try_instant_view:false}); return; } catch(e){}
    }
    window.open(url, '_blank', 'noopener');
  }

  function tierMeta(r){
    if (r == null) return null;
    if (r >= 1 && r <= 3) return {key:'poop', color:'#c9935a', iconName:'minimalPoop'};
    if (r <= 6) return {key:'pee', color:'#e8c94a', iconName:'minimalOkHand'};
    if (r <= 9) return {key:'green', color:'#34d399', iconName:'minimalThumbUp'};
    if (r === 10) return {key:'fire', color:'#ffb347', iconName:'minimalFire'};
    return null;
  }
  
  function ratingPill(m){
    if (m.myRating != null) {
      const t = tierMeta(m.myRating);
      if (!t) return '';
      let svgIcon = '';
      if (t.key === 'poop') svgIcon = icon('minimalPoop', 13);
      else if (t.key === 'pee') svgIcon = icon('minimalOkHand', 13);
      else if (t.key === 'green') svgIcon = icon('minimalThumbUp', 13);
      else if (t.key === 'fire') svgIcon = icon('minimalFire', 13);

      return '<div class="rating-pill" style="color:'+t.color+';">' + svgIcon + '<span>'+m.myRating+'</span></div>';
    } else if (m.voteAverage != null) {
      const formatted = m.voteAverage.toFixed(1);
      return '<div class="imdb-pill">' + icon('star', 13) + '<span>'+formatted+'</span></div>';
    }
    return '';
  }

  function genresOf(m){
    if (m.genres && m.genres.length) return m.genres;
    if (m.genre) return [m.genre];
    return [];
  }

  function card(m){
    const tier = (m.myRating != null) ? tierMeta(m.myRating) : null;
    const frameCls = 'poster-frame ' + (tier ? 'tier-'+tier.key : 'tier-none');
    const posterHtml = m.poster ? '<img class="poster" src="'+escapeHtml(tmdbImgSize(m.poster,'w342'))+'" alt="" loading="lazy" decoding="async" draggable="false" onerror="this.parentElement.innerHTML=\'<div class=&quot;poster&quot;>'+escapeHtml(m.title)+'</div>\'">' : '<div class="poster">'+escapeHtml(m.title)+'</div>';
    const typePill = m.type ? '<div class="type-pill">'+typeLabel(m.type)+'</div>' : '';
    const gArr = genresOf(m);
    const subLine = [typeLabel(m.type), gArr.slice(0,2).join(', ')].filter(Boolean).join(' · ');
    const noteMiniIcon = (m.myNote && m.myNote.trim()) ? '<span class="card-note-icon" title="Есть заметка">'+icon('pencil',11)+'</span>' : '';
    const caption = '<div class="poster-caption"><div class="card-title-row"><div class="card-title">'+escapeHtml(m.title)+'</div>'+noteMiniIcon+'</div>'+(subLine?'<div class="card-sub">'+escapeHtml(subLine)+'</div>':'')+'</div>';
    
    if (m._sourceType === 'tmdb') {
      return '<div class="card" data-discover-pick="'+m.tmdbId+'" data-discover-type="'+m.mediaType+'"><div class="'+frameCls+'">'+posterHtml+caption+'</div>'+typePill+ratingPill(m)+'</div>';
    }
    return '<div class="card" data-open="'+m.id+'"><div class="'+frameCls+'">'+posterHtml+caption+'</div>'+typePill+ratingPill(m)+'</div>';
  }

  function discoverCard(item){
    const isAlreadyAddedAnywhere = state.movies.some(x => x.tmdbId === item.tmdbId);
    const posterHtml = item.poster ? '<img class="poster" src="'+escapeHtml(tmdbImgSize(item.poster,'w342'))+'" alt="" loading="lazy" decoding="async" draggable="false" onerror="this.parentElement.innerHTML=\'<div class=&quot;poster&quot;>'+escapeHtml(item.title)+'</div>\'">' : '<div class="poster">'+escapeHtml(item.title)+'</div>';
    const typePill = '<div class="type-pill">'+(item.mediaType==='tv'?'Сериал':'Фильм')+'</div>';
    const caption = '<div class="poster-caption"><div class="card-title">'+escapeHtml(item.title)+'</div>'+(item.year?'<div class="card-sub">'+item.year+'</div>':'')+'</div>';
    const newBadge = item.isNew ? '<div class="new-badge">Новое</div>' : '';
    
    return '<div class="card" data-discover-pick="'+item.tmdbId+'" data-discover-type="'+item.mediaType+'">'
      + '<div class="poster-frame tier-none">'+posterHtml+caption+'</div>'
      + typePill
      + newBadge
      + ratingPill(item)
      + '<button type="button" class="search-fav-btn '+(isAlreadyAddedAnywhere?'active':'')+'" data-quick-fav="'+item.tmdbId+'" data-quick-type="'+item.mediaType+'" style="position:absolute;bottom:38px;right:8px;z-index:4;width:32px;height:32px;border-radius:50%;padding:0;" title="Выбрать категорию">'+icon('heart',15)+'</button>'
      + '</div>';
  }

  function getSimilarRecommendations(currentMovie) {
    let poolMap = new Map();
    state.movies.forEach(m => {
      if (m.id !== currentMovie.id && m.tmdbId !== currentMovie.tmdbId) {
        poolMap.set(m.id, { ...m, _sourceType: 'local' });
      }
    });
    Object.values(state.discover.cache).forEach(list => {
      if (Array.isArray(list)) {
        list.forEach(item => {
          if (item.tmdbId !== currentMovie.tmdbId) {
            poolMap.set('tmdb_' + item.mediaType + '_' + item.tmdbId, { ...item, id: 'tmdb_' + item.mediaType + '_' + item.tmdbId, _sourceType: 'tmdb' });
          }
        });
      }
    });

    let candidates = Array.from(poolMap.values());
    if (candidates.length === 0) return [];

    const curTitle = (currentMovie.title || '').toLowerCase();
    const curType = currentMovie.type || (currentMovie.mediaType === 'tv' ? 'series' : 'movie');
    const curGenres = genresOf(currentMovie).map(g => g.toLowerCase());
    const curProd = (currentMovie.producer || currentMovie.company || '').toLowerCase();

    candidates.forEach(item => {
      let score = 0;
      const itemTitle = (item.title || '').toLowerCase();
      const itemType = item.type || (item.mediaType === 'tv' ? 'series' : 'movie');
      const itemGenres = genresOf(item).map(g => g.toLowerCase());
      const itemProd = (item.producer || item.company || '').toLowerCase();

      if (curTitle && itemTitle) {
        if (itemTitle === curTitle) {
          score += 50;
        } else if (itemTitle.includes(curTitle) || curTitle.includes(itemTitle)) {
          score += 30;
        } else {
          const curWords = curTitle.split(/\s+/).filter(w => w.length > 2);
          const itemWords = itemTitle.split(/\s+/).filter(w => w.length > 2);
          let commonWords = curWords.filter(w => itemWords.includes(w));
          score += commonWords.length * 15;
        }
      }

      if (curType && itemType && curType === itemType) {
        score += 20;
      }

      if (curGenres.length > 0 && itemGenres.length > 0) {
        let matchedGenres = itemGenres.filter(g => curGenres.includes(g));
        score += matchedGenres.length * 10;
      }

      if (curProd && itemProd && (itemProd.includes(curProd) || curProd.includes(itemProd))) {
        score += 15;
      }

      score += (item.popularity || 0) / 1000;
      item._matchScore = score;
    });

    candidates.sort((a, b) => b._matchScore - a._matchScore);
    return candidates.slice(0, 10);
  }

  // Реальные похожие тайтлы из TMDB (recommendations + similar) — точнее локальной эвристики,
  // т.к. учитывает не только жанр/название, но и актёров, ключевые слова, сюжетную близость и т.д.
  // Пока идёт загрузка (или если у тайтла нет tmdbId), используется getSimilarRecommendations как мгновенный фолбэк.
  function similarCacheKey(m){
    return (m && m.tmdbId != null && m.mediaType) ? (m.mediaType + '_' + m.tmdbId) : null;
  }

  // Трейлер встраивается прямо на странице фильма через официальный YouTube IFrame Player API,
  // а не открывается наружу. Некоторые видео (особенно официальные трейлеры студий) имеют
  // встраивание отключено владельцем — плеер в таком случае отдаёт onError с кодом 101/150
  // ("ошибка 153" в UI YouTube). Поэтому храним НЕСКОЛЬКО видео-кандидатов на фильм и при
  // ошибке встраивания одного пробуем следующий; если ни один не встраивается — показываем
  // компактную карточку-заглушку со ссылкой "Смотреть на YouTube" вместо сломанного плеера.
  function trailerCacheKey(m){
    return (m && m.tmdbId != null && m.mediaType) ? (m.mediaType + '_' + m.tmdbId) : null;
  }

  async function loadTrailerForDetail(m){
    const key = trailerCacheKey(m);
    if (!key || Object.prototype.hasOwnProperty.call(state.trailerCache, key) || state.trailerLoading[key]) return;
    state.trailerLoading[key] = true;
    try{
      // TMDB по умолчанию отдаёт из /videos только ролики на языке запроса (у нас ru-RU) —
      // у многих фильмов (особенно не самых крупных) трейлер размечен только на английском
      // и без include_video_language просто не попадёт в выдачу. Расширяем языки явно.
      const data = await tmdbFetch('/' + m.mediaType + '/' + m.tmdbId + '/videos?include_video_language=en,ru,null', state.tmdbKey);
      const vids = (data && data.results) || [];
      const yt = vids.filter(v => v.site === 'YouTube' && v.key);
      const rank = v => (v.type === 'Trailer' ? 0 : v.type === 'Teaser' ? 1 : 2) - (v.official ? 0.5 : 0);
      yt.sort((a, b) => rank(a) - rank(b));
      const ids = [];
      yt.forEach(v => { if (ids.indexOf(v.key) === -1) ids.push(v.key); });
      state.trailerCache[key] = ids.slice(0, 5);
    }catch(e){
      state.trailerCache[key] = [];
    }
    state.trailerLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM && trailerCacheKey(curM) === key){
      renderTrailerSection();
    }
  }

  function trailerEmbedHtml(m){
    const key = trailerCacheKey(m);
    if (!key) return '';
    if (!Object.prototype.hasOwnProperty.call(state.trailerCache, key)){
      return '<div class="trailer-loading-standalone glass-flat">Загрузка трейлера…</div>';
    }
    const ids = state.trailerCache[key];
    // Даже когда TMDB не нашёл ни одного видео (бывает у менее популярных тайтлов),
    // всё равно показываем карточку — она откроет поиск по трейлеру на YouTube —
    // вместо того чтобы страница фильма молча оставалась без секции трейлера.
    if (!ids || !ids.length) return trailerFallbackHtml(m);
    return '<div class="trailer-embed-wrap"><div class="trailer-ratio" id="trailerPlayerHost" data-trailer-key="'+key+'"><div class="trailer-slot-loading">Загрузка трейлера…</div></div></div>';
  }

  function trailerFallbackHtml(m){
    const ids = state.trailerCache[trailerCacheKey(m)] || [];
    const firstId = ids[0];
    const url = firstId ? ('https://www.youtube.com/watch?v=' + firstId) : ('https://www.youtube.com/results?search_query=' + encodeURIComponent((m.title || '') + (m.year ? ' ' + m.year : '') + ' трейлер'));
    return '<div class="trailer-embed-wrap trailer-fallback glass-flat" id="trailerFallback">'
      + '<button type="button" class="secondary-btn glass-flat" id="trailerExternalBtn" data-url="'+escapeHtml(url)+'" style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;">'
      + icon('external', 16) + '<span>Смотреть трейлер на YouTube</span>'
      + '</button>'
      + '</div>';
  }

  // Пытаемся смонтировать плеер для очередного видео-кандидата по индексу idx; если у видео
  // отключено встраивание (или оно недоступно), YT.Player пришлёт onError — переходим к
  // следующему кандидату, а когда кандидаты закончились — заменяем плеер на фолбэк-ссылку.
  function mountTrailerPlayer(m){
    const key = trailerCacheKey(m);
    const ids = state.trailerCache[key];
    const host = document.getElementById('trailerPlayerHost');
    if (!host || !ids || !ids.length) return;
    if (host.getAttribute('data-mounted') === '1') return;
    host.setAttribute('data-mounted', '1');

    ensureYouTubeApi(() => {
      const hostNow = document.getElementById('trailerPlayerHost');
      if (!hostNow || hostNow.getAttribute('data-trailer-key') !== key) return;
      let idx = 0;
      let settled = false;
      let currentPlayer = null;
      function tryNext(){
        const h = document.getElementById('trailerPlayerHost');
        if (!h || h.getAttribute('data-trailer-key') !== key) return;
        if (idx >= ids.length){
          if (settled) return;
          settled = true;
          h.closest('.trailer-embed-wrap').outerHTML = trailerFallbackHtml(m);
          bindTrailerFallbackEvents();
          return;
        }
        const vid = ids[idx++];
        h.innerHTML = '<div class="trailer-slot-loading">Загрузка трейлера…</div>';
        const playerDiv = document.createElement('div');
        h.appendChild(playerDiv);
        try{
          currentPlayer = new YT.Player(playerDiv, {
            videoId: vid,
            playerVars: { playsinline: 1, rel: 0, autoplay: 1, mute: 1, controls: 0, disablekb: 1, modestbranding: 1 },
            events: {
              onReady: function(ev){
                settled = true;
                try{ ev.target.mute(); ev.target.playVideo(); }catch(e){}
                mountTrailerTapOverlay(h, ev.target, vid);
              },
              onError: function(){ tryNext(); }
            }
          });
        }catch(e){ tryNext(); }
      }
      tryNext();
    });
  }

  // Трейлер стартует автоматически, но без звука и без панели управления YouTube
  // (иначе браузеры/Telegram WebView блокируют автовоспроизведение со звуком, а
  // элементы управления зря отвлекают до того, как человек решил смотреть трейлер).
  // Поверх видео лежит невидимый прозрачный слой на весь трейлер — тап по видео
  // включает звук, а сам плеер пересоздаётся с обычной панелью управления YouTube
  // (controls нельзя переключить у живого плеера, поэтому он пересоздаётся на той
  // же секунде, где остановился).
  function mountTrailerTapOverlay(host, player, videoId){
    if (!host || host.querySelector('.trailer-tap-overlay')) return;
    const overlay = document.createElement('div');
    overlay.className = 'trailer-tap-overlay';
    host.appendChild(overlay);

    overlay.onclick = () => {
      let curTime = 0;
      try{ curTime = player.getCurrentTime() || 0; }catch(e){}
      try{ player.destroy(); }catch(e){}
      overlay.remove();
      host.innerHTML = '';
      const newDiv = document.createElement('div');
      host.appendChild(newDiv);
      try{
        new YT.Player(newDiv, {
          videoId: videoId,
          playerVars: { playsinline: 1, rel: 0, autoplay: 1, mute: 0, controls: 1, start: Math.floor(curTime) },
          events: {
            onReady: function(ev){
              try{ ev.target.unMute(); ev.target.setVolume(100); ev.target.playVideo(); }catch(e){}
            }
          }
        });
      }catch(e){}
    };
  }

  function bindTrailerFallbackEvents(){
    const btn = document.getElementById('trailerExternalBtn');
    if (btn){
      btn.onclick = () => { openExternal(btn.getAttribute('data-url')); };
    }
  }

  let ytApiLoading = false;
  let ytApiCallbacks = [];
  function ensureYouTubeApi(cb){
    if (window.YT && window.YT.Player){ cb(); return; }
    ytApiCallbacks.push(cb);
    if (ytApiLoading) return;
    ytApiLoading = true;
    const prevReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function(){
      if (typeof prevReady === 'function') { try{ prevReady(); }catch(e){} }
      const cbs = ytApiCallbacks; ytApiCallbacks = [];
      cbs.forEach(fn => { try{ fn(); }catch(e){} });
    };
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  }

  function renderTrailerSection(){
    const body = document.getElementById('trailerSectionBody');
    if (!body) return;
    const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (!m) return;
    body.innerHTML = trailerEmbedHtml(m);
    mountTrailerPlayer(m);
    bindTrailerFallbackEvents();
  }

  function getDisplaySimilarList(m){
    const key = similarCacheKey(m);
    if (key && state.similarCache[key]) return state.similarCache[key];
    return getSimilarRecommendations(m);
  }

  async function loadSimilarForDetail(m){
    const key = similarCacheKey(m);
    if (!key || state.similarCache[key] || state.similarLoading[key]) return;
    state.similarLoading[key] = true;
    try{
      const [rec, sim] = await Promise.all([
        tmdbFetch('/' + m.mediaType + '/' + m.tmdbId + '/recommendations', state.tmdbKey),
        tmdbFetch('/' + m.mediaType + '/' + m.tmdbId + '/similar', state.tmdbKey)
      ]);
      const seen = new Set();
      const merged = [];
      (rec.results || []).concat(sim.results || []).forEach(r => {
        if (r.id === m.tmdbId || seen.has(r.id)) return;
        seen.add(r.id);
        const mapped = mapTmdbItem(r, m.mediaType);
        mapped._sourceType = 'tmdb';
        merged.push(mapped);
      });
      merged.sort((a, b) => (b.popularity || 0) - (a.popularity || 0));
      state.similarCache[key] = merged.slice(0, 10);
    }catch(e){
      // при ошибке оставляем ключ незаполненным — так и дальше будет использоваться локальный фолбэк
    }
    state.similarLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM && similarCacheKey(curM) === key){
      renderSimilarSection();
    }
  }

  // Число сезонов есть только в полном ответе /tv/{id}, поэтому у тайтлов, сохранённых
  // до появления этого поля (или добавленных иным путём), его может не быть — подгружаем
  // один раз при открытии карточки и дописываем в сохранённые данные, чтобы больше не запрашивать.
  async function loadSeasonInfoForDetail(m){
    if (!m || m.mediaType !== 'tv' || m.numberOfSeasons != null || !m.tmdbId) return;
    const key = 'season_' + m.tmdbId;
    if (!state.seasonLoading) state.seasonLoading = {};
    if (state.seasonLoading[key]) return;
    state.seasonLoading[key] = true;
    try{
      const data = await tmdbFetch('/tv/' + m.tmdbId, state.tmdbKey);
      m.numberOfSeasons = typeof data.number_of_seasons === 'number' ? data.number_of_seasons : null;
      m.numberOfEpisodes = typeof data.number_of_episodes === 'number' ? data.number_of_episodes : null;
      const isSaved = state.movies.some(x => x.id === m.id);
      if (isSaved && m.numberOfSeasons != null) await updateMovie(m);
    }catch(e){
      // не удалось получить — просто не покажем блок сезонов
    }
    state.seasonLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM === m) renderDetailMetaRow();
  }

  // Скриншоты (backdrops) раньше проставлялись только в момент добавления фильма в
  // коллекцию — у всего, что было сохранено до появления этой фичи (или как-то иначе,
  // в обход mapTmdbItem-флоу), поле screenshots просто отсутствует, и блок с картинками
  // молча не рендерится. Как и с сезонами — подгружаем один раз при открытии карточки
  // и дописываем в сохранённые данные, чтобы больше не запрашивать при следующих открытиях.
  function screenshotsInnerHtml(m){
    if (!m.screenshots || !m.screenshots.length) return '';
    return '<div class="movie-screenshots-scroll">' + m.screenshots.map((imgUrl, idx) =>
      '<div class="movie-screenshot-item" data-fullscreen-index="'+idx+'"><img src="'+escapeHtml(imgUrl)+'" loading="lazy" draggable="false"></div>'
    ).join('') + '</div>';
  }

  async function loadScreenshotsForDetail(m){
    if (!m || !m.tmdbId || (m.screenshots && m.screenshots.length > 0)) return;
    const key = 'shots_' + m.tmdbId;
    if (!state.screenshotsLoading) state.screenshotsLoading = {};
    if (state.screenshotsLoading[key]) return;
    state.screenshotsLoading[key] = true;
    try{
      const backdrops = await tmdbImages(m.tmdbId, m.mediaType, state.tmdbKey);
      m.screenshots = backdrops.slice(0, 6);
      const isSaved = state.movies.some(x => x.id === m.id);
      if (isSaved && m.screenshots.length > 0) await updateMovie(m);
    }catch(e){
      // не удалось получить — блок просто останется пустым
    }
    state.screenshotsLoading[key] = false;
    const curM = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (state.view === 'detail' && curM === m) renderScreenshotsSection();
  }

  function renderScreenshotsSection(){
    const el = document.getElementById('detailScreenshotsBody');
    if (!el) return;
    const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (!m) return;
    el.innerHTML = screenshotsInnerHtml(m);
    // У старых сохранённых фильмов (без поля backdrop) широкий кадр на ПК
    // изначально нечем показать — доставляем его сюда же, как только
    // подтянулись скриншоты.
    const heroBg = document.querySelector('.detail-hero-bg');
    if (heroBg && !document.getElementById('detailHeroWide')){
      const heroWideSrc = m.backdrop || (m.screenshots && m.screenshots[0]) || '';
      const gradientEl = heroBg.querySelector('.detail-hero-gradient');
      const wideHtml = heroWideCardHtml(m, heroWideSrc);
      if (wideHtml && gradientEl){
        gradientEl.insertAdjacentHTML('beforebegin', wideHtml);
      }
    }
    // bindEvents() навешивает клик на .movie-screenshot-item при каждом полном render();
    // здесь мы обновили блок точечно (без полного render), поэтому перевызываем bindEvents(),
    // чтобы новые элементы (созданные заново через innerHTML) тоже получили обработчик —
    // сама функция уже устроена так, что безопасно вызывается повторно (это происходит
    // и при обычной навигации между экранами).
    bindEvents();
  }

  function renderDetailMetaRow(){
    const el = document.getElementById('detailMetaRow');
    if (!el) return;
    const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (!m) return;
    const genreStr = genresOf(m).join('  ');
    const yearStr = m.year ? m.year : '';
    const typeStr = typeLabel(m.type) || (m.mediaType === 'tv' ? 'Сериал' : 'Фильм');
    const seasonsStr = m.mediaType === 'tv' ? seasonsLabel(m.numberOfSeasons) : '';
    el.innerHTML = (genreStr ? '<span>'+escapeHtml(genreStr)+'</span>' : '')
      + (yearStr ? '<span>'+escapeHtml(yearStr)+'</span>' : '')
      + (typeStr ? '<span>'+escapeHtml(typeStr)+'</span>' : '')
      + (seasonsStr ? '<span>'+escapeHtml(seasonsStr)+'</span>' : '');
  }

  function bindSimilarSectionEvents(container){
    container.querySelectorAll('[data-discover-pick]').forEach(el => {
      el.onclick = () => previewTmdb(el.getAttribute('data-discover-pick'), el.getAttribute('data-discover-type'));
    });
    container.querySelectorAll('[data-open]').forEach(el => {
      el.onclick = () => openMovie(el.getAttribute('data-open'));
    });
  }

  function renderSimilarSection(){
    const body = document.getElementById('similarSectionBody');
    if (!body) return;
    const m = state.movies.find(x => x.id === state.detailId) || state.previewItem;
    if (!m) return;
    const list = getDisplaySimilarList(m);
    body.innerHTML = list.length ? list.map(card).join('') : '<div class="empty glass-flat" style="margin:0 16px;">Похожего не найдено.</div>';
    bindSimilarSectionEvents(body);
  }

  function sectionIcon(name, color){ 
    return '<span class="ic" style="color:'+(color || 'var(--accent)')+';">'+icon(name,17)+'</span>'; 
  }

  function getSortedMoviesByStatus(status) {
    const list = state.movies.filter(m => movieInCat(m, status));
    return list.sort((a, b) => {
      const at = (a.catAddedAt && a.catAddedAt[status]) || a.addedAt || 0;
      const bt = (b.catAddedAt && b.catAddedAt[status]) || b.addedAt || 0;
      return bt - at;
    });
  }

  function viewHome(){
    let html = '<div class="topbar"><div class="netflix-brand"><div class="netflix-logo compact">МОИ КАТЕГОРИИ</div></div></div>';
    state.categories.forEach(s => {
      const list = getSortedMoviesByStatus(s.v);
      html += '<div class="section" data-cat-section="'+s.v+'"><div class="section-head" data-cat="'+s.v+'"><div class="section-title">'+sectionIcon(s.icon, s.color)+escapeHtml(s.l)+(s.shared ? ' <span style="opacity:.55;display:inline-flex;vertical-align:middle;margin-left:2px;">'+icon('users',13)+'</span>' : '')+'</div><div class="section-count">'+list.length+icon('chevron',12)+'</div></div>';
      html += list.length ? '<div class="row-scroll">'+list.map(card).join('')+'</div>' : '<div class="empty glass-flat">Пусто. Найди фильм на вкладке «Поиск» и нажми на сердечко.</div>';
      html += '</div>';
    });
    html += '<button class="secondary-btn glass-flat add-cat-btn" id="addCategoryBtn">'+icon('plus',16)+'Добавить категорию</button>';
    return html;
  }

  function viewCategory(){
    const s = categoryMeta(state.categoryFilter);
    const list = getSortedMoviesByStatus(state.categoryFilter);
    const isShared = !!s.shared;
    let html = '<div class="subbar"><button class="icon-btn glass-flat" id="backBtn">'+icon('back',18)+'</button><div class="subtitle" style="display:flex;align-items:center;gap:8px;"><span style="color:'+(s.color||'var(--accent)')+';display:flex;">'+icon(s.icon,20)+'</span><span>'+escapeHtml(s.l)+'</span>'+(isShared ? '<span style="opacity:.55;display:flex;">'+icon('users',14)+'</span>' : '')+'</div>'
      + (isShared ? '<button class="icon-btn glass-flat" id="refreshSharedBtn" style="margin-left:auto;">'+icon('sync',17)+'</button>' : '')
      + '<button class="icon-btn glass-flat" id="editCatBtn" style="margin-left:'+(isShared?'6px':'auto')+';">'+icon('pencil',18)+'</button></div>';
    html += list.length
      ? '<div class="movies-grid">'+list.map(card).join('')+'</div>'
      : '<div class="empty glass-flat" style="margin-top:16px;">Пусто. Найди фильм на вкладке «Поиск» и нажми на сердечко.</div>';
    return html;
  }

  function renderTmdbResults(list){
    if (!list.length) return '<div style="font-size:12.5px;color:var(--ink-faint);padding:6px 10px;">Ничего не нашлось.</div>';
    return '<div style="display:flex;flex-direction:column;gap:8px;">' + list.map(item => {
      const isAlreadyAddedAnywhere = state.movies.some(x => x.tmdbId === item.tmdbId);
      return '<button type="button" class="choose-btn search-result-glass" data-tmdb-preview="'+item.tmdbId+'" data-tmdb-type="'+item.mediaType+'" style="padding:10px;text-align:left;display:flex;align-items:center;position:relative;">'
      + (item.poster ? '<img src="'+escapeHtml(tmdbImgSize(item.poster,'w185'))+'" loading="lazy" decoding="async" style="width:42px;height:63px;object-fit:cover;border-radius:8px;flex:0 0 auto;">' : '<div style="width:42px;height:63px;border-radius:8px;background:var(--glass);flex:0 0 auto;"></div>')
      + '<div class="choose-text" style="flex:1;margin-left:12px;"><div class="t1" style="font-size:14px;">'+escapeHtml(item.title)+'</div><div class="t2">'+escapeHtml(item.year||'')+(item.mediaType==='tv'?' · Сериал':' · Фильм')+'</div></div>'
      + '<div class="search-fav-btn '+(isAlreadyAddedAnywhere?'active':'')+'" data-quick-fav="'+item.tmdbId+'" data-quick-type="'+item.mediaType+'" title="Выбрать категорию" style="width:38px;height:38px;border-radius:50%;">'+icon('heart',18)+'</div>'
      + '</button>';
    }).join('') + '</div>';
  }

  // Точечное обновление дропдауна результатов поиска без перерисовки всей страницы.
  // Так input с фокусом не пересоздаётся при каждом кейстроке — фокус и курсор сохраняются,
  // и вкладка не "прыгает" (например, пробел в конце слова случайно активирует другую кнопку из-за потери фокуса).
  function bindSearchDropdownEvents(container){
    container.querySelectorAll('[data-tmdb-preview]').forEach(btn => {
      btn.onclick = e => {
        if (e.target.closest('[data-quick-fav]')) return;
        previewTmdb(btn.getAttribute('data-tmdb-preview'), btn.getAttribute('data-tmdb-type'));
      };
    });
    container.querySelectorAll('[data-quick-fav]').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const tmdbId = btn.getAttribute('data-quick-fav');
        const mediaType = btn.getAttribute('data-quick-type');
        const existing = state.movies.find(x => x.tmdbId === Number(tmdbId) || x.tmdbId === tmdbId);
        if (existing) {
          deleteMovie(existing.id).then(() => {
            state.movies = state.movies.filter(x => x.id !== existing.id);
            renderSearchDropdown();
          });
        } else {
          openChooseForTmdb(tmdbId, mediaType);
        }
      };
    });
  }

  // Блюр фонового контента вкладки "Поиск", пока строка поиска в фокусе или что-то введено,
  // и выход из поиска по тапу вне зоны поиска. Блюрится #searchBgContent (топбар + подборки)
  // И нижние кнопки Главная/Поиск (.nav) — строка поиска и список результатов остаются
  // не заблюренными и кликабельными. Пока блюр активен, тап в любом другом месте экрана
  // не доходит до своей обычной цели (не открывает карточку, не переключает вкладку и т.д.),
  // а просто закрывает поиск.
  //
  // ВАЖНО про порядок событий: тап по карточке вне поля ввода сначала снимает фокус
  // с этого поля (событие blur у input срабатывает раньше click), а onblur сбрасывает
  // searchFocused. Поэтому проверять searchShouldBlur() в обработчике click — уже поздно:
  // на момент click состояние успевает "разблюриться" и клик по карточке проходит.
  // Решение — перехватывать на touchstart/mousedown (в фазе capture, ДО того как браузер
  // вообще обработает смену фокуса), там же сразу гасить событие и выходить из поиска.
  // Обработчик click оставлен вторым эшелоном на случай активации без mousedown/touchstart
  // (например, Enter с клавиатуры на сфокусированном элементе).
  let searchFocused = false;

  function searchShouldBlur(){
    return state.view === 'search' && (searchFocused || !!(state.tmdbQuery && state.tmdbQuery.trim()));
  }

  function syncSearchBlur(){
    const bg = document.getElementById('searchBgContent');
    const shouldBlur = searchShouldBlur();
    if (bg) bg.classList.toggle('search-bg-blurred', shouldBlur);
    const app = document.getElementById('app');
    if (app) app.classList.toggle('search-scroll-locked', shouldBlur);
    const navEl = document.querySelector('.nav');
    if (navEl) navEl.classList.toggle('search-bg-blurred', shouldBlur);
  }

  // Разрешённые зоны, тап по которым НЕ закрывает поиск: сама строка поиска
  // (с кнопкой очистки и т.д.) и список результатов/вариантов под ней.
  function isInsideSearchAllowedArea(target){
    return !!target.closest('.search-bar-bottom, #searchResultsDropdownContainer');
  }

  function handleGlobalSearchBlurIntercept(e){
    if (!searchShouldBlur()) return;
    if (isInsideSearchAllowedArea(e.target)) return;
    e.stopPropagation();
    if (e.cancelable) e.preventDefault();
    exitSearch();
  }

  function handleGlobalSearchBlurTouchMove(e){
    if (!searchShouldBlur()) return;
    if (isInsideSearchAllowedArea(e.target)) return;
    e.preventDefault();
  }

  // Вешаем один раз на весь документ в фазе capture — так перехватываются тапы
  // по любому элементу под блюром (нав, топбар, подборки), не только по контейнеру
  // фона поиска, который каждый render() пересоздаётся заново.
  function initSearchBlurGlobalGuard(){
    document.addEventListener('touchstart', handleGlobalSearchBlurIntercept, { capture:true, passive:false });
    document.addEventListener('mousedown', handleGlobalSearchBlurIntercept, true);
    document.addEventListener('click', handleGlobalSearchBlurIntercept, true);
    document.addEventListener('touchmove', handleGlobalSearchBlurTouchMove, { capture:true, passive:false });
  }

  function exitSearch(){
    state.tmdbQuery = '';
    state.tmdbResults = null;
    searchFocused = false;
    const qInput = document.getElementById('tmdbQueryBottom');
    if (qInput) qInput.blur();
    renderSearchDropdown();
    syncSearchBlur();
  }

  function renderSearchDropdown(){
    const bar = document.querySelector('.search-bar-bottom');
    if (!bar || !bar.parentNode) return false;
    const searching = state.tmdbQuery && state.tmdbQuery.trim();
    let container = document.getElementById('searchResultsDropdownContainer');
    if (!searching){
      if (container) container.remove();
      syncSearchBlur();
      return true;
    }
    if (!container){
      container = document.createElement('div');
      container.id = 'searchResultsDropdownContainer';
      container.className = 'search-results-dropdown';
      bar.parentNode.insertBefore(container, bar);
    }
    container.innerHTML = state.tmdbResults
      ? renderTmdbResults(state.tmdbResults)
      : '<div style="font-size:13px;color:var(--ink-faint);padding:8px;text-align:center;">Ищу…</div>';
    bindSearchDropdownEvents(container);
    syncSearchBlur();
    return true;
  }

  function bindDiscoverRowEvents(container){

        const mediaType = btn.getAttribute('data-quick-type');

    });

  function openYearFilterModal(key){
    const currentYear = new Date().getFullYear();
    const years = [];
    for (let y = currentYear + 5; y >= currentYear - 60; y--) years.push(y);

    const div = document.createElement('div');
    div.className = 'modal-overlay';
    div.innerHTML = '<div class="modal">'
      + '<div class="modal-title">Год выпуска</div>'
      + '<div class="field" style="margin-top:10px;"><label>Крути колесо ниже или введи год вручную</label>'
      +   '<input id="yearFilterInput" type="number" placeholder="Например: 2021" inputmode="numeric" min="1900" max="'+(currentYear+5)+'" style="margin-top:6px;padding:11px 13px;font-size:14px;">'
      + '</div>'
      + '<div class="year-wheel-wrap">'
      +   '<div class="year-wheel-indicator"></div>'
      +   '<div class="year-wheel" id="yearWheel">'
      +     years.map(y => '<div class="year-wheel-item" data-wheel-year="'+y+'">'+y+'</div>').join('')
      +   '</div>'
      + '</div>'
      + '<div class="modal-actions" style="margin-top:14px;">'
      +   '<button type="button" class="primary-btn" id="yearApplyBtn" style="margin-top:0;padding:13px;display:flex;align-items:center;justify-content:center;gap:7px;">'+icon('check',16)+'<span>Применить</span></button>'
      + '</div>'
      + '</div>';
    document.body.appendChild(div);
    div.onclick = e => { if (e.target === div) div.remove(); };

    const wheel = div.querySelector('#yearWheel');
    const items = Array.from(wheel.querySelectorAll('.year-wheel-item'));
    const currentIdx = years.indexOf(currentYear);

    const markCenterActive = () => {
      const center = wheel.scrollTop + wheel.clientHeight / 2;
      let closestIdx = 0, closestDist = Infinity;
      items.forEach((it, i) => {
        const itemCenter = it.offsetTop + it.offsetHeight / 2;
        const dist = Math.abs(itemCenter - center);
        if (dist < closestDist){ closestDist = dist; closestIdx = i; }
      });
      items.forEach((it, i) => it.classList.toggle('center-active', i === closestIdx));
      return closestIdx;
    };

    // При каждом открытии колесо всегда стартует с текущего года, а не с ранее выбранного.
    requestAnimationFrame(() => {
      if (currentIdx > -1 && items[currentIdx]){
        wheel.scrollTop = items[currentIdx].offsetTop - (wheel.clientHeight / 2 - items[currentIdx].offsetHeight / 2);
      }
      markCenterActive();
    });

    // Скролл (пальцем, тачпадом или колёсиком мыши) только подсвечивает год по центру —
    // применяется он только по нажатию общей кнопки "Применить", без авто-закрытия.
    wheel.addEventListener('scroll', () => { markCenterActive(); }, { passive: true });

    // Прокрутка колёсиком мыши/трекпада — листаем список по одному году за "тик",
    // с плавной анимацией, как будто крутишь настоящее колесо выбора.
    let wheelBusy = false;
    wheel.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (wheelBusy) return;
      wheelBusy = true;
      const itemH = items[0].offsetHeight;
      const dir = e.deltaY > 0 ? 1 : -1;
      wheel.scrollBy({ top: dir * itemH, behavior: 'smooth' });
      setTimeout(() => { wheelBusy = false; }, 110);
    }, { passive: false });

    items.forEach(it => {
      it.onclick = () => { it.scrollIntoView({ behavior: 'smooth', block: 'center' }); };
    });

    // Общая кнопка "Применить": если в поле введён год вручную — берём его,
    // иначе — год, выбранный прокруткой колеса (по центру).
    const input = div.querySelector('#yearFilterInput');
    const applyYear = () => {
      const raw = input.value.trim();
      const val = raw ? parseInt(raw, 10) : NaN;
      const year = (raw && !isNaN(val)) ? val : years[markCenterActive()];
      const f2 = getDiscoverFilters(key);
      f2.year = year;
      div.remove();
      applyDiscoverFilterChange(key);
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter'){ applyYear(); }
    });
    div.querySelector('#yearApplyBtn').onclick = applyYear;
  }

  function searchBarBottomHtml(){
