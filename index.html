          <div style="margin-top:12px;" class="field">
            <label>Название</label>
            <input id="modalCatName" value="${escapeHtml(catName)}" placeholder="Например: Любимое аниме">
          </div>
          <div style="margin-top:10px;" class="field">
            <label>Подзаголовок</label>
            <input id="modalCatSub" value="${escapeHtml(catSub)}" placeholder="Например: Топовые тайтлы">
          </div>
          <div style="margin-top:12px;" class="field">
            <label>Цвет</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
              ${CAT_COLOR_PALETTE.map(c => `
                <button type="button" class="cat-color-opt" data-color="${c}" style="width:32px;height:32px;border-radius:50%;background:${c};border:${selectedColor===c?'2px solid #fff':'none'};cursor:pointer;"></button>
              `).join('')}
            </div>
          </div>
          <div style="margin-top:12px;" class="field">
            <label>Иконка</label>
            <div class="cat-icon-grid">
              ${CAT_ICON_OPTIONS.concat(isShared ? ['users'] : []).map(iName => `
                <button type="button" class="cat-icon-opt ${selectedIcon===iName?'active':''}" data-icon-opt="${iName}">
                  ${icon(iName, 20)}
                </button>
              `).join('')}
            </div>
          </div>
          <div class="modal-actions" style="margin-top:16px;display:flex;gap:8px;">
            <button type="button" class="secondary-btn glass-flat" id="modalCatCancel">Отмена</button>
            <button type="button" class="primary-btn" id="modalCatSave" style="margin-top:0;">Сохранить</button>
          </div>
          ${isEdit ? '<button type="button" class="danger-btn" id="modalCatDelete" style="margin-top:10px;width:100%;">'+(isShared ? 'Покинуть категорию' : 'Удалить категорию')+'</button>' : ''}
        </div>
      `;

      div.querySelectorAll('[data-color]').forEach(btn => {
        btn.onclick = () => {
          const nameEl = div.querySelector('#modalCatName');
          const subEl = div.querySelector('#modalCatSub');
          if (nameEl) catName = nameEl.value;
          if (subEl) catSub = subEl.value;
          selectedColor = btn.getAttribute('data-color');
          renderModalInner();
        };
      });

      div.querySelectorAll('[data-icon-opt]').forEach(btn => {
        btn.onclick = () => {
          const nameEl = div.querySelector('#modalCatName');
          const subEl = div.querySelector('#modalCatSub');
          if (nameEl) catName = nameEl.value;
          if (subEl) catSub = subEl.value;
          selectedIcon = btn.getAttribute('data-icon-opt');
          renderModalInner();
        };
      });

      div.querySelector('#modalCatCancel').onclick = () => div.remove();

      if (isEdit && isShared){
        const copyBtn = div.querySelector('#modalCatCopyCode');
        if (copyBtn) copyBtn.onclick = async () => {
          const ok = await copyTextToClipboard(shareCode);
          if (ok){ hapticOk(); customAlert('Код скопирован: ' + shareCode); } else { customAlert('Не получилось скопировать. Код: ' + shareCode); }
        };
      }
      
      div.querySelector('#modalCatSave').onclick = async () => {
        const nameInput = div.querySelector('#modalCatName');
        const subInput = div.querySelector('#modalCatSub');
        const newName = nameInput.value.trim();
        if (!newName) { customAlert('Введи название категории.'); return; }
        
        if (isEdit){
          catToEdit.l = newName;
          catToEdit.sub = subInput.value.trim();
          catToEdit.icon = selectedIcon;
          catToEdit.color = selectedColor;
          await STORAGE.saveCategories(state.categories);
          if (isShared) fbSet('shared/'+catToEdit.code+'/meta', { l: catToEdit.l, sub: catToEdit.sub, icon: catToEdit.icon, color: catToEdit.color });
          div.remove();
          render();
        } else if (isShared){
          if (!sharedBackendReady()){ customAlert('Совместные категории пока не настроены разработчиком приложения.'); return; }
          const saveBtn = div.querySelector('#modalCatSave');
          saveBtn.textContent = 'Создаю...';
          const code = genShareCode();
          const newCat = { v:'shared_'+code, l:newName, sub: subInput.value.trim(), icon: selectedIcon, color: selectedColor, shared:true, code:code };
          const metaOk = await fbSet('shared/'+code+'/meta', { l:newCat.l, sub:newCat.sub, icon:newCat.icon, color:newCat.color });
          if (!metaOk){ customAlert('Не удалось создать совместную категорию. Проверь интернет-соединение и попробуй снова.'); saveBtn.textContent = 'Сохранить'; return; }
          state.categories.push(newCat);
          await STORAGE.saveCategories(state.categories);
          div.remove();
          render();
          openShareCodeModal(code, newCat.l);
        } else {
          const newV = makeLocalId('cat');
          state.categories.push({
            v: newV,
            l: newName,
            sub: subInput.value.trim(),
            icon: selectedIcon,
            color: selectedColor
          });
          await STORAGE.saveCategories(state.categories);
          div.remove();
          render();
        }
      };

      if (isEdit) {
        div.querySelector('#modalCatDelete').onclick = async () => {
          if (state.categories.length <= 1) {
            customAlert('Нельзя удалить последнюю категорию.');
            return;
          }
          state.categories = state.categories.filter(c => c.v !== catToEdit.v);
          await STORAGE.saveCategories(state.categories);
          if (isShared){
            const affected = state.movies.filter(m => movieInCat(m, catToEdit.v));
            for (const m of affected){
              m.categories = (m.categories||[]).filter(c => c !== catToEdit.v);
              if (m.categories.length) await STORAGE.saveMovie(m);
              else await STORAGE.deleteMovie(m.id);
            }
            state.movies = state.movies.filter(m => m.categories && m.categories.length);
          }
          state.view = 'home';
          div.remove();
          render();
        };
      }
    };

    renderModalInner();
    document.body.appendChild(div);
  }

  // ===== Долгое нажатие на постер (в любом разделе): мини-карточка + выбор категории через сердечко =====

  let lpState = null;
  let lpSuppressClicksUntil = 0;
  let lpLastTouchTs = 0;

  function lpResolveRef(cardEl){
    if (cardEl.hasAttribute('data-open')){
      const id = cardEl.getAttribute('data-open');
      if (!state.movies.some(x => x.id === id)) return null;
      return { kind:'library', id:id };
    }
    if (cardEl.hasAttribute('data-discover-pick')){
      const tmdbId = cardEl.getAttribute('data-discover-pick');
      const mediaType = cardEl.getAttribute('data-discover-type');
      // Если фильм из поиска/discover уже сохранён в библиотеке (есть в какой-то категории),
      // резолвим его как library-ссылку, чтобы сердечко в мини-карточке закрашивалось
      // и корзина для удаления работала как для обычных карточек библиотеки.
      const existing = state.movies.find(x => String(x.tmdbId) === String(tmdbId));
      if (existing) return { kind:'library', id: existing.id };
      return { kind:'tmdb', tmdbId, mediaType };
    }
    return null;
  }

  function lpExtractVisual(cardEl){
    const posterAttr = cardEl.getAttribute('data-poster-src');
    const imgEl = cardEl.querySelector('img.poster, img.hero-banner-img');
    const posterSrc = posterAttr || (imgEl ? imgEl.getAttribute('src') : '');
    const titleEl = cardEl.querySelector('.card-title, .hero-banner-title');
    const title = titleEl ? titleEl.textContent : '';
    const pillEl = cardEl.querySelector('.rating-pill, .imdb-pill');
    const pillHtml = pillEl ? pillEl.outerHTML : '';
    return { posterSrc, title, pillHtml };
  }

  function lpStartPress(cardEl, x, y){
    lpAbort();
    const ref = lpResolveRef(cardEl);
    if (!ref) return;
    lpState = {
      cardEl, ref, startX:x, startY:y, active:false, timer:null,
      overlayEl:null, cardEl2:null, heartEl:null, panelEl:null, trashEl:null,
      heartRect:null, trashRect:null, catRects:[], highlightedCatIndex:-1, panelVisible:false, trashHover:false
    };
    lpState.timer = setTimeout(lpActivate, 600);
  }

  function lpActivate(){
    if (!lpState) return;
    const cardEl = lpState.cardEl;
    const rect = cardEl.getBoundingClientRect();
    const visual = lpExtractVisual(cardEl);
    lpState.active = true;
    hapticSelect();

    const overlay = document.createElement('div');
    overlay.className = 'lp-overlay';
    document.body.appendChild(overlay);

    const vw = window.innerWidth, vh = window.innerHeight;
    const targetW = Math.min(228, vw * 0.6);
    const targetH = targetW * 1.5;
    const targetLeft = (vw - targetW) / 2;
    const targetTop = Math.max(20, vh * 0.15);

    const preview = document.createElement('div');
    preview.className = 'lp-card';
    preview.style.left = rect.left + 'px';
    preview.style.top = rect.top + 'px';
    preview.style.width = rect.width + 'px';
    preview.style.height = rect.height + 'px';
    preview.innerHTML =
      (visual.posterSrc ? '<img class="lp-card-img" src="'+escapeHtml(visual.posterSrc)+'">' : '<div class="lp-card-noimg">'+escapeHtml(visual.title)+'</div>')
      + '<div class="lp-card-caption"><div class="lp-card-title">'+escapeHtml(visual.title)+'</div></div>'
      + visual.pillHtml;
    document.body.appendChild(preview);

    // Мусорка показывается только для фильмов, уже находящихся в какой-то категории
    // (то есть уже сохранённых в библиотеке) — у элементов discover/tmdb статуса ещё нет.
    const showTrash = lpState.ref && lpState.ref.kind === 'library';
    const btnGap = 16;
    const heartTop = targetTop + targetH + 22;
    const pairWidth = showTrash ? (54 + btnGap + 54) : 54;
    const pairLeft = vw/2 - pairWidth/2;
    const heartLeft = pairLeft;
    const trashLeft = pairLeft + 54 + btnGap;

    const heart = document.createElement('div');
    heart.className = 'lp-heart' + (showTrash ? ' lp-heart-filled' : '');
    heart.style.left = heartLeft + 'px';
    heart.style.top = heartTop + 'px';
    heart.innerHTML = icon('heart', 22);
    document.body.appendChild(heart);

    lpState.overlayEl = overlay;
    lpState.cardEl2 = preview;
    lpState.heartEl = heart;
    lpState.heartRect = { left:heartLeft, top:heartTop, width:54, height:54 };

    let trash = null;
    if (showTrash){
      trash = document.createElement('div');
      trash.className = 'lp-trash';
      trash.style.left = trashLeft + 'px';
      trash.style.top = heartTop + 'px';
      trash.innerHTML = icon('trash', 20);
      document.body.appendChild(trash);
      lpState.trashEl = trash;
      lpState.trashRect = { left:trashLeft, top:heartTop, width:54, height:54 };
    }

    requestAnimationFrame(() => {
      overlay.classList.add('show');
      preview.style.left = targetLeft + 'px';
      preview.style.top = targetTop + 'px';
      preview.style.width = targetW + 'px';
      preview.style.height = targetH + 'px';
      preview.classList.add('grown');
      heart.classList.add('show');
      if (trash) trash.classList.add('show');
    });
  }

  function lpOwnedCategories(){
    if (!lpState || !lpState.ref || lpState.ref.kind !== 'library') return [];
    const m = state.movies.find(x => x.id === lpState.ref.id);
    return (m && Array.isArray(m.categories)) ? m.categories : [];
  }

  function lpOpenCatPanel(){
    if (!lpState || lpState.panelEl) return;
    const owned = lpOwnedCategories();
    const panel = document.createElement('div');
    panel.className = 'lp-cat-panel';
    panel.innerHTML = state.categories.map((c,i) =>
      '<div class="lp-cat-chip'+(owned.indexOf(c.v)!==-1?' owned':'')+'" data-cat-idx="'+i+'">'
      + '<div class="lp-cat-chip-icon" style="background:'+(c.color||'var(--accent)')+';">'+icon(c.icon,18)+'</div>'
      + '<div class="lp-cat-chip-label">'+escapeHtml(c.l)+'</div>'
      + '</div>'
    ).join('');
    const hr = lpState.heartRect;
    const minTop = hr.top + hr.height + 16;
    panel.style.left = '50%';
    panel.style.top = minTop + 'px';
    document.body.appendChild(panel);
    lpState.panelEl = panel;

    const measure = () => {
      if (!lpState || lpState.panelEl !== panel) return;
      // Если панель не помещается по высоте до низа экрана — сдвигаем её выше, но не выше сердечка.
      const h = panel.getBoundingClientRect().height;
      const maxTop = window.innerHeight - h - 16;
      panel.style.top = Math.min(minTop, maxTop) + 'px';
      lpState.catRects = Array.from(panel.querySelectorAll('.lp-cat-chip')).map(el => el.getBoundingClientRect());
    };
    requestAnimationFrame(() => { panel.classList.add('show'); measure(); });
    setTimeout(measure, 220);
    lpState.panelVisible = true;
  }

  function lpMove(x, y){
    if (!lpState) return;
    if (!lpState.active){
      if (Math.hypot(x - lpState.startX, y - lpState.startY) > 14) lpAbort();
      return;
    }
    const hr = lpState.heartRect;
    const pad = 18;
    const overHeart = hr && x > hr.left-pad && x < hr.left+hr.width+pad && y > hr.top-pad && y < hr.top+hr.height+pad;

    let overPanel = false;
    if (lpState.panelEl){
      const pr = lpState.panelEl.getBoundingClientRect();
      overPanel = x > pr.left-6 && x < pr.right+6 && y > pr.top-6 && y < pr.bottom+6;
    }

    if (overHeart){
      lpState.heartEl.classList.add('hover');
      if (!lpState.panelEl){
        hapticSelect();
        lpOpenCatPanel();
      } else if (!lpState.panelVisible){
        hapticSelect();
        lpState.panelEl.classList.add('show');
        lpState.panelVisible = true;
      }
    } else if (!overPanel && lpState.panelVisible){
      // Палец отвели с сердечка обратно на постер (или мимо панели) — прячем панель категорий,
      // пока пользователь снова не наведётся на сердечко.
      lpState.heartEl.classList.remove('hover');
      lpState.panelEl.classList.remove('show');
      lpState.panelVisible = false;
      lpState.highlightedCatIndex = -1;
      lpState.panelEl.querySelectorAll('.lp-cat-chip').forEach(c => c.classList.remove('active'));
    }

    if (lpState.panelVisible){
      let hoveredIdx = -1;
      lpState.catRects.forEach((r, i) => {
        if (x > r.left-6 && x < r.right+6 && y > r.top-6 && y < r.bottom+6) hoveredIdx = i;
      });
      if (hoveredIdx !== lpState.highlightedCatIndex){
        const chips = lpState.panelEl.querySelectorAll('.lp-cat-chip');
        chips.forEach((c,i) => c.classList.toggle('active', i===hoveredIdx));
        if (hoveredIdx !== -1) hapticSelect();
        lpState.highlightedCatIndex = hoveredIdx;
      }
    }

    if (lpState.trashEl){
      const tr = lpState.trashRect;
      const pad = 18;
      const overTrash = tr && x > tr.left-pad && x < tr.left+tr.width+pad && y > tr.top-pad && y < tr.top+tr.height+pad;
      if (overTrash !== lpState.trashHover){
        lpState.trashEl.classList.toggle('hover', overTrash);
        if (overTrash) hapticSelect();
        lpState.trashHover = overTrash;
      }
    }
  }

  function lpTeardownDom(st){
    if (st.panelEl) st.panelEl.remove();
    if (st.heartEl) st.heartEl.remove();
    if (st.trashEl) st.trashEl.remove();
    if (st.cardEl2) st.cardEl2.remove();
    if (st.overlayEl) st.overlayEl.remove();
  }

  function lpAbort(){
    if (!lpState) return;
    if (lpState.timer) clearTimeout(lpState.timer);
    if (lpState.active){
      lpSuppressClicksUntil = Date.now() + 400;
      lpTeardownDom(lpState);
    }
    lpState = null;
  }

  function lpRelease(){
    if (!lpState) return;
    if (!lpState.active){
      clearTimeout(lpState.timer);
      const cardEl = lpState.cardEl;
      lpState = null;
      // Короткое касание (палец отпущен раньше, чем сработал долгий тап) —
      // открываем карточку сами, не дожидаясь нативного click от браузера.
      // На части устройств/веб-вью нативный click после touch иногда
      // «съедается», если браузер посчитал жест похожим на скролл —
      // из-за этого обычное нажатие на постер срабатывало через раз.
      lpTriggerTap(cardEl);
      return;
    }
    lpFinish();
  }

  function lpTriggerTap(cardEl){
    if (!cardEl) return;
    lpSuppressClicksUntil = Date.now() + 400;
    if (cardEl.hasAttribute('data-open')){
      const id = cardEl.getAttribute('data-open');
      if (state.movies.some(x => x.id === id)) openMovie(id);
    } else if (cardEl.hasAttribute('data-discover-pick')){
      previewTmdb(cardEl.getAttribute('data-discover-pick'), cardEl.getAttribute('data-discover-type'));
    }
  }

  async function lpFinish(){
    const st = lpState;
    if (!st) return;
    lpSuppressClicksUntil = Date.now() + 400;
    const trashHover = st.trashHover;
    const idx = st.highlightedCatIndex;
    const cat = (idx >= 0 && state.categories[idx]) ? state.categories[idx] : null;
    const ref = st.ref;
    lpTeardownDom(st);
    lpState = null;

    if (trashHover){
      const ok = await lpDeleteFromCategory(ref);
      if (ok){
        hapticOk();
        lpToast('Удалено из категорий');
        render();
        if (state.view === 'search') renderSearchDropdown();
      } else {
        hapticErr();
        lpToast('Не удалось удалить фильм');
      }
      return;
    }

    if (!cat) return;
    const result = await lpAddToCategory(ref, cat.v);
    if (result === 'already'){
      hapticSelect();
      lpToast('Уже есть в «' + cat.l + '»');
      return;
    }
    if (result){
      hapticOk();
      lpToast('Добавлено в «' + cat.l + '»');
      render();
      if (state.view === 'search') renderSearchDropdown();
      const addedMovie = lpResolveMovieAfterAdd(ref);
      if (addedMovie && addedMovie.myRating == null) lpShowRatingSheet(addedMovie);
    } else {
      hapticErr();
      lpToast('Не удалось добавить фильм');
    }
  }

  function lpResolveMovieAfterAdd(ref){
    if (!ref) return null;
    if (ref.kind === 'library') return state.movies.find(x => x.id === ref.id) || null;
    if (ref.kind === 'tmdb') return state.movies.find(x => String(x.tmdbId) === String(ref.tmdbId)) || null;
    return null;
  }

  // Минималистичная шторка с оценкой, которая появляется сразу после того,
  // как фильм добавили в категорию через долгое нажатие на постер.
  // Позволяет сразу поставить оценку 1-10 или пропустить кнопкой «Не оценивать».
  function lpRatingTierColor(i){
    if (i <= 3) return '#c9935a';
    if (i <= 6) return '#e8c94a';
    if (i <= 9) return '#34d399';
    return '#ffc94d';
  }

  function lpShowRatingSheet(movie){
    const overlay = document.createElement('div');
    overlay.className = 'lp-rate-overlay';
    const starsHtml = [];
    for (let i = 1; i <= 10; i++){
      starsHtml.push('<button type="button" class="lp-rate-btn" data-rate="'+i+'" style="--tier-color:'+lpRatingTierColor(i)+';" title="Оценка '+i+'">'+icon('star', 16)+'<span>'+i+'</span></button>');
    }
    overlay.innerHTML = ''
      + '<div class="lp-rate-panel">'
      +   '<div class="modal-title">Оцените фильм</div>'
      +   '<div class="modal-msg">«'+escapeHtml(movie.title)+'»</div>'
      +   '<div class="lp-rate-grid">'+starsHtml.join('')+'</div>'
      +   '<button type="button" class="lp-rate-skip" id="lpRateSkipBtn">Не оценивать</button>'
      + '</div>';
    document.body.appendChild(overlay);

    const close = () => overlay.remove();

    // Небольшая защита от «призрачного» клика, который браузер иногда досылает сразу
    // после touchend долгого нажатия — без неё он мог долетать уже до новой панели
    // и мешать первому настоящему тапу по оценке.
    let ready = false;
    setTimeout(() => { ready = true; }, 80);

    overlay.querySelectorAll('.lp-rate-btn[data-rate]').forEach(btn => {
      btn.onclick = async () => {
        if (!ready) return;
        const r = parseInt(btn.getAttribute('data-rate'), 10);
        movie.myRating = r;
        hapticOk();
        close();
        await updateMovie(movie);
        render();
        if (state.view === 'search') renderSearchDropdown();
      };
    });

    const skipBtn = overlay.querySelector('#lpRateSkipBtn');
    if (skipBtn) skipBtn.onclick = () => { if (ready) close(); };

    overlay.addEventListener('click', e => { if (ready && e.target === overlay) close(); });
  }

  async function lpDeleteFromCategory(ref){
    if (!ref || ref.kind !== 'library') return false;
    const m = state.movies.find(x => x.id === ref.id);
    if (!m) return false;
    const ok = await deleteMovie(m.id);
    if (ok) state.movies = state.movies.filter(x => x.id !== m.id);
    return ok;
  }

  // Добавляет фильм в категорию, НЕ убирая его из тех категорий, где он уже состоит —
  // так один и тот же фильм можно закинуть и в «избранное», и в «смотреть позже», и т.д.
  // Возвращает true при успешном добавлении, 'already' если фильм уже там был, false при ошибке.
  async function lpAddToCategory(ref, catValue){
    if (!ref) return false;
    if (ref.kind === 'library'){
      const m = state.movies.find(x => x.id === ref.id);
      if (!m) return false;
      if (movieInCat(m, catValue)) return 'already';
      m.categories = (m.categories || []).concat([catValue]);
      if (!m.catAddedAt) m.catAddedAt = {};
      m.catAddedAt[catValue] = Date.now();
      const ok = await updateMovie(m);
      return ok;
    }
    if (ref.kind === 'tmdb'){
      const existing = state.movies.find(x => String(x.tmdbId) === String(ref.tmdbId));
      if (existing){
        if (movieInCat(existing, catValue)) return 'already';
        existing.categories = (existing.categories || []).concat([catValue]);
        if (!existing.catAddedAt) existing.catAddedAt = {};
        existing.catAddedAt[catValue] = Date.now();
        const ok = await updateMovie(existing);
        return ok;
      }
      try{
        const data = await tmdbFetch('/' + ref.mediaType + '/' + ref.tmdbId, state.tmdbKey);
        const mapped = mapTmdbItem(data, ref.mediaType);
        mapped.id = 'm_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5);
        mapped.addedAt = Date.now();
        mapped.categories = [catValue];
        mapped.catAddedAt = { [catValue]: mapped.addedAt };
        const ok = await addMovie(mapped);
        if (ok) state.movies.push(mapped);
        return ok;
      }catch(e){ return false; }
    }
    return false;
  }

  function lpToast(msg){
    const t = document.createElement('div');
    t.className = 'lp-toast';
    t.textContent = msg;
    document.body.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => {
      t.classList.remove('show');
      setTimeout(() => t.remove(), 260);
    }, 1500);
  }

  function initLongPressPreview(){
    document.addEventListener('touchstart', function(e){
      lpLastTouchTs = Date.now();
      const cardEl = e.target.closest('[data-open], [data-discover-pick]');
      if (!cardEl || e.target.closest('[data-quick-fav]')) return;
      const t = e.touches[0];
      lpStartPress(cardEl, t.clientX, t.clientY);
    }, {passive:true});

    document.addEventListener('touchmove', function(e){
      if (!lpState) return;
      const t = e.touches[0];
      if (lpState.active) e.preventDefault();
      lpMove(t.clientX, t.clientY);
    }, {passive:false});

    document.addEventListener('touchend', function(){ lpRelease(); }, {passive:true});
    document.addEventListener('touchcancel', function(){ lpAbort(); }, {passive:true});

    document.addEventListener('mousedown', function(e){
      if (e.button !== 0) return;
      if (Date.now() - lpLastTouchTs < 700) return;
      const cardEl = e.target.closest('[data-open], [data-discover-pick]');
      if (!cardEl || e.target.closest('[data-quick-fav]')) return;
      lpStartPress(cardEl, e.clientX, e.clientY);
      const onMove = ev => lpMove(ev.clientX, ev.clientY);
      const onUp = () => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        lpRelease();
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });

    document.addEventListener('contextmenu', function(e){
      if (lpState && lpState.active) e.preventDefault();
    });

    document.addEventListener('click', function(e){
      // Съедаем только один «призрачный» клик в коротком окне после долгого нажатия —
      // а не бессрочно, как раньше. Если жест был с перетаскиванием (drag к категории),
      // браузер зачастую вообще не шлёт click после touchend, и старый вариант с флагом
      // «съесть следующий клик» по ошибке гасил самый первый настоящий тап пользователя
      // где-нибудь ещё в приложении (например, по звезде оценки). Теперь окно само
      // истекает через 400мс, если ничего не прилетело.
      if (Date.now() < lpSuppressClicksUntil){
        lpSuppressClicksUntil = 0;
        e.stopPropagation();
        e.preventDefault();
      }
    }, true);
  }

  // Отслеживаем появление клавиатуры. Это Telegram Mini App, а WebView Telegram
  // не всегда честно шлёт стандартные события visualViewport — зато у самого
  // Telegram есть свой API: событие 'viewportChanged' и tg.viewportHeight /
  // tg.viewportStableHeight (последняя — высота БЕЗ учёта клавиатуры, она же
  // ориентир). Используем оба источника и берём максимум — какой сработает,
  // тот и победит. Двигаем только нижнюю панель поиска, сам #app не трогаем.
  function initKeyboardAwareViewport(){
    const root = document.documentElement;
    let kbTg = 0, kbVv = 0;

    function applyFinal(){
      const kb = Math.max(kbTg, kbVv);
      root.style.setProperty('--kb-inset', kb + 'px');
      document.body.classList.toggle('kb-open', kb > 60);
    }

    function bindTelegram(){
      if (!tg || !tg.onEvent || tg.__kbBound) return;
      tg.__kbBound = true;
      const update = () => {
        const stable = tg.viewportStableHeight || tg.viewportHeight || window.innerHeight;
        const current = tg.viewportHeight || stable;
        kbTg = Math.max(0, Math.round(stable - current));
        applyFinal();
      };
      tg.onEvent('viewportChanged', update);
      update();
    }
    bindTelegram();
    // SDK Telegram грузится асинхронно (см. loadTelegramSdkThenStart) — поэтому
    // недолго ждём и пробуем привязаться повторно, если tg ещё не был готов.
    let tries = 0;
    const retry = setInterval(() => {
      tries++;
      if (tg && tg.onEvent) { bindTelegram(); clearInterval(retry); }
      if (tries > 20) clearInterval(retry);
    }, 250);

    const vv = window.visualViewport;
    if (vv){
      let raf = null;
      const applyVv = () => {
        raf = null;
        kbVv = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        applyFinal();
      };
      const onChange = () => { if (raf) return; raf = requestAnimationFrame(applyVv); };
      vv.addEventListener('resize', onChange);
      vv.addEventListener('scroll', onChange);
      applyVv();
    }
  }

  initLongPressPreview();
  initDiscoverAutoUpdate();
  initKeyboardAwareViewport();
  initSearchBlurGlobalGuard();

  loadTelegramSdkThenStart();
})();
</script>
</body>
</html>
